<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="삼성전자·SK하이닉스 공식 뉴스룸 소식을 한국어로 요약하고, 기사마다 반도체 이론 단원을 이어 주는 개인 면접 공부 사이트">
<title>반도체 뉴스 트래커</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: market feed as a dated ledger with a study sidebar; theory as a building of 7 floors.
   Colors and type follow animations/player.css: cool grey ground, one copper accent. */
:root {
  --bg: #f2f4f6;
  --surface: #ffffff;
  --ink: #1a1f26;
  --muted: #5a6472;
  --faint: #8a93a0;
  --line: #d6dbe2;
  --line-strong: #a9b2bd;
  --tint: #e9edf1;
  --accent: #b5541a;
  --accent-ink: #9a4614;
  --accent-soft: #f6e3d5;
  --on-accent: #ffffff;
  --font-sans: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 10px;
  --tabbar: 0px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121519; --surface: #1a1e24; --ink: #e5e8ec; --muted: #9ba5b2; --faint: #6f7987;
    --line: #2d333b; --line-strong: #4a535e; --tint: #22272e;
    --accent: #ef8a4c; --accent-ink: #f3a273; --accent-soft: #3a2619; --on-accent: #1a1e24;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121519; --surface: #1a1e24; --ink: #e5e8ec; --muted: #9ba5b2; --faint: #6f7987;
  --line: #2d333b; --line-strong: #4a535e; --tint: #22272e;
  --accent: #ef8a4c; --accent-ink: #f3a273; --accent-soft: #3a2619; --on-accent: #1a1e24;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 80px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.65 var(--font-sans);
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px));
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
button { font: inherit; color: inherit; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--surface); padding: 8px 12px; z-index: 50; }
.skip:focus { left: 8px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; }
@media (min-width: 700px) { .wrap { padding-inline: 24px; } }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px);
  -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px);
}
.top-in { display: flex; align-items: center; gap: 20px; min-height: 58px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; min-width: 0; }
.brand svg { flex: none; }
.brand .name { font-weight: 800; font-size: 17px; letter-spacing: -0.01em; white-space: nowrap; }
.brand .tmp { font: 500 10.5px/1 var(--font-mono); color: var(--faint); border: 1px solid var(--line-strong); border-radius: 3px; padding: 3px 5px; white-space: nowrap; }
.tabs { display: flex; gap: 2px; }
.tabs a {
  display: flex; align-items: center; gap: 7px;
  text-decoration: none; font-weight: 600; font-size: 14.5px; color: var(--muted);
  padding: 8px 14px; border-radius: 999px;
}
.tabs a svg { width: 18px; height: 18px; display: none; }
.tabs a:hover { color: var(--ink); background: var(--surface); }
.tabs a[aria-current="page"] { color: var(--surface); background: var(--ink); }
.stamp { margin-left: auto; font: 12px/1.4 var(--font-mono); color: var(--muted); text-align: right; white-space: nowrap; }
.stamp b { color: var(--ink); font-weight: 500; }
@media (max-width: 759px) {
  :root { --tabbar: 62px; }
  /* a backdrop filter would make the header the containing block of the fixed tab bar */
  .top { backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--bg); }
  .top-in { min-height: 52px; }
  .stamp { font-size: 11px; }
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
    justify-content: space-around; gap: 0;
  }
  .tabs a { flex: 1; flex-direction: column; gap: 2px; font-size: 11.5px; padding: 6px 4px; border-radius: 8px; justify-content: center; }
  .tabs a svg { display: block; }
  .tabs a[aria-current="page"] { background: transparent; color: var(--accent); }
}
@media (max-width: 420px) { .brand .tmp { display: none; } }

/* ---------- shared bits ---------- */
main { padding-block: 24px 64px; outline: none; }
.page-head { display: grid; gap: 6px; margin-bottom: 18px; }
.page-head h1 { margin: 0; font-size: clamp(24px, 3.4vw, 30px); line-height: 1.25; letter-spacing: -0.015em; text-wrap: balance; }
.page-head .lead { margin: 0; color: var(--muted); max-width: 66ch; }
.eyebrow { font: 500 12px/1.4 var(--font-mono); letter-spacing: .06em; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.eyebrow a { text-decoration: none; border-bottom: 1px solid var(--line-strong); }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font: 500 13.5px/1 var(--font-sans); color: var(--ink);
  padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line-strong);
  background: transparent; cursor: pointer; text-decoration: none; white-space: nowrap;
}
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip .n { font: 500 11.5px/1 var(--font-mono); color: var(--faint); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }
.tag {
  display: inline-flex; align-items: center; font-size: 12.5px; line-height: 1; color: var(--muted);
  background: var(--tint); border-radius: 4px; padding: 5px 7px; text-decoration: none; white-space: nowrap;
}
a.tag:hover, button.tag:hover { color: var(--ink); background: var(--line); }
button.tag { border: 0; cursor: pointer; }
.stars { color: var(--accent); letter-spacing: .05em; font-size: 12px; white-space: nowrap; }
.stars .off { color: var(--line-strong); }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; align-content: start; }
.box h2 { margin: 0; font-size: 14px; letter-spacing: .01em; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.box h2 small { font: 400 12px var(--font-mono); color: var(--faint); }
.note { font-size: 12.5px; color: var(--muted); margin: 0; }
.bar { height: 6px; border-radius: 3px; background: var(--tint); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.state { padding: 48px 0; color: var(--muted); }
.state b { color: var(--ink); display: block; font-size: 17px; margin-bottom: 4px; }
.skeleton { height: 120px; border-bottom: 1px solid var(--line); background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--line) 60%, transparent), transparent); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.section-title { display: flex; align-items: baseline; gap: 12px; margin: 34px 0 10px; }
.section-title h2 { margin: 0; font-size: 18px; letter-spacing: -0.01em; }
.section-title span { font: 12px var(--font-mono); color: var(--faint); }

/* ---------- news ---------- */
.news-grid { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.news-main { min-width: 0; }
.news-side { display: grid; gap: 14px; min-width: 0; }
@media (min-width: 960px) {
  .news-grid { grid-template-columns: minmax(0, 1fr) 312px; gap: 36px; }
  .news-side { position: sticky; top: 76px; max-height: calc(100vh - 92px); overflow-y: auto; padding-bottom: 8px; scrollbar-width: thin; }
}
.week-mobile { margin-bottom: 18px; }
@media (min-width: 960px) { .week-mobile { display: none; } }
@media (max-width: 959px) { .news-side { display: none; } }
.filters { display: grid; gap: 10px; margin-bottom: 6px; }
.frow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.flabel { font: 600 12px/1 var(--font-sans); color: var(--faint); min-width: 2.6em; }
.search { flex: 1 1 220px; min-width: 0; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); border-radius: 999px; padding: 0 12px; background: var(--surface); }
.search:focus-within { border-color: var(--ink); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: 14px/1 var(--font-sans); color: var(--ink); padding: 9px 0; }
.search svg { flex: none; color: var(--faint); }
.result { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; min-height: 30px; }
.active-tag { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); color: var(--accent-ink); border-radius: 999px; padding: 5px 6px 5px 11px; font-weight: 600; font-size: 13px; text-decoration: none; }
.active-tag span { font-size: 15px; line-height: 1; padding: 0 4px; }
/* period: one row per year (newest first), months January → December */
.period { display: grid; gap: 6px; }
.yrow { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 8px; align-items: stretch; }
.mgrid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; }
.ychip, .mchip {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font: 600 13px/1.1 var(--font-sans); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 7px 2px 6px; cursor: pointer; min-width: 0;
}
.ychip { font-size: 14px; }
.ychip .n, .mchip .n { font: 400 11px/1 var(--font-mono); color: var(--faint); min-height: 11px; }
.ychip:hover, .mchip:hover { border-color: var(--accent); }
.ychip[aria-pressed="true"], .mchip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.ychip[aria-pressed="true"] .n, .mchip[aria-pressed="true"] .n { color: inherit; opacity: .7; }
.ychip:disabled, .mchip:disabled { cursor: default; color: var(--faint); background: transparent; border-style: dashed; border-color: var(--line); opacity: .7; }
@media (max-width: 599px) {
  .yrow { grid-template-columns: minmax(0, 1fr); }
  .ychip { flex-direction: row; justify-content: flex-start; gap: 8px; padding: 8px 10px; }
  .mgrid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
}
.month { display: flex; align-items: baseline; gap: 12px; margin: 28px 0 0; scroll-margin-top: 80px; }
.more { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; padding: 22px 0 8px; font-size: 13px; color: var(--muted); min-height: 72px; }
.more:empty { display: none; }
.more-count { font: 12px var(--font-mono); color: var(--faint); }
.month h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .06em; color: var(--muted); }
.month span { font: 12px var(--font-mono); color: var(--faint); }
.month::after { content: ""; flex: 1; border-top: 1px solid var(--line-strong); transform: translateY(-4px); }
.entries { list-style: none; margin: 0; padding: 0; }
.entry { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 18px; padding: 22px 0; border-bottom: 1px solid var(--line); }
.when { font-family: var(--font-mono); font-variant-numeric: tabular-nums; padding-top: 2px; }
.when .d { display: block; font-size: 17px; font-weight: 500; line-height: 1.2; }
.when .w { font-size: 12px; color: var(--faint); }
.e-body { min-width: 0; display: grid; gap: 8px; }
.e-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.co { font-weight: 700; font-size: 12px; color: var(--ink); border: 1.5px solid var(--ink); border-radius: 4px; padding: 2px 6px; line-height: 1.3; white-space: nowrap; }
.channel { font: 500 12px var(--font-mono); letter-spacing: .02em; }
.badge { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--muted); white-space: nowrap; line-height: 1.5; }
.badge.fact { border-color: var(--accent); color: var(--accent-ink); }
.badge.guest { border-style: dashed; }
.e-title { margin: 0; font-size: 18.5px; line-height: 1.4; letter-spacing: -0.01em; text-wrap: pretty; }
.e-title a { text-decoration: none; }
.e-title a:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.orig { margin: -4px 0 0; font-size: 13px; color: var(--faint); }
.e-sum { margin: 0; display: grid; gap: 4px; padding: 0; list-style: none; color: var(--ink); max-width: 72ch; }
.say { margin: 2px 0 0; border-left: 3px solid var(--accent); background: color-mix(in srgb, var(--accent-soft) 55%, transparent); padding: 8px 12px; border-radius: 0 6px 6px 0; font-size: 14.5px; max-width: 72ch; }
.say b { display: block; font-size: 11.5px; color: var(--accent-ink); letter-spacing: .04em; margin-bottom: 1px; }
.e-foot { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 2px; }
.e-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.units { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.units .lab { font-size: 12px; color: var(--faint); }
.ulink { display: inline-flex; gap: 6px; align-items: center; text-decoration: none; font-size: 13px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; background: var(--surface); }
.ulink:hover { border-color: var(--accent); }
.ulink .code { font: 600 12px var(--font-mono); color: var(--accent-ink); }
.ulink.read::after { content: "✓"; color: var(--accent); font-size: 12px; }
.out { margin-left: auto; font-size: 13px; color: var(--muted); text-decoration: none; white-space: nowrap; }
.out:hover { color: var(--ink); text-decoration: underline; }
@media (max-width: 599px) {
  .entry { grid-template-columns: minmax(0, 1fr); gap: 6px; padding: 18px 0; }
  .when { display: flex; gap: 6px; align-items: baseline; }
  .when .d { display: inline; font-size: 13px; }
  .e-title { font-size: 17px; }
  .out { margin-left: 0; }
}
.side-week ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.side-week a { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; text-decoration: none; padding: 7px 8px; margin-inline: -8px; border-radius: 6px; }
.side-week a:hover { background: var(--bg); }
.side-week .code { font: 600 12.5px var(--font-mono); color: var(--accent-ink); }
.side-week .t { font-size: 14px; line-height: 1.4; }
.side-week .t small { display: block; font-size: 12px; color: var(--faint); }
.side-week .c { font: 12px var(--font-mono); color: var(--muted); white-space: nowrap; }
.side-week .read .t::after { content: " ✓"; color: var(--accent); }
.cloud { display: flex; flex-wrap: wrap; gap: 5px; }
details.alltags summary { cursor: pointer; font-size: 13px; color: var(--muted); }
details.alltags .grp { margin-top: 10px; }
details.alltags .grp b { display: block; font-size: 12px; color: var(--faint); margin-bottom: 4px; font-weight: 600; }
.prog-line { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.prog-line b { color: var(--ink); font: 500 13px var(--font-mono); }

/* ---------- theory map ---------- */
.theory-tools { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.prog-sum { display: flex; gap: 22px; flex-wrap: wrap; align-items: center; }
.prog-sum .k { display: grid; gap: 4px; min-width: 150px; }
.prog-sum .k span { font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }
.prog-sum .k b { font: 500 12.5px var(--font-mono); color: var(--ink); }
.guide-link { display: inline-flex; gap: 8px; align-items: center; font-weight: 600; font-size: 14px; text-decoration: none; color: var(--accent-ink); }
.guide-link:hover { text-decoration: underline; }
.floor { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 22px 0; border-top: 1px solid var(--line-strong); }
.floor:first-of-type { border-top: 0; }
@media (min-width: 860px) { .floor { grid-template-columns: 220px minmax(0, 1fr); gap: 28px; } }
.f-rail { display: grid; gap: 6px; align-content: start; }
.f-num { display: flex; align-items: baseline; gap: 8px; }
.f-num .big { font: 600 34px/1 var(--font-mono); letter-spacing: -0.03em; }
.f-num .lv { font: 500 12px var(--font-mono); color: var(--faint); }
.f-rail h2 { margin: 0; font-size: 17px; letter-spacing: -0.01em; }
.f-rail p { margin: 0; font-size: 13px; color: var(--muted); }
.f-rail .f-prog { display: grid; gap: 4px; max-width: 200px; }
.f-rail .f-prog span { font: 12px var(--font-mono); color: var(--faint); }
.tiles { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 232px), 1fr)); align-content: start; }
.tile { display: grid; gap: 6px; align-content: start; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 11px 13px 12px; min-height: 104px; position: relative; }
.tile:hover { border-color: var(--accent); }
.tile-top { display: flex; align-items: center; gap: 8px; }
.tile-top .code { font: 600 12.5px var(--font-mono); color: var(--accent-ink); }
.tile-top .done { margin-left: auto; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 11px; display: grid; place-items: center; font-weight: 700; }
.tile-title { font-size: 14.5px; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tile-meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--faint); margin-top: auto; }
.tile.is-read { background: color-mix(in srgb, var(--surface) 60%, var(--bg)); }
.tile.is-read .tile-title { color: var(--muted); }
.tile.dim { display: none; }
.floor.empty { display: none; }

/* ---------- unit page ---------- */
.unit-head { display: grid; gap: 10px; margin-bottom: 8px; }
.unit-head h1 { margin: 0; font-size: clamp(23px, 3.3vw, 31px); line-height: 1.3; letter-spacing: -0.015em; text-wrap: balance; max-width: 30ch; }
.unit-code { font: 600 13px var(--font-mono); color: var(--accent-ink); border: 1px solid var(--accent); border-radius: 999px; padding: 3px 9px; }
.freq { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); }
.unit-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 7px; font: 600 14px/1 var(--font-sans); padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--ink); }
.btn.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.unit-meta { display: grid; gap: 8px; padding: 8px 0 4px; margin-top: 2px; }
.unit-meta .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.unit-meta .row > b { font-size: 12px; color: var(--faint); font-weight: 600; min-width: 5.5em; }
.unit-toc { display: flex; flex-wrap: wrap; gap: 4px 2px; align-items: center; margin: 4px 0 18px; padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.unit-toc b { font-size: 12px; color: var(--faint); font-weight: 600; margin-right: 8px; }
.unit-toc a { text-decoration: none; font-size: 13.5px; color: var(--muted); padding: 4px 8px; border-radius: 6px; white-space: nowrap; }
.unit-toc a:hover { color: var(--ink); background: var(--surface); }
.unit-toc a.anim-jump { color: var(--accent-ink); font-weight: 600; }

/* rendered manuscript */

  var lastRoute = null;
  function route() {
    if (!S.loaded) return;

    if (/^(sec-\d+|anim|unit-news|n-.+)$/.test(hash)) return; // in-page anchors

  }

  }

  }).catch(function (err) {

    S.error = err && err.message ? err.message : "알 수 없는 오류";
