<svg xmlns="http://www.w3.org/2000/svg" width="760" height="236" viewBox="0 0 760 236" role="img" aria-label="반도체는 도체와 절연체 사이에서 전도도를 바꿀 수 있는 물질" font-size="13" class="fig"><title>반도체는 도체와 절연체 사이에서 전도도를 바꿀 수 있는 물질</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="u01-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-edge"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" class="f-ink">반도체는 도체와 절연체 사이에서 전도도를 바꿀 수 있는 물질</text><g><line x1="40" y1="76" x2="714" y2="76" stroke-width="1.25" marker-end="url(#u01-arrow)" class="s-edge"></line><text x="40" y="66" font-size="11.5" class="f-quiet">전기가 거의 안 흐름</text><text x="716" y="66" font-size="11.5" text-anchor="end" class="f-quiet">전기가 잘 흐름</text></g><g><rect x="40" y="92" width="216" height="52" rx="8" fill="none" stroke-width="1.25" class="s-edge"></rect><text x="148" y="123" text-anchor="middle" font-size="14" font-weight="600" class="f-ink">절연체</text><text x="148" y="168" text-anchor="middle" class="f-ink">유리, 산화막(SiO₂), 고무</text><text x="148" y="188" text-anchor="middle" font-size="11.5" class="f-quiet">비저항 10¹⁰ Ω·cm 이상</text></g><g><rect x="272" y="92" width="216" height="52" rx="8" fill-opacity="0.12" stroke-width="2" class="f-acc s-acc"></rect><text x="380" y="123" text-anchor="middle" font-size="14" font-weight="600" class="f-ink">반도체</text><text x="380" y="168" text-anchor="middle" class="f-ink">실리콘(Si), 저마늄(Ge), SiC</text><text x="380" y="188" text-anchor="middle" font-size="11.5" class="f-quiet">도핑·온도·빛·전압으로 조절</text></g><g><rect x="504" y="92" width="212" height="52" rx="8" fill="none" stroke-width="1.25" class="s-edge"></rect><text x="610" y="123" text-anchor="middle" font-size="14" font-weight="600" class="f-ink">도체</text><text x="610" y="168" text-anchor="middle" class="f-ink">구리, 은, 알루미늄</text><text x="610" y="188" text-anchor="middle" font-size="11.5" class="f-quiet">구리 약 1.7×10⁻⁶ Ω·cm</text></g><text x="24" y="222" font-size="11.5" class="f-quiet">같은 실리콘이라도 불순물을 아주 조금 넣으면 전도도가 수백만 배 이상 달라집니다</text></svg>
