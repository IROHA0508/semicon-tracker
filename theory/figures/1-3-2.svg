<svg xmlns="http://www.w3.org/2000/svg" width="760" height="302" viewBox="0 0 760 302" role="img" aria-label="원자 준위에서 에너지 밴드가 생기고 전자가 들뜨고 재결합하는 네 단계" font-size="12" class="fig"><title>원자 준위에서 에너지 밴드가 생기고 전자가 들뜨고 재결합하는 네 단계</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="u13b-ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-edge"></path></marker><marker id="u13b-aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-acc"></path></marker><marker id="u13b-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-acc2"></path></marker></defs><text x="24" y="26" font-size="15" font-weight="600" class="f-ink">에너지 밴드가 생기고 전자가 움직이는 순서</text><rect x="24" y="44" width="172" height="212" fill="none" stroke-width="1" rx="10" class="s-edge"></rect><text x="34" y="64" font-size="12" font-weight="600" class="f-ink">① 원자 하나</text><text x="34" y="230" font-size="11.5" class="f-quiet">정해진 준위에만</text><text x="34" y="246" font-size="11.5" class="f-quiet">전자가 있을 수 있음</text><line x1="197" y1="140" x2="203" y2="140" stroke-width="1.5" marker-end="url(#u13b-ae)" class="s-edge"></line><rect x="204" y="44" width="172" height="212" fill="none" stroke-width="1" rx="10" class="s-edge"></rect><text x="214" y="64" font-size="12" font-weight="600" class="f-ink">② 원자가 많이 모이면</text><text x="214" y="230" font-size="11.5" class="f-quiet">준위가 촘촘히 갈라져</text><text x="214" y="246" font-size="11.5" class="f-quiet">띠(밴드)가 됨</text><line x1="377" y1="140" x2="383" y2="140" stroke-width="1.5" marker-end="url(#u13b-ae)" class="s-edge"></line><rect x="384" y="44" width="172" height="212" fill="none" stroke-width="1" rx="10" class="s-edge"></rect><text x="394" y="64" font-size="12" font-weight="600" class="f-ink">③ 가전자대·전도대</text><text x="394" y="230" font-size="11.5" class="f-quiet">아래 띠는 전자로 가득,</text><text x="394" y="246" font-size="11.5" class="f-quiet">위 띠는 비어 있음</text><line x1="557" y1="140" x2="563" y2="140" stroke-width="1.5" marker-end="url(#u13b-ae)" class="s-edge"></line><rect x="564" y="44" width="172" height="212" fill="none" stroke-width="1" rx="10" class="s-edge"></rect><text x="574" y="64" font-size="12" font-weight="600" class="f-ink">④ 들뜸과 재결합</text><text x="574" y="230" font-size="11.5" class="f-quiet">올라간 전자와 남은 정공이</text><text x="574" y="246" font-size="11.5" class="f-quiet">전류를 나르고, 만나면 재결합</text><line x1="64" y1="96" x2="156" y2="96" stroke-width="2" class="s-ink"></line><line x1="64" y1="136" x2="156" y2="136" stroke-width="2" class="s-ink"></line><line x1="64" y1="176" x2="156" y2="176" stroke-