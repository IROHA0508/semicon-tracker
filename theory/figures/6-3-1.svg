" font-size="12.5" font-weight="600" class="f-ink">④ 대책·재발 방지</text><text x="656" y="193" text-anchor="middle" font-size="11.5" class="f-quiet">즉시·근본·모니터링</text><text x="200" y="264" text-anchor="middle" font-size="12.5" font-weight="600" class="f-ink">① 사실</text><text x="200" y="283" text-anchor="middle" font-size="11.5" class="f-quiet">숫자·출처·시점</text><text x="352" y="264" text-anchor="middle" font-size="12.5" font-weight="600" class="f-ink">② 해석</text><text x="352" y="283" text-anchor="middle" font-size="11.5" class="f-quiet">두 관점을 함께</text><text x="504" y="264" text-anchor="middle" font-size="12.5" font-weight="600" class="f-ink">③ 영향</text><text x="504" y="283" text-anchor="middle" font-size="11.5" class="f-quiet">회사·제품·고객</text><text x="656" y="264" text-anchor="middle" font-size="12.5" font-weight="600" class="f-ink">④ 나의 역할</text><text x="656" y="283" text-anchor="middle" font-size="11.5" class="f-quiet">직무에서 할 일</text><text x="24" y="320" font-size="11.5" class="f-quiet">모든 답은 30초 요약으로 시작하고, 꼬리 질문이 오면 1~2분으로 넓힙니다</text></svg>
