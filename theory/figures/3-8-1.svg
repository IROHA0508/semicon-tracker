<svg xmlns="http://www.w3.org/2000/svg" width="760" height="372" viewBox="0 0 760 372" role="img" aria-label="이온주입기 구성, 깊이별 농도 분포, 열처리 방식 비교" font-size="13" class="fig"><title>이온주입기 구성, 깊이별 농도 분포, 열처리 방식 비교</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="u38-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-edge"></path></marker></defs><text x="24" y="26" font-size="15" font-weight="600" class="f-ink">이온을 골라 가속해 박고 짧고 뜨겁게 열처리해 제자리에 앉힙니다</text><g><text x="24" y="54" font-weight="600" class="f-ink">① 이온주입기: 만들고 고르고 가속해서, 쏜다</text><rect x="30" y="110" width="70" height="40" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="140" y="96" width="80" height="68" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="266" y="110" width="64" height="40" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="346" y="110" width="64" height="40" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><path d="M100 130H140" fill="none" stroke-width="2" class="s-acc"></path><path d="M140 130Q180 130 220 112" fill="none" stroke-width="1.5" stroke-dasharray="3 3" class="s-acc"></path><path d="M140 130Q180 130 220 148" fill="none" stroke-width="1.5" stroke-dasharray="3 3" class="s-acc"></path><path d="M140 130H264" fill="none" stroke-width="2.25" marker-end="url(#u38-arrow)" class="s-acc"></path><path d="M232 96V124M232 136V164" fill="none" stroke-width="2" class="s-ink"></path><path d="M330 130H344" fill="none" stroke-width="2.25" class="s-acc"></path><path d="M410 130H424" fill="none" stroke-width="2.25" marker-end="url(#u38-arrow)" class="s-acc"></path><rect x="426" y="100" width="8" height="60" fill-opacity="0.6" stroke-width="1.25" transform="rotate(7 430 130)" class="f-acc2 s-acc2"></rect><text x="65" y="135" text-anchor="middle" font-size="12" class="f-ink">이온 소스</text><text x="180" y="182" text-anchor="middle" font-size="11.5" class="f-ink">질량 분석 자석</text><text x="180" y="198" text-anchor="middle" font-size="11.5" class="f-quiet">원하는 이온만 슬릿 통과</text><text x="298" y="135" text-anchor="middle" font-size="12" class="f-ink">가속기</text><text x="378" y="135" text-anchor="middle" font-size="12" class="f-ink">주사·집속</text><text x="430" y="182" text-anchor="middle" font-size="11.5" class="f-ink">웨이퍼</text><text x="430" y="198" text-anchor="middle" font-size="11.5" class="f-quiet">약 7° 기울임</text><text x="298" y="94" text-anchor="middle" font-size="11.5" class="f-quiet">에너지 = 깊이</text><text x="65" y="94" text-anchor="middle" font-size="11.5" class="f-quiet">가스 → 양이온</text></g><g><text x="470" y="54" font-weight="600" class="f-ink">② 깊이별 농도 분포</text><path d="M490 210H730" fill="none" stroke-width="1.25" marker-end="url(#u38-arrow)" class="s-edge"></path><path d="M490 210V68" fill="none" stroke-width="1.25" marker-end="url(#u38-arrow)" class="s-edge"></path><path d="M570 210V90" fill="none" stroke-width="1" stroke-dasharray="4 3" class="s-edge"></path><path d="M492 206C520 204 540 92 570 90C600 92 620 204 680 207" fill="none" stroke-width="2.25" class="s-acc"></path><path d="M628 188C660 192 690 196 726 200" fill="none" stroke-width="1.75" stroke-dasharray="5 4" class="s-acc2"></path><path d="M492 200C530 190 540 130 580 128C620 130 640 190 700 205" fill="none" stroke-width="1.5" stroke-dasharray="2 3" class="s-ink"></path><path d="M548 156H592" fill="none" stroke-width="1.25" marker-start="url(#u38-arrow)" marker-end="url(#u38-arrow)" class="s-edge"></path><text x="570" y="226" text-anchor="middle" font-size="12" font-weight="600" class="f-ink">Rp</text><text x="596" y="160" font-size="11.5" class="f-quiet">ΔRp</text><text x="580" y="84" font-size="11.5" class="f-ink">주입 직후(가우시안)</text><text x="640" y="122" font-size="11.5" class="f-quiet">열처리 후 퍼짐</text><text x="726" y="184" text-anchor="end" font-size="11.5" class="f-ink">채널링 꼬리</text><text x="498" y="76" font-size="11.5" class="f-quiet">농도</text><text x="730" y="226" text-anchor="end" font-size="11.5" class="f-quiet">깊이</text></g><g><text x="24" y="254" font-weight="600" class="f-ink">③ 열처리 방식: 더 짧고 더 뜨겁게</text><g><rect x="24" y="266" width="170" height="76" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect></g><g><rect x="204" y="266" width="170" height="76" rx="8" fill-opacity="0.12" stroke-width="2" class="f-acc s-acc"></rect></g><g><rect x="384" y="266" width="170" height="76" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect></g><g><rect x="564" y="266" width="170" height="76" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect></g><path d="M195 304H203" fill="none" stroke-width="1.25" class="s-edge"></path><path d="M375 304H383" fill="none" stroke-width="1.25" class="s-edge"></path><path d="M555 304H563" fill="none" stroke-width="1.25" class="s-edge"></path><text x="36" y="288" font-weight="600" class="f-ink">퍼니스</text><text x="36" y="308" font-size="11.5" class="f-quiet">수십 분 이상, 한 번에 다수</text><text x="36" y="326" font-size="11.5" class="f-quiet">확산이 커 얕은 접합에 불리</text><text x="216" y="288" font-weight="600" class="f-ink">RTA(RTP)</text><text x="216" y="308" font-size="11.5" class="f-quiet">램프로 약 1,000 °C, 수 초</text><text x="216" y="326" font-size="11.5" class="f-quiet">확산 억제·활성화 균형</text><text x="396" y="288" font-weight="600" class="f-ink">스파이크·플래시</text><text x="396" y="308" font-size="11.5" class="f-quiet">최고 온도에 아주 짧게</text><text x="396" y="326" font-size="11.5" class="f-quiet">더 얕은 접합</text><text x="576" y="288" font-weight="600" class="f-ink">레이저 어닐링</text><text x="576" y="308" font-size="11.5" class="f-quiet">표면만 ns~μs 가열</text><text x="576" y="326" font-size="11.5" class="f-quiet">가장 얕음, 국부 응력 주의</text><text x="24" y="362" font-size="11.5" class="f-quiet">오른쪽으로 갈수록 시간이 짧아 도펀트가 덜 퍼지고 점결함에 의한 일시적 증속 확산(TED)도 줄어듭니다</text></g></svg>
