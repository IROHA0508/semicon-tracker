<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-label="레일리 식의 세 손잡이: 파장, NA, k1" font-size="13" class="fig"><title>레일리 식의 세 손잡이: 파장, NA, k1</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><text x="24" y="26" font-size="15" font-weight="600" class="f-ink">해상도는 파장, 렌즈 크기(NA), 공정 기술(k₁) 세 손잡이로 정해집니다</text><text x="380" y="58" text-anchor="middle" font-size="16" font-weight="600" class="f-ink">해상도 R = k₁ × λ / NA</text><text x="380" y="80" text-anchor="middle" font-size="12" class="f-quiet">초점심도 DOF = k₂ × λ / NA² (작을수록 더 작게 그릴 수 있음)</text><g><text x="24" y="104" font-weight="600" class="f-ink">① λ 줄이기 · 광원</text><rect x="84" y="120" width="130" height="16" rx="2" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="84" y="146" width="108.83" height="16" rx="2" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="84" y="172" width="73.945" height="16" rx="2" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="84" y="198" width="57.546" height="16" rx="2" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="84" y="224" width="4.025" height="16" rx="2" fill-opacity="0.5" stroke-width="1.25" class="f-acc s-acc"></rect><text x="24" y="132" font-size="12" class="f-ink">g-line</text><text x="24" y="158" font-size="12" class="f-ink">i-line</text><text x="24" y="184" font-size="12" class="f-ink">KrF</text><text x="24" y="210" font-size="12" class="f-ink">ArF</text><text x="24" y="236" font-size="12" font-weight="600" class="f-ink">EUV</text><text x="220" y="132" font-size="11.5" class="f-quiet">436 nm</text><text x="199" y="158" font-size="11.5" class="f-quiet">365 nm</text><text x="164" y="184" font-size="11.5" class="f-quiet">248 nm</text><text x="148" y="210" font-size="11.5" class="f-quiet">193 nm</text><text x="94" y="236" font-size="11.5" font-weight="600" class="f-ink">13.5 nm</text><text x="24" y="264" font-size="11.5" class="f-quiet">짧은 빛일수록 회절이 작아 더 작게</text><text x="24" y="282" font-size="11.5" class="f-quiet">EUV는 흡수가 커서 진공·거울 광학계</text></g><g><text x="284" y="104" font-weight="600" class="f-ink">② NA 키우기 · 렌즈</text><rect x="390" y="120" width="55.111" height="16" rx="2" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="390" y="146" width="80" height="16" rx="2" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="390" y="172" width="19.556" height="16" rx="2" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="390" y="198" width="32.593" height="16" rx="2" fill-opacity="0.5" stroke-width="1.25" class="f-acc s-acc"></rect><text x="284" y="132" font-size="12" class="f-ink">건식 ArF</text><text x="284" y="158" font-size="12" class="f-ink">ArF 이머전</text><text x="284" y="184" font-size="12" class="f-ink">EUV</text><text x="284" y="210" font-size="12" font-weight="600" class="f-ink">High-NA EUV</text><text x="451" y="132" font-size="11.5" class="f-quiet">0.93</text><text x="476" y="158" font-size="11.5" class="f-quiet">1.35</text><text x="416" y="184" font-size="11.5" class="f-quiet">0.33</text><text x="429" y="210" font-size="11.5" font-weight="600" class="f-ink">0.55</text><text x="284" y="264" font-size="11.5" class="f-quiet">NA = n·sinθ, 물을 채우면 1을 넘음</text><text x="284" y="282" font-size="11.5" class="f-quiet">대신 DOF는 NA²에 반비례해 줄어듦</text></g><g><text x="520" y="104" font-weight="600" class="f-ink">③ k₁ 줄이기 · 공정 기술</text><rect x="520" y="112" width="216" height="26" rx="6" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="520" y="144" width="216" height="26" rx="6" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="520" y="176" width="216" height="26" rx="6" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="520" y="208" width="216" height="26" rx="6" stroke-width="1.25" class="f-tint s-edge"></rect><text x="530" y="129" font-size="11.5" class="f-ink">OAI: 빛을 비스듬히 넣는 조명</text><text x="530" y="161" font-size="11.5" class="f-ink">OPC: 번짐을 미리 보정한 마스크</text><text x="530" y="193" font-size="11.5" class="f-ink">PSM: 위상을 뒤집는 마스크</text><text x="530" y="225" font-size="11.5" class="f-ink">멀티 패터닝: LELE·SADP·SAQP</text><text x="520" y="264" font-size="11.5" class="f-quiet">k₁ 이론 한계 = 0.25</text><text x="520" y="282" font-size="11.5" class="f-quiet">그 아래는 한 번 노광으로 불가능</text></g><text x="380" y="318" text-anchor="middle" font-size="12" class="f-ink">장비 스펙(λ, NA)이 정해지면, k₁을 줄이는 기술로 한 번 더 작게 그립니다</text></svg>
