"></rect><circle cx="122" cy="300" r="3.5" class="f-acc"></circle><line x1="122" y1="306" x2="122" y2="356" stroke-width="1.5" marker-end="url(#u36r-aa)" class="s-acc"></line><circle cx="136" cy="300" r="3.5" class="f-acc"></circle><line x1="136" y1="306" x2="136" y2="356" stroke-width="1.5" marker-end="url(#u36r-aa)" class="s-acc"></line><circle cx="150" cy="300" r="3.5" class="f-acc"></circle><line x1="150" y1="306" x2="150" y2="356" stroke-width="1.5" marker-end="url(#u36r-aa)" class="s-acc"></line><path d="M288 352 H350 V378 H410 V352 H472 V402 H288 Z" fill-opacity="0.2" stroke-width="1" class="f-acc2 s-edge"></path><rect x="288" y="402" width="184" height="12" stroke-width="1" class="f-tint s-edge"></rect><rect x="288" y="340" width="62" height="12" fill-opacity="0.3" stroke-width="1" class="f-acc s-acc"></rect><rect x="410" y="340" width="62" height="12" fill-opacity="0.3" stroke-width="1" class="f-acc s-acc"></rect><rect x="360" y="364" width="8" height="8" fill="none" stroke-width="1.2" class="s-ink"></rect><rect x="378" y="352" width="8" height="8" fill="none" stroke-width="1.2" class="s-ink"></rect><rect x="394" y="340" width="8" height="8" fill="none" stroke-width="1.2" class="s-ink"></rect><line x1="382" y1="322" x2="382" y2="300" stroke-width="1.2" marker-end="url(#u36r-ai)" class="s-ink"></line><path d="M532 352 H594 V402 H654 V352 H716 V402 H532 Z" fill-opacity="0.2" stroke-width="1" class="f-acc2 s-edge"></path><rect x="532" y="402" width="184" height="12" stroke-width="1" class="f-tint s-edge"></rect><rect x="532" y="340" width="62" height="12" fill-opacity="0.3" stroke-width="1" class="f-acc s-acc"></rect><rect x="654" y="340" width="62" height="12" fill-opacity="0.3" stroke-width="1" class="f-acc s-acc"></rect><line x1="595.5" y1="352" x2="595.5" y2="402" stroke-width="3" class="s-acc2"></line><line x1="652.5" y1="352" x2="652.5" y2="402" stroke-width="3" class="s-acc2"></line><line x1="624" y1="362" x2="624" y2="300" stroke-width="1.5" marker-end="url(#u36r-ai)" class="s-ink"></line><text x="636" y="310" font-size="11.5" font-weight="600" class="f-ink">펌프로</text><text x="532" y="432" font-size="11.5" class="f-quiet">옆벽의 굵은 선 = 보호막</text><text x="24" y="500" font-size="11.5" class="f-quiet">빈 원 = 라디칼(반응을 일으키는 중성 입자), 채운 점 = 이온, 빈 네모 = 반응 생성물(기체). 위 덮개 = PR 마스크.</text></svg>
