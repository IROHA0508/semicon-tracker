<svg xmlns="http://www.w3.org/2000/svg" width="760" height="512" viewBox="0 0 760 512" role="img" aria-label="반응성 이온 식각의 여섯 단계: 플라즈마 생성, 반응종 이동, 흡착, 이온 보조 반응, 탈착, 배출과 수직 프로파일" font-size="12" class="fig"><title>반응성 이온 식각의 여섯 단계: 플라즈마 생성, 반응종 이동, 흡착, 이온 보조 반응, 탈착, 배출과 수직 프로파일</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="u36r-aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-acc"></path></marker><marker id="u36r-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-acc2"></path></marker><marker id="u36r-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ink"></path></marker></defs><text x="24" y="26" font-size="15" font-weight="600" class="f-ink">반응성 이온 식각(RIE) 6단계: 화학 반응을 이온이 아래쪽으로만 도와줍니다</text><rect x="24" y="44" width="224" height="210" fill="none" stroke-width="1" rx="10" class="s-edge"></rect><text x="36" y="64" font-size="12.5" font-weight="600" class="f-ink">① 플라즈마 만들기</text><text x="36" y="230" font-size="11.5" class="f-quiet">가스를 플라즈마로 바꿔</text><text x="36" y="246" font-size="11.5" class="f-quiet">라디칼·이온을 만듦</text><rect x="268" y="44" width="224" height="210" fill="none" stroke-width="1" rx="10" class="s-edge"></rect><text x="280" y="64" font-size="12.5" font-weight="600" class="f-ink">② 반응종이 내려옴</text><text x="280" y="230" font-size="11.5" class="f-quiet">라디칼은 사방으로 퍼지며</text><text x="280" y="246" font-size="11.5" class="f-quiet">표면에 도착</text><rect x="512" y="44" width="224" height="210" fill="none" stroke-width="1" rx="10" class="s-edge"></rect><text x="524" y="64" font-size="12.5" font-weight="600" class="f-ink">③ 표면에 흡착</text><text x="524" y="230" font-size="11.5" class="f-quiet">막 표면(바닥·마스크)에</text><text x="524" y="246" font-size="11.5" class="f-quiet">라디칼이 달라붙음</text><rect x="24" y="266" width="224" height="210" fill="none" stroke-width="1" rx="10" class="s-edge"></rect><text x="36" y="286" font-size="12.5" font-weight="600" class="f-ink">④ 이온이 반응을 도움</text><text x="36" y="452" font-size="11.5" class="f-quiet">수직으로 날아온 이온이</text><text x="36" y="468" font-size="11.5" class="f-quiet">바닥의 반응만 빠르게 함</text><rect x="268" y="266" width="224" height="210" fill="none" stroke-width="1" rx="10" class="s-edge"></rect><text x="280" y="286" font-size="12.5" font-weight="600" class="f-ink">⑤ 생성물이 떨어져 나감</text><text x="280" y="452" font-size="11.5" class="f-quiet">반응해 생긴 기체 분자가</text><text x="280" y="468" font-size="11.5" class="f-quiet">표면에서 떨어져 나감</text><rect x="512" y="266" width="224" height="210" fill="none" stroke-width="1" rx="10" class="s-edge"></rect><text x="524" y="286" font-size="12.5" font-weight="600" class="f-ink">⑥ 배출, 수직 프로파일</text><text x="524" y="452" font-size="11.5" class="f-quiet">펌프로 빼내고 옆벽은</text><text x="524" y="468" font-size="11.5" class="f-quiet">보호막이 막아 수직으로</text><path d="M44 130 H106 V130 H166 V130 H228 V180 H44 Z" fill-opacity="0.2" stroke-width="1" class="f-acc2 s-edge"></path><rect x="44" y="180" width="184" height="12" stroke-width="1" class="f-tint s-edge"></rect><rect x="44" y="118" width="62" height="12" fill-opacity="0.3" stroke-width="1" class="f-acc s-acc"></rect><rect x="166" y="118" width="62" height="12" fill-opacity="0.3" stroke-width="1" class="f-acc s-acc"></rect><rect x="44" y="74" width="184" height="34" fill-opacity="0.1" class="f-acc"></rect><circle cx="64" cy="86" r="4" fill="none" stroke-width="1.5" class="s-acc2"></circle><circle cx="104" cy="96" r="4" fill="none" stroke-width="1.5" class="s-acc2"></circle><circle cx="144" cy="84" r="4" fill="none" stroke-width="1.5" class="s-acc2"></circle><circle cx="184" cy="98" r="4" fill="none" stroke-width="1.5" class="s-acc2"></circle><circle cx="210" cy="88" r="4" fill="none" stroke-width="1.5" class="s-acc2"></circle><circle cx="84" cy="90" r="3.5" class="f-acc"></circle><circle cx="124" cy="100" r="3.5" class="f-acc"></circle><circle cx="166" cy="92" r="3.5" class="f-acc"></circle><path d="M288 130 H350 V130 H410 V130 H472 V180 H288 Z" fill-opacity="0.2" stroke-width="1" class="f-acc2 s-edge"></path><rect x="288" y="180" width="184" height="12" stroke-width="1" class="f-tint s-edge"></rect><rect x="288" y="118" width="62" height="12" fill-opacity="0.3" stroke-width="1" class="f-acc s-acc"></rect><rect x="410" y="118" width="62" height="12" fill-opacity="0.3" stroke-width="1" class="f-acc s-acc"></rect><circle cx="328" cy="80" r="4" fill="none" stroke-width="1.5" class="s-acc2"></circle><line x1="328" y1="85" x2="340" y2="108" stroke-width="1.2" marker-end="url(#u36r-ab)" class="s-acc2"></line><circle cx="380" cy="78" r="4" fill="no