<svg xmlns="http://www.w3.org/2000/svg" width="760" height="384" viewBox="0 0 760 384" role="img" aria-label="스마트폰과 AI 서버의 칩 구성은 역할이 같고 규모가 다르다" font-size="13" class="fig"><title>스마트폰과 AI 서버의 칩 구성은 역할이 같고 규모가 다르다</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><text x="24" y="32" font-size="15" font-weight="600" class="f-ink">스마트폰과 AI 서버는 같은 역할의 칩을 쓰고 규모만 다릅니다</text><g><rect x="24" y="56" width="344" height="288" rx="12" stroke-width="1.25" class="f-tint s-edge"></rect><text x="40" y="82" font-size="14" font-weight="600" class="f-ink">스마트폰 한 대</text></g><g><rect x="392" y="56" width="344" height="288" rx="12" stroke-width="1.25" class="f-tint s-edge"></rect><text x="408" y="82" font-size="14" font-weight="600" class="f-ink">AI 서버 한 대</text></g><g><rect x="40" y="96" width="148" height="48" rx="8" fill-opacity="0.12" stroke-width="2" class="f-acc s-acc"></rect><text x="52" y="116" font-weight="600" class="f-ink">AP(SoC)</text><text x="52" y="134" font-size="11.5" class="f-ink">CPU·GPU·NPU·모뎀 한 칩</text></g><g><rect x="204" y="96" width="148" height="48" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" class="s-edge"></rect><text x="216" y="116" font-weight="600" class="f-ink">LPDDR D램</text><text x="216" y="134" font-size="11.5" class="f-quiet">저전력 작업 메모리</text></g><g><rect x="40" y="156" width="148" height="48" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" class="s-edge"></rect><text x="52" y="176" font-weight="600" class="f-ink">UFS 낸드</text><text x="52" y="194" font-size="11.5" class="f-quiet">사진·앱 저장</text></g><g><rect x="204" y="156" width="148" height="48" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" class="s-edge"></rect><text x="216" y="176" font-weight="600" class="f-ink">이미지센서</text><text x="216" y="194" font-size="11.5" class="f-quiet">카메라의 눈</text></g><g><rect x="40" y="216" width="148" height="48" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" class="s-edge"></rect><text x="52" y="236" font-weight="600" class="f-ink">전원 관리(PMIC)</text><text x="52" y="254" font-size="11.5" class="f-quiet">배터리 전압 배분</text></g><g><rect x="204" y="216" width="148" height="48" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" class="s-edge"></rect><text x="216" y="236" font-weight="600" class="f-ink">RF·무선 칩</text><text x="216" y="254" font-size="11.5" class="f-quiet">5G·와이파이 송수신</text></g><g><rect x="40" y="276" width="148" height="48" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" class="s-edge"></rect><text x="52" y="296" font-weight="600" class="f-ink">화면 구동(DDI)</text><text x="52" y="314" font-size="11.5" class="f-quiet">픽셀을 켜고 끔</text></g><g><rect x="204" y="276" width="148" height="48" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" class="s-edge"></rect><text x="216" y="296" font-weight="600" class="f-ink">각종 센서</text><text x="216" y="314" font-size="11.5" class="f-quiet">지문·가속도·조도</text></g><g><rect x="408" y="96" width="148" height="48" rx="8" fill-opacity="0.12" stroke-width="2" class="f-acc s-acc"></rect><text x="420" y="116" font-weight="600" class="f-ink">GPU(AI 가속기)</text><text x="420" y="134" font-size="11.5" class="f-ink">행렬 계산을 대량으로</text></g><g><rect x="572" y="96" width="148" height="48" rx="8" fill-opacity="0.12" stroke-width="2" class="f-acc s-acc"></rect><text x="584" y="116" font-weight="600" class="f-ink">HBM</text><text x="584" y="134" font-size="11.5" class="f-ink">GPU 바로 옆 초고속 D램</text></g><g><rect x="408" y="156" width="148" height="48" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" class="s-edge"></rect><text x="420" y="176" font-weight="600" class="f-ink">CPU</text><text x="420" y="194" font-size="11.5" class="f-quiet">작업 분배·제어</text></g><g><rect x="572" y="156" width="148" height="48" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" class="s-edge"></rect><text x="584" y="176" font-weight="600" class="f-ink">DDR5 D램</text><text x="584" y="194" font-size="11.5" class="f-quiet">CPU 주기억장치</text></g><g><rect x="408" y="216" width="148" height="48" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" class="s-edge"></rect><text x="420" y="236" font-weight="600" class="f-ink">eSSD(낸드)</text><text x="420" y="254" font-size="11.5" class="f-quiet">학습 데이터 저장</text></g><g><rect x="572" y="216" width="148" height="48" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" class="s-edge"></rect><text x="584" y="236" font-weight="600" class="f-ink">CXL 메모리</text><text x="584" y="254" font-size="11.5" class="f-quiet">메모리 용량 확장</text></g><g><rect x="408" y="276" width="148" height="48" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" class="s-edge"></rect><text x="420" y="296" font-weight="600" class="f-ink">네트워크 칩</text><text x="420" y="314" font-size="11.5" class="f-quiet">서버끼리 연결</text></g><g><rect x="572" y="276" width="148" height="48" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" class="s-edge"></rect><text x="584" y="296" font-weight="600" class="f-ink">전력 반도체</text><text x="584" y="314" font-size="11.5" class="f-quiet">수 kW 전력 변환</text></g><text x="24" y="370" font-size="11.5" class="f-quiet">공통 구조: 계산하는 칩 + 가까이 둔 D램 + 오래 저장하는 낸드 + 전원·통신 칩. 색을 칠한 칸이 기기의 중심</text></svg>
