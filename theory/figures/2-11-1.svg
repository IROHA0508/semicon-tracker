<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-label="낸드 ISPP 쓰기와 검증, 쓰기 때 스트링 전압과 쓰기 금지, 시간에 따른 문턱전압 분포 이동과 컨트롤러의 오류 관리" font-size="13" class="fig"><title>낸드 ISPP 쓰기와 검증, 쓰기 때 스트링 전압과 쓰기 금지, 시간에 따른 문턱전압 분포 이동과 컨트롤러의 오류 관리</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="u211-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-edge"></path></marker></defs><text x="24" y="26" font-size="15" font-weight="600" class="f-ink">낸드는 조금씩 쓰고 확인하며(ISPP), 움직이는 분포를 오류 정정으로 지켜냅니다</text><g><text x="24" y="50" font-weight="600" class="f-ink">① ISPP: 펄스 → 검증 → 조금 더 높은 펄스</text><path d="M40 170H360" fill="none" stroke-width="1.25" marker-end="url(#u211-arrow)" class="s-edge"></path><rect x="52" y="128" width="18" height="42" fill-opacity="0.55" stroke-width="1.25" class="f-acc2 s-acc2"></rect><rect x="112" y="118" width="18" height="52" fill-opacity="0.55" stroke-width="1.25" class="f-acc2 s-acc2"></rect><rect x="172" y="108" width="18" height="62" fill-opacity="0.55" stroke-width="1.25" class="f-acc2 s-acc2"></rect><rect x="232" y="98" width="18" height="72" fill-opacity="0.55" stroke-width="1.25" class="f-acc2 s-acc2"></rect><rect x="292" y="88" width="18" height="82" fill-opacity="0.55" stroke-width="1.25" class="f-acc2 s-acc2"></rect><rect x="78" y="148" width="8" height="22" fill-opacity="0.7" class="f-acc"></rect><rect x="138" y="148" width="8" height="22" fill-opacity="0.7" class="f-acc"></rect><rect x="198" y="148" width="8" height="22" fill-opacity="0.7" class="f-acc"></rect><rect x="258" y="148" width="8" height="22" fill-opacity="0.7" class="f-acc"></rect><rect x="318" y="148" width="8" height="22" fill-opacity="0.7" class="f-acc"></rect><path d="M244 98H300M300 88V98" fill="none" stroke-width="1" stroke-dasharray="2 2" class="s-edge"></path><text x="40" y="78" font-size="11.5" class="f-ink">프로그램 펄스: 한 번에 ΔV씩 높임</text><text x="40" y="190" font-size="11.5" class="f-quiet">사이사이 검증 읽기로 목표에 닿았는지 확인</text><text x="40" y="208" font-size="11.5" class="f-quiet">목표에 닿은 셀은 다음 펄스부터 쓰기 금지</text></g><g><text x="400" y="50" font-weight="600" class="f-ink">② 쓰기 때 거는 전압(예시)</text><path d="M512 96H720" fill="none" stroke-width="1" class="s-edge"></path><path d="M512 118H720" fill="none" stroke-width="1" class="s-edge"></path><path d="M512 140H720" fill="none" stroke-width="2" class="s-acc2"></path><path d="M512 162H720" fill="none" stroke-width="1" class="s-edge"></path><path d="M512 184H720" fill="none" stroke-width="1" class="s-edge"></path><path d="M560 80V198" fill="none" stroke-width="1.5" class="s-ink"></path><path d="M668 80V198" fill="none" stroke-width="1.5" class="s-ink"></path><rect x="551" y="89" width="18" height="14" rx="2" fill-opacity="1" stroke-width="1.25" stroke-dasharray="none" class="f-tint s-edge"></rect><rect x="659" y="89" width="18" height="14" rx="2" fill-opacity="1" stroke-width="1.25" stroke-dasharray="none" class="f-tint s-edge"></rect><rect x="551" y="111" width="18" height="14" rx="2" fill-opacity="1" stroke-width="1.25" stroke-dasharray="none" class="f-tint s-edge"></rect><rect x="659" y="111" width="18" height="14" rx="2" fill-opacity="1" stroke-width="1.25" stroke-dasharray="none" class="f-tint s-edge"></rect><rect x="551" y="133" width="18" height="14" rx="2" fill-opacity="0.75" stroke-width="1.25" stroke-dasharray="none" class="f-acc2 s-acc2"></rect><rect x="659" y="133" width="18" height="14" rx="2" fill-opacity="1" stroke-width="1.25" stroke-dasharray="3 2" class="f-tint s-acc2"></rect><rect x="551" y="155" width="18" height="14" rx="2" fill-opacity="1" stroke-width="1.25" stroke-dasharray="none" class="f-tint s-edge"></rect><rect x="659" y="155" width="18" height="14" rx="2" fill-opacity="1" stroke-width="1.25" stroke-dasharray="none" class="f-tint s-edge"></rect><rect x="551" y="177" width="18" height="14" rx="2" fill-opacity="1" stroke-width="1.25" stroke-dasharray="none" class="f-tint s-edge"></rect><rect x="659" y="177" width="18" height="14" rx="2" fill-opacity="1" stroke-width="1.25" stroke-dasharray="none" class="f-tint s-edge"></rect><text x="560" y="72" text-anchor="middle" font-size="11.5" class="f-ink">BL 0 V</text><text x="668" y="72" text-anchor="middle" font-size="11.5" class="f-ink">BL VDD</text><text x="404" y="100" font-size="11.5" class="f-quiet">SSL(선택 스위치)</text><text x="404" y="122" font-size="11.5" class="f-ink">비선택 WL · 약 10 V</text><text x="404" y="144" font-size="11.5" font-weight="600" class="f-ink">선택 WL · 약 20 V</text><text x="404" y="166" font-size="11.5" class="f-ink">비선택 WL · 약 10 V</text><text x="404" y="188" font-size="11.5" class="f-quiet">GSL(선택 스위치)</text><text x="560" y="214" text-anchor="middle" font-size="11.5" class="f-ink">전자 주입 → 쓰기</text><text x="668" y="214" text-anchor="middle" font-size="11.5" class="f-ink">부스팅 → 쓰기 금지</text></g><g><text x="24" y="240" font-weight="600" class="f-ink">③ 시간이 지나면 분포가 움직입니다(상태 4개 예시)</text><path d="M40 350H456" fill="none" stroke-width="1.25" marker-end="url(#u211-arrow)" class="s-edge"></path><path d="M140 272V350" fill="none" stroke-width="1.25" stroke-dasharray="3 3" class="s-grid"></path><path d="M240 272V350" fill="none" stroke-width="1.25" stroke-dasharray="3 3" class="s-grid"></path><path d="M340 272V350" fill="none" stroke-width="1.25" stroke-dasharray="3 3" class="s-grid"></path><path d="M134 272V350" fill="none" stroke-width="1.25" stroke-dasharray="2 3" class="s-acc2"></path><path d="M230 272V350" fill="none" stroke-width="1.25" stroke-dasharray="2 3" class="s-acc2"></path><path d="M326 272V350" fill="none" stroke-width="1.25" stroke-dasharray="2 3" class="s-acc2"></path><path d="M56 350C73 350 73 280 90 280C107 280 107 350 124 350" fill-opacity="0.14" stroke-width="1.75" class="f-acc s-acc"></path><path d="M156 350C173 350 173 280 190 280C207 280 207 350 224 350" fill-opacity="0.14" stroke-width="1.75" class="f-acc s-acc"></path><path d="M256 350C273 350 273 280 290 280C307 280 307 350 324 350" fill-opacity="0.14" stroke-width="1.75" class="f-acc s-acc"></path><path d="M356 350C373 350 373 280 390 280C407 280 407 350 424 350" fill-opacity="0.14" stroke-width="1.75" class="f-acc s-acc"></path><path d="M60 350C80 350 80 288 100 288C120 288 120 350 140 350" fill="none" stroke-width="1.5" stroke-dasharray="5 3" class="s-acc"></path><path d="M142 350C162 350 162 290 182 290C202 290 202 350 222 350" fill="none" stroke-width="1.5" stroke-dasharray="5 3" class="s-acc"></path><path d="M236 350C257 350 257 292 278 292C299 292 299 350 320 350" fill="none" stroke-width="1.5" stroke-dasharray="5 3" class="s-acc"></path><path d="M328 350C350 350 350 294 372 294C394 294 394 350 416 350" fill="none" stroke-width="1.5" stroke-dasharray="5 3" class="s-acc"></path><text x="40" y="262" font-size="11.5" class="f-quiet">세로선: 읽기 기준 전압 → 옮겨서 다시 읽기(읽기 재시도)</text><text x="90" y="366" text-anchor="middle" font-size="11.5" class="f-ink">E(지움)</text><text x="190" y="366" text-anchor="middle" font-size="11.5" class="f-ink">P1</text><text x="290" y="366" text-anchor="middle" font-size="11.5" class="f-ink">P2</text><text x="390" y="366" text-anchor="middle" font-size="11.5" class="f-ink">P3</text><text x="24" y="384" font-size="11.5" class="f-ink">실선: 막 쓴 직후 · 점선: 시간이 지난 뒤</text><text x="24" y="400" font-size="11.5" class="f-quiet">써진 상태는 왼쪽(전하 손실), E는 오른쪽(읽기 교란)</text></g><g><text x="480" y="240" font-weight="600" class="f-ink">④ 컨트롤러의 오류 관리</text><rect x="480" y="252" width="256" height="26" rx="6" fill-opacity="0.12" stroke-width="1.25" class="f-acc s-acc"></rect><rect x="480" y="282" width="256" height="26" rx="6" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="480" y="312" width="256" height="26" rx="6" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="480" y="342" width="256" height="26" rx="6" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="480" y="372" width="256" height="26" rx="6" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><text x="492" y="269" font-size="11.5" class="f-ink">ECC(LDPC) · 틀린 비트를 계산으로 고침</text><text x="492" y="299" font-size="11.5" class="f-ink">읽기 재시도 · 기준 전압 옮겨 다시 읽기</text><text x="492" y="329" font-size="11.5" class="f-ink">웨어 레벨링 · 블록을 골고루 사용</text><text x="492" y="359" font-size="11.5" class="f-ink">가비지 컬렉션 · 유효 페이지를 모아 비움</text><text x="492" y="389" font-size="11.5" class="f-ink">배드 블록 관리 · 나쁜 블록은 예비로</text></g></svg>
