<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-label="플래너, FinFET, GAA, CFET 트랜지스터 단면 비교" font-size="13" class="fig"><title>플래너, FinFET, GAA, CFET 트랜지스터 단면 비교</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="u26-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-edge"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" class="f-ink">게이트가 채널을 감싸는 면이 늘수록 누설이 줄어듭니다</text><g><rect x="560" y="19" width="12" height="12" rx="2" fill-opacity="0.22" stroke-width="1.5" class="f-acc2 s-acc2"></rect><text x="578" y="30" font-size="12" class="f-ink">게이트</text><rect x="636" y="19" width="12" height="12" rx="2" fill-opacity="0.55" stroke-width="1.25" class="f-acc s-acc"></rect><text x="654" y="30" font-size="12" class="f-ink">채널(전류 통로)</text></g><g><rect x="40" y="190" width="140" height="36" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="40" y="184" width="140" height="6" rx="2" fill-opacity="0.55" stroke-width="1.25" class="f-acc s-acc"></rect><rect x="64" y="144" width="92" height="40" rx="4" fill-opacity="0.22" stroke-width="1.5" class="f-acc2 s-acc2"></rect><text x="110" y="64" text-anchor="middle" font-weight="600" class="f-ink">플래너</text><text x="110" y="254" text-anchor="middle" class="f-ink">게이트가 위 1면만 제어</text><text x="110" y="272" text-anchor="middle" font-size="11.5" class="f-quiet">~28 nm까지 주력</text></g><g><rect x="220" y="200" width="140" height="26" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="254" y="104" width="72" height="96" rx="4" fill-opacity="0.22" stroke-width="1.5" class="f-acc2 s-acc2"></rect><rect x="276" y="122" width="28" height="104" rx="2" fill-opacity="0.55" stroke-width="1.25" class="f-acc s-acc"></rect><text x="290" y="64" text-anchor="middle" font-weight="600" class="f-ink">FinFET</text><text x="290" y="254" text-anchor="middle" class="f-ink">게이트가 3면을 감쌈</text><text x="290" y="272" text-anchor="middle" font-size="11.5" class="f-quiet">22 nm(2011)~3 nm급</text></g><g><rect x="400" y="210" width="140" height="16" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="418" y="100" width="104" height="110" rx="4" fill-opacity="0.22" stroke-width="1.5" class="f-acc2 s-acc2"></rect><rect x="434" y="118" width="72" height="14" rx="2" fill-opacity="0.55" stroke-width="1.25" class="f-acc s-acc"></rect><rect x="434" y="148" width="72" height="14" rx="2" fill-opacity="0.55" stroke-width="1.25" class="f-acc s-acc"></rect><rect x="434" y="178" width="72" height="14" rx="2" fill-opacity="0.55" stroke-width="1.25" class="f-acc s-acc"></rect><text x="470" y="64" text-anchor="middle" font-weight="600" class="f-ink">GAA(나노시트)</text><text x="470" y="254" text-anchor="middle" class="f-ink">게이트가 4면 모두 감쌈</text><text x="470" y="272" text-anchor="middle" font-size="11.5" class="f-quiet">3 nm(2022)~2 nm 이하</text></g><g><rect x="580" y="216" width="140" height="12" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="598" y="96" width="104" height="120" rx="4" fill-opacity="0.22" stroke-width="1.5" class="f-acc2 s-acc2"></rect><rect x="614" y="108" width="72" height="12" rx="2" fill-opacity="0.55" stroke-width="1.25" class="f-acc s-acc"></rect><rect x="614" y="132" width="72" height="12" rx="2" fill-opacity="0.55" stroke-width="1.25" class="f-acc s-acc"></rect><rect x="614" y="170" width="72" height="12" rx="2" fill-opacity="0.55" stroke-width="1.25" class="f-acc s-acc"></rect><rect x="614" y="194" width="72" height="12" rx="2" fill-opacity="0.55" stroke-width="1.25" class="f-acc s-acc"></rect><path d="M598 158H702" fill="none" stroke-width="1.25" stroke-dasharray="4 3" class="s-edge"></path><text x="712" y="131" font-size="12" font-weight="600" class="f-ink">N</text><text x="712" y="193" font-size="12" font-weight="600" class="f-ink">P</text><text x="650" y="64" text-anchor="middle" font-weight="600" class="f-ink">CFET</text><text x="650" y="254" text-anchor="middle" class="f-ink">N·P를 위아래로 쌓음</text><text x="650" y="272" text-anchor="middle" font-size="11.5" class="f-quiet">2030년대 목표(연구)</text></g><path d="M40 314H720" fill="none" stroke-width="1.25" marker-end="url(#u26-arrow)" class="s-edge"></path><text x="380" y="304" text-anchor="middle" font-size="11.5" class="f-quiet">오른쪽으로 갈수록 게이트 제어력과 면적당 전류가 커집니다</text></svg>
