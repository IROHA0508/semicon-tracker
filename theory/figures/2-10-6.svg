<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-label="셀 전압이 새어 내려가다 리프레시로 다시 채워지는 모습과 REF 명령이 행 묶음을 차례로 도는 방식" font-size="12" class="fig"><title>셀 전압이 새어 내려가다 리프레시로 다시 채워지는 모습과 REF 명령이 행 묶음을 차례로 도는 방식</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="u210f-aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-acc"></path></marker></defs><text x="24" y="26" font-size="15" font-weight="600" class="f-ink">전하는 새고, 리프레시는 데이터를 잃기 전에 다시 채웁니다</text><text x="24" y="54" font-size="13" font-weight="600" class="f-ink">① 셀 전압과 리프레시</text><line x1="64" y1="250" x2="424" y2="250" stroke-width="1" class="s-edge"></line><line x1="64" y1="250" x2="64" y2="70" stroke-width="1" class="s-edge"></line><line x1="64" y1="190" x2="424" y2="190" stroke-width="1" stroke-dasharray="4 3" class="s-ink"></line><text x="424" y="184" text-anchor="end" font-size="11.5" class="f-quiet">이 아래로 내려가면 0·1 구별 불가</text><text x="58" y="88" text-anchor="end" font-size="11.5" class="f-quiet">VDD</text><text x="64" y="266" text-anchor="middle" font-size="11.5" class="f-quiet">0</text><text x="176" y="266" text-anchor="middle" font-size="11.5" class="f-quiet">32 ms</text><line x1="176" y1="76" x2="176" y2="250" stroke-width="1" class="s-grid"></line><text x="288" y="266" text-anchor="middle" font-size="11.5" class="f-quiet">64 ms</text><line x1="288" y1="76" x2="288" y2="250" stroke-width="1" class="s-grid"></line><text x="400" y="266" text-anchor="middle" font-size="11.5" class="f-quiet">96 ms</text><line x1="400" y1="76" x2="400" y2="250" stroke-width="1" class="s-grid"></line><path d="M64 84.0 L72 89.9 L80 95.6 L88 101.1 L96 106.4 L104 111.5 L112 116.4 L120 121.2 L128 125.7 L136 130.2 L144 134.4 L152 138.5 L160 142.5 L168 146.3 L176 150.0 L176 84 L176 84.0 L184 89.9 L192 95.6 L200 101.1 L208 106.4 L216 111.5 L224 116.4 L232 121.2 L240 125.7 L248 130.2 L256 134.4 L264 138.5 L272 142.5 L280 146.3 L288 150.0 L288 84 L288 84.0 L296 89.9 L304 95.6 L312 101.1 L320 106.4 L328 111.5 L336 116.4 L344 121.2 L352 125.7 L360 130.2 L368 134.4 L376 138.5 L384 142.5 L392 146.3 L400 150.0 L400 84" fill="none" stroke-width="2" class="s-acc"></path><path d="M64 84.0 L68 93.0 L72 101.5 L76 109.5 L80 117.1 L84 124.3 L88 131.1 L92 137.5 L96 143.6 L100 149.3 L104 154.8 L108 159.9 L112 164.8 L116 169.4 L120 173.7 L124 177.9 L128 181.8 L132 185.4 L136 188.9 L137.3 190.0" fill="none" stroke-width="2" stroke-dasharray="5 3" class="s-acc2"></path><circle cx="137.3" cy="190" r="6" fill="none" stroke-width="2" class="s-acc2"></circle><text x="149.3" y="214" font-size="11.5" font-weight="600" class="f-acc2">약한 셀: 리프레시 전에 데이터 잃음</text><text x="184" y="72" font-size="11.5" font-weight="600" class="f-acc">보통 셀: 32 ms마다 다시 채워 안전</text><text x="460" y="54" font-size="13" font-weight="600" class="f-ink">② REF 명령이 도는 방식</text><rect x="470" y="70" width="96" height="18" fill-opacity="0.1" stroke-width="1" rx="3" class="f-acc s-edge"></rect><rect x="470" y="92" width="96" height="18" fill-opacity="0.1" stroke-width="1" rx="3" class="f-acc s-edge"></rect><rect x="470" y="114" width="96" height="18" fill-opacity="0.6" stroke-width="2" rx="3" class="f-acc s-acc"></rect><rect x="470" y="136" width="96" height="18" stroke-width="1" rx="3" class="f-tint s-edge"></rect><rect x="470" y="158" width="96" height="18" stroke-width="1" rx="3" class="f-tint s-edge"></rect><rect x="470" y="180" width="96" height="18" stroke-width="1" rx="3" class="f-tint s-edge"></rect><rect x="470" y="202" width="96" height="18" stroke-width="1" rx="3" class="f-tint s-edge"></rect><rect x="470" y="224" width="96" height="18" stroke-width="1" rx="3" class="f-tint s-edge"></rect><line x1="586" y1="123" x2="570" y2="123" stroke-width="2" marker-end="url(#u210f-aa)" class="s-acc"></line><text x="592" y="128" font-size="11.5" font-weight="600" class="f-acc">지금 리프레시 중</text><text x="582" y="172" font-size="11.5" class="f-quiet">약 3.9 μs마다 REF 1번</text><text x="582" y="190" font-size="11.5" class="f-quiet">REF마다 몇 행씩 차례로</text><text x="582" y="208" font-size="11.5" class="f-quiet">8,192번 = 32 ms에</text><text x="582" y="226" font-size="11.5" class="f-quiet">모든 행을 한 바퀴</text><text x="518" y="266" text-anchor="middle" font-size="11.5" class="f-quiet">행 묶음(위에서 아래로)</text><text x="24" y="300" font-size="11.5" class="f-quiet">온도가 높으면 누설이 빨라져 주기를 절반으로 줄입니다(DDR5 고온 구간 16 ms).</text><text x="24" y="318" font-size="11.5" class="f-quiet">리프레시 중에는 그 뱅크를 쓸 수 없어 성능과 전력에 부담이 됩니다. 곡선 모양은 개념도입니다.</text></svg>
