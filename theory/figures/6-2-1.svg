<svg xmlns="http://www.w3.org/2000/svg" width="760" height="296" viewBox="0 0 760 296" role="img" aria-label="면접 질문 유형 다섯 가지와 각각의 예시, 답변 방식, 공통 원칙" font-size="13" class="fig"><title>면접 질문 유형 다섯 가지와 각각의 예시, 답변 방식, 공통 원칙</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><text x="24" y="26" font-size="15" font-weight="600" class="f-ink">질문은 다섯 유형으로 나뉘고, 유형마다 답하는 틀이 다릅니다</text><rect x="24" y="44" width="228" height="112" rx="10" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="266" y="44" width="228" height="112" rx="10" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="508" y="44" width="228" height="112" rx="10" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="24" y="170" width="228" height="112" rx="10" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="266" y="170" width="228" height="112" rx="10" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="508" y="170" width="228" height="112" rx="10" fill-opacity="0.1" stroke-width="1.25" class="f-acc2 s-acc2"></rect><text x="38" y="68" font-size="12.5" font-weight="600" class="f-ink">① 원리형</text><text x="38" y="90" font-size="11.5" class="f-ink">'왜·어떻게 그런가요?'</text><text x="38" y="112" font-size="11.5" class="f-quiet">예: 왜 실리콘을 쓰나요?</text><text x="38" y="136" font-size="11.5" class="f-acc">→ 결론 · 원리 · 근거 · 연결</text><text x="280" y="68" font-size="12.5" font-weight="600" class="f-ink">② 비교형</text><text x="280" y="90" font-size="11.5" class="f-ink">'A와 B의 차이는?'</text><text x="280" y="112" font-size="11.5" class="f-quiet">예: D램과 낸드의 차이는?</text><text x="280" y="136" font-size="11.5" class="f-acc">→ 기준 2~3개로 표처럼 대비</text><text x="522" y="68" font-size="12.5" font-weight="600" class="f-ink">③ 문제해결형(PT)</text><text x="522" y="90" font-size="11.5" class="f-ink">'이런 불량이 생겼다면?'</text><text x="522" y="112" font-size="11.5" class="f-quiet">예: 가장자리 링 불량 원인은?</text><text x="522" y="136" font-size="11.5" class="f-acc">→ 현상 · 원인 · 데이터 · 대책</text><text x="38" y="194" font-size="12.5" font-weight="600" class="f-ink">④ 산업·회사형</text><text x="38" y="216" font-size="11.5" class="f-ink">'지금 시장과 우리 회사는?'</text><text x="38" y="238" font-size="11.5" class="f-quiet">예: HBM 경쟁 구도는?</text><text x="38" y="262" font-size="11.5" class="f-acc">→ 사실 · 해석 · 영향 · 내 역할</text><text x="280" y="194" font-size="12.5" font-weight="600" class="f-ink">⑤ 경험·직무형</text><text x="280" y="216" font-size="11.5" class="f-ink">'해 본 적 있나요?'</text><text x="280" y="238" font-size="11.5" class="f-quiet">예: 데이터 분석 경험은?</text><text x="280" y="262" font-size="11.5" class="f-acc">→ 상황 · 행동 · 결과(숫자)</text><text x="522" y="194" font-size="12.5" font-weight="600" class="f-ink">공통 원칙</text><text x="522" y="216" font-size="11.5" class="f-ink">첫 문장에 결론</text><text x="522" y="238" font-size="11.5" class="f-ink">그림 하나로 설명할 수 있게</text><text x="522" y="262" font-size="11.5" class="f-ink">모르면 아는 데까지 + 추론</text></svg>
