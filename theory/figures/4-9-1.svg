<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-label="트랜지스터와 배선의 고장 메커니즘 위치(HCI, BTI, TDDB, EM)와 칩의 열이 빠지는 경로, 동적 전력 식" font-size="13" class="fig"><title>트랜지스터와 배선의 고장 메커니즘 위치(HCI, BTI, TDDB, EM)와 칩의 열이 빠지는 경로, 동적 전력 식</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="u49-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-acc2"></path></marker></defs><text x="24" y="26" font-size="15" font-weight="600" class="f-ink">시간이 지나며 생기는 고장, 그리고 열이 빠지는 길</text><g><text x="24" y="52" font-weight="600" class="f-ink">① 고장이 생기는 자리</text><rect x="40" y="220" width="360" height="70" stroke-width="1" class="f-tint s-edge"></rect><rect x="60" y="220" width="90" height="24" fill-opacity="0.45" class="f-acc"></rect><rect x="290" y="220" width="90" height="24" fill-opacity="0.45" class="f-acc"></rect><rect x="150" y="212" width="140" height="8" fill-opacity="0.75" class="f-edge"></rect><rect x="150" y="172" width="140" height="40" fill-opacity="0.3" stroke-width="1" class="f-edge s-edge"></rect><rect x="100" y="120" width="10" height="100" class="f-edge"></rect><rect x="330" y="120" width="10" height="100" class="f-edge"></rect><rect x="80" y="104" width="280" height="16" fill-opacity="0.35" stroke-width="1" class="f-acc2 s-acc2"></rect><ellipse cx="200" cy="112" rx="13" ry="5" stroke-width="1" class="f-tint s-acc2"></ellipse><path d="M290 104Q300 90 310 104Z" fill-opacity="0.7" class="f-acc2"></path><path d="M243 212L249 215L241 218L247 220" fill="none" stroke-width="2" class="s-acc2"></path><circle cx="292" cy="228" r="6" class="f-acc2"></circle><path d="M165 216V300" fill="none" stroke-width="1" stroke-dasharray="3 3" class="s-edge"></path><path d="M245 220V318" fill="none" stroke-width="1" stroke-dasharray="3 3" class="s-edge"></path><path d="M292 234V300" fill="none" stroke-width="1" stroke-dasharray="3 3" class="s-edge"></path><text x="220" y="88" text-anchor="middle" font-size="11.5" class="f-ink">EM: 보이드(단선)·힐록(단락)</text><text x="220" y="197" text-anchor="middle" font-size="11.5" class="f-ink">게이트</text><text x="75" y="238" font-size="11.5" class="f-ink">S</text><text x="362" y="238" font-size="11.5" class="f-ink">D</text><text x="150" y="314" font-size="11.5" class="f-ink">BTI(계면)</text><text x="228" y="334" font-size="11.5" class="f-ink">TDDB(산화막 파괴)</text><text x="286" y="314" font-size="11.5" class="f-ink">HCI(드레인 끝)</text></g><g><text x="450" y="52" font-weight="600" class="f-ink">② 전력과 열이 빠지는 길</text><rect x="450" y="62" width="286" height="52" rx="8" fill-opacity="0.08" stroke-width="1.25" class="f-acc s-acc"></rect><text x="462" y="83" font-size="12.5" font-weight="600" class="f-ink">동적 전력 ≈ α · C · V² · f</text><text x="462" y="103" font-size="11.5" class="f-quiet">전압을 낮추면 제곱으로 감소 + 누설(정적) 전력</text><path d="M560 166V128" fill="none" stroke-width="2" marker-end="url(#u49-arrow)" class="s-acc2"></path><path d="M595 166V128" fill="none" stroke-width="2" marker-end="url(#u49-arrow)" class="s-acc2"></path><path d="M630 166V128" fill="none" stroke-width="2" marker-end="url(#u49-arrow)" class="s-acc2"></path><text x="642" y="146" font-size="11.5" class="f-ink">열</text><rect x="480" y="170" width="230" height="60" stroke-width="1" class="f-tint s-edge"></rect><path d="M492 184H698" fill="none" stroke-opacity="0.5" stroke-width="3" class="s-acc"></path><path d="M492 198H698" fill="none" stroke-opacity="0.5" stroke-width="3" class="s-acc"></path><path d="M492 212H698" fill="none" stroke-opacity="0.5" stroke-width="3" class="s-acc"></path><rect x="480" y="230" width="230" height="8" fill-opacity="0.35" class="f-acc"></rect><rect x="480" y="238" width="230" height="16" fill-opacity="0.4" stroke-width="1" class="f-edge s-edge"></rect><rect x="530" y="254" width="130" height="8" fill-opacity="0.5" class="f-acc"></rect><rect x="530" y="262" width="130" height="28" fill-opacity="0.4" stroke-width="1" class="f-acc2 s-acc2"></rect><rect x="470" y="290" width="250" height="16" fill-opacity="0.18" stroke-width="1" class="f-acc2 s-acc2"></rect><text x="595" y="226" text-anchor="middle" font-size="11.5" class="f-ink">냉각판(수랭)·방열판</text><text x="595" y="250" text-anchor="middle" font-size="11.5" class="f-ink">덮개(리드)</text><text x="595" y="281" text-anchor="middle" font-size="11.5" font-weight="600" class="f-ink">GPU·HBM</text><text x="450" y="328" font-size="11.5" class="f-ink">칩 → 열 계면 물질(TIM) → 덮개 → TIM → 냉각판</text><text x="450" y="346" font-size="11.5" class="f-quiet">공랭 → 수랭(직접 액체 냉각) → 침지 냉각으로 확대</text></g></svg>
