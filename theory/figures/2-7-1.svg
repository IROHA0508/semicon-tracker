<svg xmlns="http://www.w3.org/2000/svg" width="760" height="352" viewBox="0 0 760 352" role="img" aria-label="메모리 계층 피라미드와 DRAM 1T1C 셀의 구조와 읽기 순서" font-size="13" class="fig"><title>메모리 계층 피라미드와 DRAM 1T1C 셀의 구조와 읽기 순서</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><text x="24" y="30" font-size="15" font-weight="600" class="f-ink">빠른 메모리는 비싸서 계층으로 쌓고 DRAM은 전하로 1비트를 담습니다</text><g><path d="M140 60H200L232.24 112H107.76Z" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></path><path d="M107.76 112H232.24L264.48 164H75.52Z" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></path><path d="M75.52 164H264.48L296.72 216H43.28Z" fill-opacity="0.14" stroke-width="2" class="f-acc s-acc"></path><path d="M43.28 216H296.72L328.96 268H11.04Z" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></path><text x="170" y="91" text-anchor="middle" class="f-ink">레지스터</text><text x="170" y="143" text-anchor="middle" class="f-ink">캐시 · SRAM</text><text x="170" y="195" text-anchor="middle" font-weight="600" class="f-ink">메인 메모리 · DRAM·HBM</text><text x="170" y="247" text-anchor="middle" class="f-ink">저장장치 · NAND SSD</text><text x="230" y="74" font-size="11.5" class="f-quiet">접근 시간(대략)</text><text x="224" y="96" font-size="11.5" class="f-quiet">1 ns 미만</text><text x="256" y="148" font-size="11.5" class="f-quiet">수 ns</text><text x="289" y="200" font-size="11.5" class="f-quiet">수십 ns</text><text x="321" y="252" font-size="11.5" class="f-quiet">수십 μs</text><text x="24" y="74" font-size="11.5" class="f-quiet">빠르고 비싸고 작음</text><text x="170" y="290" text-anchor="middle" font-size="12" class="f-quiet">아래로 갈수록 느리지만 싸고 큼</text></g><g fill="none"><text x="400" y="64" font-weight="600" class="f-ink">DRAM 셀 = 트랜지스터 1개 + 커패시터 1개</text><path d="M420 110H720" stroke-width="1.5" class="s-ink"></path><path d="M470 86V290" stroke-width="1.5" class="s-ink"></path><path d="M550 110V150" stroke-width="1.5" class="s-edge"></path><path d="M470 173H500" stroke-width="1.5" class="s-edge"></path><path d="M600 173H640V212" stroke-width="1.5" class="s-edge"></path><circle cx="470" cy="173" r="3" class="f-ink"></circle><circle cx="550" cy="110" r="3" class="f-ink"></circle><rect x="500" y="150" width="100" height="46" rx="6" stroke-width="1.5" class="s-edge"></rect><rect x="612" y="213" width="56" height="12" fill-opacity="0.25" class="f-acc"></rect><path d="M612 212H668M612 226H668" stroke-width="3" class="s-ink"></path><path d="M640 226V252M624 252H656M630 258H650M636 264H644" stroke-width="1.5" class="s-edge"></path><rect x="420" y="290" width="100" height="36" rx="6" fill-opacity="0.12" stroke-width="2" class="f-acc s-acc"></rect><text x="720" y="102" text-anchor="end" font-size="11.5" class="f-quiet">워드라인(WL)</text><text x="478" y="96" font-size="11.5" class="f-quiet">비트라인(BL)</text><text x="550" y="172" text-anchor="middle" font-size="12" class="f-ink">트랜지스터</text><text x="550" y="188" text-anchor="middle" font-size="11.5" class="f-quiet">(스위치)</text><text x="604" y="222" text-anchor="end" font-size="12" class="f-ink">커패시터</text><text x="604" y="238" text-anchor="end" font-size="11.5" class="f-quiet">전하 있음 = 1</text><text x="470" y="313" text-anchor="middle" font-size="12" font-weight="600" class="f-ink">감지 증폭기</text><text x="540" y="286" font-size="11.5" class="f-quiet">① 워드라인으로 스위치를 켬</text><text x="540" y="304" font-size="11.5" class="f-quiet">② 셀 전하가 비트라인 전압을 살짝 바꿈</text><text x="540" y="322" font-size="11.5" class="f-quiet">③ 증폭기가 0/1을 판별하고 다시 씀</text><text x="540" y="340" font-size="11.5" class="f-quiet">④ 전하가 새므로 주기적 재충전(리프레시)</text></g></svg>
