<svg xmlns="http://www.w3.org/2000/svg" width="760" height="356" viewBox="0 0 760 356" role="img" aria-label="전압은 수위 차, 전류는 흐르는 물의 양, 저항은 좁은 관" font-size="13" class="fig"><title>전압은 수위 차, 전류는 흐르는 물의 양, 저항은 좁은 관</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="u11-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-edge"></path></marker><marker id="u11-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-acc"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" class="f-ink">전압은 수위 차, 전류는 흐르는 물의 양, 저항은 좁은 관입니다</text><g><rect x="41" y="100" width="108" height="129" fill-opacity="0.18" class="f-acc"></rect><rect x="40" y="76" width="110" height="154" rx="4" fill="none" stroke-width="1.25" class="s-edge"></rect><text x="95" y="252" text-anchor="middle" font-size="11.5" class="f-quiet">높은 쪽(+)</text></g><g><rect x="331" y="200" width="108" height="29" fill-opacity="0.18" class="f-acc"></rect><rect x="330" y="150" width="110" height="80" rx="4" fill="none" stroke-width="1.25" class="s-edge"></rect><text x="385" y="252" text-anchor="middle" font-size="11.5" class="f-quiet">낮은 쪽(−)</text></g><g fill="none" stroke-width="1.25" class="s-edge"><path d="M150 208H220V212H260V208H330"></path><path d="M150 222H220V218H260V222H330"></path></g><g stroke-width="2" class="s-acc"><line x1="160" y1="215" x2="206" y2="215" marker-end="url(#u11-flow)"></line><line x1="272" y1="215" x2="318" y2="215" marker-end="url(#u11-flow)"></line></g><text x="240" y="252" text-anchor="middle" font-size="11.5" class="f-ink">흐르는 물의 양 = 전류(I)</text><text x="240" y="270" text-anchor="middle" font-size="11.5" class="f-ink">좁은 관 = 저항(R)</text><g><line x1="152" y1="100" x2="464" y2="100" stroke-width="1.25" stroke-dasharray="4 4" class="s-grid"></line><line x1="442" y1="200" x2="464" y2="200" stroke-width="1.25" stroke-dasharray="4 4" class="s-grid"></line><line x1="458" y1="104" x2="458" y2="196" stroke-width="1.25" marker-start="url(#u11-arrow)" marker-end="url(#u11-arrow)" class="s-edge"></line><text x="474" y="146" font-weight="600" class="f-ink">수위 차 = 전압(V)</text><text x="474" y="164" font-size="11.5" class="f-quiet">전하를 밀어내는 힘</text></g><g><rect x="24" y="290" width="224" height="48" rx="8" fill="none" stroke-width="1.25" class="s-edge"></rect><text x="136" y="310" text-anchor="middle" font-weight="600" class="f-ink">옴의 법칙</text><text x="136" y="328" text-anchor="middle" font-size="11.5" class="f-ink">V = I × R</text></g><g><rect x="268" y="290" width="224" height="48" rx="8" fill="none" stroke-width="1.25" class="s-edge"></rect><text x="380" y="310" text-anchor="middle" font-weight="600" class="f-ink">전력(칩의 발열)</text><text x="380" y="328" text-anchor="middle" font-size="11.5" class="f-ink">P = V × I = I²R</text></g><g><rect x="512" y="290" width="224" height="48" rx="8" fill="none" stroke-width="1.25" class="s-edge"></rect><text x="624" y="310" text-anchor="middle" font-weight="600" class="f-ink">전하와 정전용량</text><text x="624" y="328" text-anchor="middle" font-size="11.5" class="f-ink">Q = C × V</text></g></svg>
