<svg xmlns="http://www.w3.org/2000/svg" width="760" height="372" viewBox="0 0 760 372" role="img" aria-label="단차 피복 비교, CVD 막 성장 순서, ALD 사이클, CVD 발전 순서" font-size="13" class="fig"><title>단차 피복 비교, CVD 막 성장 순서, ALD 사이클, CVD 발전 순서</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="u37-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-edge"></path></marker></defs><text x="24" y="26" font-size="15" font-weight="600" class="f-ink">증착은 구멍 속까지 고르게 덮는 쪽으로 발전해 왔습니다</text><g><text x="24" y="56" font-weight="600" class="f-ink">① 단차 피복</text><path d="M34 100H64V170H94V100H124V190H34Z" stroke-width="1.25" class="f-tint s-edge"></path><path d="M150 100H180V170H210V100H240V190H150Z" stroke-width="1.25" class="f-tint s-edge"></path><rect x="34" y="90" width="30" height="10" fill-opacity="0.4" class="f-acc"></rect><rect x="94" y="90" width="30" height="10" fill-opacity="0.4" class="f-acc"></rect><circle cx="64" cy="96" r="7" fill-opacity="0.4" class="f-acc"></circle><circle cx="94" cy="96" r="7" fill-opacity="0.4" class="f-acc"></circle><rect x="64" y="100" width="3" height="70" fill-opacity="0.4" class="f-acc"></rect><rect x="91" y="100" width="3" height="70" fill-opacity="0.4" class="f-acc"></rect><rect x="67" y="165" width="24" height="5" fill-opacity="0.4" class="f-acc"></rect><rect x="150" y="95" width="30" height="5" fill-opacity="0.4" class="f-acc"></rect><rect x="210" y="95" width="30" height="5" fill-opacity="0.4" class="f-acc"></rect><rect x="180" y="100" width="5" height="70" fill-opacity="0.4" class="f-acc"></rect><rect x="205" y="100" width="5" height="70" fill-opacity="0.4" class="f-acc"></rect><rect x="185" y="165" width="20" height="5" fill-opacity="0.4" class="f-acc"></rect><text x="79" y="210" text-anchor="middle" font-size="11.5" class="f-ink">직진성(PVD)</text><text x="79" y="226" text-anchor="middle" font-size="11.5" class="f-quiet">입구가 먼저 막힘</text><text x="195" y="210" text-anchor="middle" font-size="11.5" class="f-ink">자기 제한(ALD)</text><text x="195" y="226" text-anchor="middle" font-size="11.5" class="f-quiet">어디나 같은 두께</text></g><g><text x="270" y="44" font-weight="600" class="f-ink">② CVD가 막을 만드는 순서</text><rect x="270" y="52" width="230" height="24" rx="6" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="270" y="80" width="230" height="24" rx="6" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="270" y="108" width="230" height="24" rx="6" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="270" y="136" width="230" height="24" rx="6" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="270" y="164" width="230" height="24" rx="6" fill-opacity="0.12" stroke-width="2" class="f-acc s-acc"></rect><rect x="270" y="192" width="230" height="24" rx="6" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><text x="282" y="68" font-size="12" class="f-ink">1 기체(전구체) 주입·분해</text><text x="282" y="96" font-size="12" class="f-ink">2 대류·확산으로 표면 이동</text><text x="282" y="124" font-size="12" class="f-ink">3 표면에 흡착</text><text x="282" y="152" font-size="12" class="f-ink">4 표면에서 퍼짐(표면 확산)</text><text x="282" y="180" font-size="12" font-weight="600" class="f-ink">5 표면 반응 → 막 성장</text><text x="282" y="208" font-size="12" class="f-ink">6 부산물 탈착·배기</text></g><g><text x="520" y="44" font-weight="600" class="f-ink">③ ALD 한 사이클</text><rect x="520" y="52" width="104" height="64" rx="8" fill-opacity="0.12" stroke-width="1.75" class="f-acc s-acc"></rect><rect x="632" y="52" width="104" height="64" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="632" y="132" width="104" height="64" rx="8" fill-opacity="0.12" stroke-width="1.75" class="f-acc s-acc"></rect><rect x="520" y="132" width="104" height="64" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><path d="M624 84H630" fill="none" stroke-width="1.25" marker-end="url(#u37-arrow)" class="s-edge"></path><path d="M684 116V130" fill="none" stroke-width="1.25" marker-end="url(#u37-arrow)" class="s-edge"></path><path d="M632 164H626" fill="none" stroke-width="1.25" marker-end="url(#u37-arrow)" class="s-edge"></path><path d="M572 132V118" fill="none" stroke-width="1.25" marker-end="url(#u37-arrow)" class="s-edge"></path><text x="530" y="76" font-size="12" font-weight="600" class="f-ink">① 전구체</text><text x="530" y="94" font-size="11.5" class="f-quiet">한 층만 흡착</text><text x="642" y="76" font-size="12" font-weight="600" class="f-ink">② 퍼지</text><text x="642" y="94" font-size="11.5" class="f-quiet">남은 기체 제거</text><text x="642" y="156" font-size="12" font-weight="600" class="f-ink">③ 반응물</text><text x="642" y="174" font-size="11.5" class="f-quiet">표면에서 반응</text><text x="530" y="156" font-weight="600" font-size="12" class="f-ink">④ 퍼지</text><text x="530" y="174" font-size="11.5" class="f-quiet">부산물 제거</text><text x="628" y="214" text-anchor="middle" font-size="11.5" class="f-quiet">사이클 수 = 두께(원자층 단위)</text></g><g><text x="24" y="254" font-weight="600" class="f-ink">④ CVD 발전 순서: 앞 단계의 단점을 고치며 진화</text><rect x="24" y="264" width="132" height="68" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" class="s-edge"></rect><rect x="169" y="264" width="132" height="68" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" class="s-edge"></rect><rect x="314" y="264" width="132" height="68" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" class="s-edge"></rect><rect x="459" y="264" width="132" height="68" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" class="s-edge"></rect><rect x="604" y="264" width="132" height="68" rx="8" fill-opacity="0.12" stroke-width="2" class="f-acc s-acc"></rect><path d="M157 298H168" fill="none" stroke-width="1.25" marker-end="url(#u37-arrow)" class="s-edge"></path><path d="M302 298H313" fill="none" stroke-width="1.25" marker-end="url(#u37-arrow)" class="s-edge"></path><path d="M447 298H458" fill="none" stroke-width="1.25" marker-end="url(#u37-arrow)" class="s-edge"></path><path d="M592 298H603" fill="none" stroke-width="1.25" marker-end="url(#u37-arrow)" class="s-edge"></path><text x="36" y="286" font-weight="600" class="f-ink">APCVD</text><text x="36" y="304" font-size="11.5" class="f-quiet">상압·빠름</text><text x="36" y="321" font-size="11.5" class="f-quiet">피복·파티클 불량</text><text x="181" y="286" font-weight="600" class="f-ink">LPCVD</text><text x="181" y="304" font-size="11.5" class="f-quiet">저압·600~900 °C</text><text x="181" y="321" font-size="11.5" class="f-quiet">막질↑, 열 부담</text><text x="326" y="286" font-weight="600" class="f-ink">PECVD</text><text x="326" y="304" font-size="11.5" class="f-quiet">플라즈마·약 400 °C</text><text x="326" y="321" font-size="11.5" class="f-quiet">BEOL 가능, 막질↓</text><text x="471" y="286" font-weight="600" class="f-ink">HDP-CVD</text><text x="471" y="304" font-size="11.5" class="f-quiet">ICP 고밀도+바이어스</text><text x="471" y="321" font-size="11.5" class="f-quiet">증착·식각 반복 갭필</text><text x="616" y="286" font-weight="600" class="f-ink">ALD</text><text x="616" y="304" font-size="11.5" class="f-quiet">자기 제한 반응</text><text x="616" y="321" font-size="11.5" class="f-quiet">완벽한 피복, 느림</text><text x="24" y="356" font-size="11.5" class="f-quiet">압력은 낮추고(MFP↑), 온도는 낮추고(써멀 버짓↓), 반응은 표면에서만 일어나도록</text></g></svg>
