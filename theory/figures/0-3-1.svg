<svg xmlns="http://www.w3.org/2000/svg" width="760" height="466" viewBox="0 0 760 466" role="img" aria-label="반도체 칩은 메모리와 시스템 반도체로 나뉜다" font-size="13" class="fig"><title>반도체 칩은 메모리와 시스템 반도체로 나뉜다</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><text x="24" y="32" font-size="15" font-weight="600" class="f-ink">반도체 칩은 저장하는 메모리와 일하는 시스템 반도체로 나뉩니다</text><text x="24" y="54" font-size="11.5" class="f-quiet">오른쪽 칸은 종류와 대표 제품</text><g fill="none" stroke-width="1.25" class="s-edge"><path d="M134 220H152V128H170"></path><path d="M152 220V312H170"></path><path d="M320 128H340V100H360"></path><path d="M340 128V156H360"></path><path d="M320 312H340V228H360"></path><path d="M340 312V284H360"></path><path d="M340 312V340H360"></path><path d="M340 312V396H360"></path></g><g><rect x="24" y="196" width="110" height="48" rx="8" fill="none" stroke-width="1.25" class="s-edge"></rect><text x="79" y="225" text-anchor="middle" font-size="14" font-weight="600" class="f-ink">반도체 칩</text></g><g><rect x="170" y="104" width="150" height="48" rx="8" fill-opacity="0.12" stroke-width="2" class="f-acc s-acc"></rect><text x="245" y="124" text-anchor="middle" font-weight="600" class="f-ink">메모리 반도체</text><text x="245" y="142" text-anchor="middle" font-size="11.5" class="f-ink">정보를 저장</text></g><g><rect x="170" y="288" width="150" height="48" rx="8" fill="none" stroke-width="1.25" class="s-edge"></rect><text x="245" y="308" text-anchor="middle" font-weight="600" class="f-ink">시스템 반도체</text><text x="245" y="326" text-anchor="middle" font-size="11.5" class="f-quiet">연산·제어·변환</text></g><g><rect x="360" y="76" width="370" height="48" rx="8" fill="none" stroke-width="1.25" class="s-edge"></rect><text x="376" y="96" font-weight="600" class="f-ink">휘발성 · 전원을 끄면 지워짐</text><text x="376" y="114" font-size="11.5" class="f-quiet">D램(주기억장치), S램(CPU 안 캐시)</text></g><g><rect x="360" y="132" width="370" height="48" rx="8" fill="none" stroke-width="1.25" class="s-edge"></rect><text x="376" y="152" font-weight="600" class="f-ink">비휘발성 · 전원을 꺼도 유지</text><text x="376" y="170" font-size="11.5" class="f-quiet">낸드 플래시(SSD·스마트폰 저장), 노어 플래시</text></g><g><rect x="360" y="204" width="370" height="48" rx="8" fill="none" stroke-width="1.25" class="s-edge"></rect><text x="376" y="224" font-weight="600" class="f-ink">연산</text><text x="376" y="242" font-size="11.5" class="f-quiet">CPU, GPU, NPU, 스마트폰 AP(SoC)</text></g><g><rect x="360" y="260" width="370" height="48" rx="8" fill="none" stroke-width="1.25" class="s-edge"></rect><text x="376" y="280" font-weight="600" class="f-ink">센서</text><text x="376" y="298" font-size="11.5" class="f-quiet">CMOS 이미지센서(빛 → 전기)</text></g><g><rect x="360" y="316" width="370" height="48" rx="8" fill="none" stroke-width="1.25" class="s-edge"></rect><text x="376" y="336" font-weight="600" class="f-ink">아날로그·전력</text><text x="376" y="354" font-size="11.5" class="f-quiet">전원 관리 칩(PMIC), SiC·GaN 전력반도체</text></g><g><rect x="360" y="372" width="370" height="48" rx="8" fill="none" stroke-width="1.25" class="s-edge"></rect><text x="376" y="392" font-weight="600" class="f-ink">통신·구동·제어</text><text x="376" y="410" font-size="11.5" class="f-quiet">모뎀, RF, 디스플레이 구동칩(DDI), MCU</text></g><text x="24" y="452" font-size="11.5" class="f-quiet">한국은 메모리 강국, 시스템 반도체는 미국(설계)과 대만(생산)이 강합니다</text></svg>
