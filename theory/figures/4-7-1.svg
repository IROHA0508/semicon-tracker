1" class="s-grid"></path><path d="M60 108H340" fill="none" stroke-width="1" class="s-grid"></path><path d="M60 70H340" fill="none" stroke-width="1" class="s-grid"></path><path d="M60 260H340" fill="none" stroke-width="1.25" class="s-edge"></path><path d="M60 260V66" fill="none" stroke-width="1.25" class="s-edge"></path><text x="54" y="264" text-anchor="end" font-size="11.5" class="f-quiet">1</text><text x="54" y="188" text-anchor="end" font-size="11.5" class="f-quiet">100</text><text x="54" y="112" text-anchor="end" font-size="11.5" class="f-quiet">1만</text><text x="54" y="74" text-anchor="end" font-size="11.5" class="f-quiet">10만</text><text x="60" y="278" text-anchor="middle" font-size="11.5" class="f-quiet">0년</text><text x="340" y="278" text-anchor="middle" font-size="11.5" class="f-quiet">20년</text><path d="M60 260L340 79" fill="none" stroke-width="2.5" class="s-acc2"></path><path d="M60 260L340 182" fill="none" stroke-width="2.5" class="s-acc"></path><path d="M60 260L340 204" fill="none" stroke-width="2" stroke-dasharray="6 4" class="s-acc"></path><text x="340" y="70" text-anchor="end" font-size="11.5" font-weight="600" class="f-ink">GPU 연산 ×3.0 / 2년</text><text x="340" y="174" text-anchor="end" font-size="11.5" class="f-ink">D램 대역폭 ×1.6 / 2년</text><text x="340" y="240" text-anchor="end" font-size="11.5" class="f-ink">칩 간 연결 ×1.4 / 2년</text><path d="M330 92V170" fill="none" stroke-width="1.25" marker-start="url(#u47-arrow)" marker-end="url(#u47-arrow)" class="s-edge"></path><text x="322" y="150" text-anchor="end" font-size="12" font-weight="600" class="f-ink">메모리 벽</text><text x="24" y="300" font-size="11.5" class="f-quiet">추세값: Gholami 외, AI and Memory Wall(2024)</text></g><g><text x="384" y="52" font-weight="600" class="f-ink">② 메모리 계층: 가까울수록 빠르고 작음</text><rect x="518" y="70" width="80" height="26" rx="4" fill-opacity="0.55" class="f-acc"></rect><rect x="493" y="104" width="130" height="26" rx="4" fill-opacity="0.42" class="f-acc"></rect><rect x="468" y="138" width="180" height="26" rx="4" fill-opacity="0.3" class="f-acc"></rect><rect x="443" y="172" width="230" height="26" rx="4" fill-opacity="0.18" class="f-acc"></rect><rect x="418" y="206" width="280" height="26" rx="4" fill-opacity="0.15" stroke-width="1.25" stroke-dasharray="5 3" class="f-acc2 s-acc2"></rect><rect x="393" y="240" width="330" height="26" rx="4" stroke-width="1" class="f-tint s-edge"></rect><text x="558" y="87" text-anchor="middle" font-size="11.5" class="f-ink">SRAM 캐시</text><text x="558" y="121" text-anchor="middle" font-size="11.5" class="f-ink">HBM(GPU 옆)</text><text x="558" y="155" text-anchor="middle" font-size="11.5" class="f-ink">DDR5·LPDDR(주메모리)</text><text x="558" y="189" text-anchor="middle" font-size="11.5" class="f-ink">CXL 메모리(확장·풀링)</text><text x="558" y="223" text-anchor="middle" font-size="11.5" class="f-ink">HBF(새 계층 후보, 낸드 적층)</text><text x="558" y="257" text-anchor="middle" font-size="11.5" class="f-ink">SSD(낸드)</text><text x="384" y="292" font-size="11.5" class="f-quiet">위로 갈수록 빠르고 가깝고 작고 비쌈</text><text x="384" y="310" font-size="11.5" class="f-quiet">아래로 갈수록 크고 싸고 느림</text></g><g><rect x="24" y="326" width="712" height="50" rx="8" fill-opacity="0.08" stroke-width="1.25" class="f-acc s-acc"></rect><text x="36" y="346" font-size="12" class="f-ink">PIM: 메모리 안에서 간단한 연산까지 해 데이터 이동을 줄임(SK하이닉스 GDDR6-AiM)</text><text x="36" y="366" font-size="12" class="f-ink">CXL: PCIe 위에서 CPU·가속기·메모리를 연결해 용량을 늘리고 여러 서버가 나눠 씀</text></g></svg>
