idth="88" height="24" fill-opacity="0.3" stroke-width="1" class="f-edge s-edge"></rect><rect x="528" y="108" width="88" height="14" stroke-width="1" class="f-tint s-edge"></rect><rect x="528" y="122" width="88" height="20" fill-opacity="0.2" stroke-width="1" class="f-acc2 s-edge"></rect><rect x="528" y="142" width="88" height="12" stroke-width="1" class="f-tint s-edge"></rect><rect x="528" y="154" width="88" height="44" fill-opacity="0.1" stroke-width="1" class="f-acc s-edge"></rect><text x="572" y="100" text-anchor="middle" font-size="11.5" font-weight="600" class="f-ink">기준 전압</text><circle cx="550" cy="132" r="4.5" fill="none" stroke-width="1" stroke-dasharray="2 2" class="s-grid"></circle><circle cx="572" cy="132" r="4.5" fill="none" stroke-width="1" stroke-dasharray="2 2" class="s-grid"></circle><circle cx="594" cy="132" r="4.5" fill="none" stroke-width="1" stroke-dasharray="2 2" class="s-grid"></circle><line x1="538" y1="178" x2="606" y2="178" stroke-width="2.5" marker-end="url(#u28n-aa)" class="s-acc"></line><text x="572" y="214" text-anchor="middle" font-size="11.5" font-weight="600" class="f-ink">지워진 셀</text><text x="572" y="232" text-anchor="middle" font-size="11.5" font-weight="600" class="f-acc">전류 흐름 → 1</text><rect x="632" y="84" width="88" height="24" fill-opacity="0.3" stroke-width="1" class="f-edge s-edge"></rect><rect x="632" y="108" width="88" height="14" stroke-width="1" class="f-tint s-edge"></rect><rect x="632" y="122" width="88" height="20" fill-opacity="0.2" stroke-width="1" class="f-acc2 s-edge"></rect><rect x="632" y="142" width="88" height="12" stroke-width="1" class="f-tint s-edge"></rect><rect x="632" y="154" width="88" height="44" fill-opacity="0.1" stroke-width="1" class="f-acc s-edge"></rect><text x="676" y="100" text-anchor="middle" font-size="11.5" font-weight="600" class="f-ink">기준 전압</text><circle cx="654" cy="132" r="4.5" class="f-acc"></circle><circle cx="676" cy="132" r="4.5" class="f-acc"></circle><circle cx="698" cy="132" r="4.5" class="f-acc"></circle><line x1="642" y1="178" x2="710" y2="178" stroke-width="2" stroke-dasharray="3 3" class="s-acc2"></line><text x="676" y="214" text-anchor="middle" font-size="11.5" font-weight="600" class="f-ink">써진 셀</text><text x="676" y="232" text-anchor="middle" font-size="11.5" font-weight="600" class="f-acc2">전류 없음 → 0</text><text x="24" y="330" font-size="11.5" class="f-quiet">실제 쓰기는 전압을 한 번에 걸지 않고 펄스를 조금씩 올리며 확인을 반복합니다(ISPP, 2-11). 3D 낸드는</text><text x="24" y="348" font-size="11.5" class="f-quiet">이 셀을 수직으로 수백 층 쌓은 것입니다(3-16). 채운 원 = 갇힌 전자, 점선 원 = 비어 있는 자리.</text></svg>
