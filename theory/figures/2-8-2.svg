<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-label="낸드 셀의 쓰기, 지우기, 읽기 동작을 셀 단면으로 보여 주는 세 단계 그림" font-size="12" class="fig"><title>낸드 셀의 쓰기, 지우기, 읽기 동작을 셀 단면으로 보여 주는 세 단계 그림</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="u28n-aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-acc"></path></marker></defs><text x="24" y="26" font-size="15" font-weight="600" class="f-ink">낸드 셀의 세 동작: 전자를 넣고(쓰기), 빼고(지우기), 켜지는지 봅니다(읽기)</text><rect x="24" y="44" width="224" height="262" fill="none" stroke-width="1" rx="10" class="s-edge"></rect><text x="36" y="64" font-size="12.5" font-weight="600" class="f-ink">① 쓰기(프로그램)</text><text x="36" y="282" font-size="11.5" class="f-quiet">게이트 고전압 → 전자가 터널</text><text x="36" y="298" font-size="11.5" class="f-quiet">산화막을 뚫고 갇힘 → Vth↑</text><rect x="268" y="44" width="224" height="262" fill="none" stroke-width="1" rx="10" class="s-edge"></rect><text x="280" y="64" font-size="12.5" font-weight="600" class="f-ink">② 지우기(소거)</text><text x="280" y="282" font-size="11.5" class="f-quiet">기판 쪽 고전압 → 갇힌 전자가</text><text x="280" y="298" font-size="11.5" class="f-quiet">빠짐 → Vth↓ · 블록 단위로</text><rect x="512" y="44" width="224" height="262" fill="none" stroke-width="1" rx="10" class="s-edge"></rect><text x="524" y="64" font-size="12.5" font-weight="600" class="f-ink">③ 읽기</text><text x="524" y="282" font-size="11.5" class="f-quiet">게이트에 기준 전압을 걸고</text><text x="524" y="298" font-size="11.5" class="f-quiet">셀이 켜지는지로 0·1 판정</text><rect x="40" y="84" width="96" height="24" fill-opacity="0.3" stroke-width="1" class="f-edge s-edge"></rect><text x="144" y="100" font-size="11.5" class="f-quiet">제어 게이트</text><rect x="40" y="108" width="96" height="14" stroke-width="1" class="f-tint s-edge"></rect><text x="144" y="119" font-size="11.5" class="f-quiet">블로킹 산화막</text><rect x="40" y="122" width="96" height="20" fill-opacity="0.2" stroke-width="1" class="f-acc2 s-edge"></rect><text x="144" y="136" font-size="11.5" class="f-quiet">전하 트랩(SiN)</text><rect x="40" y="142" width="96" height="12" stroke-width="1" class="f-tint s-edge"></rect><text x="144" y="152" font-size="11.5" class="f-quiet">터널 산화막</text><rect x="40" y="154" width="96" height="44" fill-opacity="0.1" stroke-width="1" class="f-acc s-edge"></rect><text x="144" y="180" font-size="11.5" class="f-quiet">채널(기판)</text><text x="88" y="100" text-anchor="middle" font-size="12" font-weight="600" class="f-ink">+20 V</text><circle cx="64" cy="132" r="4.5" class="f-acc"></circle><circle cx="64" cy="178" r="4.5" fill-opacity="0.3" class="f-acc"></circle><line x1="64" y1="170" x2="64" y2="140" stroke-width="1.8" marker-end="url(#u28n-aa