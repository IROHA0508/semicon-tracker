<svg xmlns="http://www.w3.org/2000/svg" width="760" height="464" viewBox="0 0 760 464" role="img" aria-label="NMOS와 PMOS의 단면에서 N웰의 위치, 전자와 정공의 이동 방식 비교, PMOS 폭을 넓히는 이유" font-size="12" class="fig"><title>NMOS와 PMOS의 단면에서 N웰의 위치, 전자와 정공의 이동 방식 비교, PMOS 폭을 넓히는 이유</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="u22n-ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-edge"></path></marker><marker id="u22n-aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-acc"></path></marker><marker id="u22n-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-acc2"></path></marker></defs><text x="24" y="26" font-size="15" font-weight="600" class="f-ink">NMOS와 PMOS는 한 장의 P형 웨이퍼에 함께 만들고, PMOS는 N웰 안에 넣습니다</text><text x="24" y="54" font-size="13" font-weight="600" class="f-ink">① 단면: 웰은 웨이퍼 일부를 반대 형으로 바꾼 우물</text><rect x="24" y="120" width="412" height="120" fill-opacity="0.1" stroke-width="1" class="f-acc2 s-edge"></rect><path d="M232 120V176Q232 198 254 198H402Q424 198 424 176V120Z" fill-opacity="0.2" stroke-width="1.5" class="f-acc s-acc"></path><rect x="210" y="120" width="16" height="34" fill-opacity="0.3" stroke-width="1" class="f-edge s-edge"></rect><rect x="44" y="120" width="48" height="22" fill-opacity="0.5" stroke-width="1" class="f-acc s-acc"></rect><rect x="152" y="120" width="48" height="22" fill-opacity="0.5" stroke-width="1" class="f-acc s-acc"></rect><rect x="98" y="114" width="48" height="6" fill-opacity="0.5" class="f-edge"></rect><rect x="98" y="92" width="48" height="22" fill-opacity="0.2" stroke-width="1" class="f-edge s-edge"></rect><rect x="250" y="120" width="46" height="22" fill-opacity="0.5" stroke-width="1" class="f-acc2 s-acc2"></rect><rect x="360" y="120" width="46" height="22" fill-opacity="0.5" stroke-width="1" class="f-acc2 s-acc2"></rect><rect x="302" y="114" width="52" height="6" fill-opacity="0.5" class="f-edge"></rect><rect x="302" y="92" width="52" height="22" fill-opacity="0.2" stroke-width="1" class="f-edge s-edge"></rect><text x="122" y="82" text-anchor="middle" font-size="12.5" font-weight="600" class="f-ink">NMOS</text><text x="328" y="82" text-anchor="middle" font-size="12.5" font-weight="600" class="f-ink">PMOS</text><text x="122" y="108" text-anchor="middle" font-size="11.5" class="f-ink">게이트</text><text x="328" y="108" text-anchor="middle" font-size="11.5" class="f-ink">게이트</text><text x="68" y="136" text-anchor="middle" font-size="12" font-weight="600" class="f-ink">N⁺</text><text x="176" y="136" text-anchor="middle" font-size="12" font-weight="600" class="f-ink">N⁺</text><text x="273" y="136" text-anchor="middle" font-size="12" font-weight="600" class="f-ink">P⁺</text><text x="383" y="136" text-anchor="middle" font-size="12" font-weight="600" class="f-ink">P⁺</text><text x="218" y="168" text-anchor="middle" font-size="11.5" class="f-quiet">STI</text><text x="328" y="186" text-anchor="middle" font-size="12" font-weight="600" class="f-ink">N웰(N형 우물)</text><text x="36" y="228" font-size="12" font-weight="600" class="f-ink">P형 웨이퍼(기판)</text><rect x="24" y="254" width="14" height="12" fill-opacity="0.3" class="f-acc"></rect><text x="44" y="264" font-size="11.5" class="f-quiet">N형 영역</text><rect x="118" y="254" width="14" height="12" fill-opacity="0.3" class="f-acc2"></rect><text x="138" y="264" font-size="11.5" class="f-quiet">P형 영역</text><text x="24" y="288" font-size="11.5" class="f-quiet">웨이퍼는 한 장(P형)이고, N웰은 그 안에 이온주입으로</text><text x="24" y="304" font-size="11.5" class="f-quiet">N형으로 바꿔 만든 영역입니다(3-14 웰 모듈)</text><text x="460" y="54" font-size="13" font-weight="600" class="f-ink">② 왜 PMOS가 느린가</text><rect x="460" y="66" width="276" height="92" fill="none" stroke-width="1" rx="8" class="s-edge"></rect><text x="472" y="86" font-size="12" font-weight="600" class="f-ink">전자(NMOS가 쓰는 운반자)</text><circle cx="484" cy="122" r="8" stroke-width="1" class="f-tint s-edge"></circle><circle cx="524" cy="122" r="8" stroke-width="1" class="f-tint s-edge"></circle><circle cx="564" cy="122" r="8" stroke-width="1" class="f-tint s-edge"></circle><circle cx="604" cy="122" r="8" stroke-width="1" class="f-tint s-edge"></circle><circle cx="644" cy="122" r="8" stroke-width="1" class="f-tint s-edge"></circle><circle cx="684" cy="122" r="8" stroke-width="1" class="f-tint s-edge"></circle><circle cx="496" cy="104" r="5" class="f-acc"></circle><line x1="504" y1="104" x2="700" y2="104" stroke-width="2" marker-end="url(#u22n-aa)" class="s-acc"></line><text x="472" y="148" font-size="11.5" class="f-quiet">결합에서 풀려나 자유롭게 달림 · 이동도 약 1,400</text><rect x="460" y="170" width="276" height="112" fill="none" stroke-width="1" rx="8" class="s-edge"></rect><text x="472" y="190" font-size="12" font-weight="600" class="f-ink">정공(PMOS가 쓰는 운반자)</text><circle cx="484" cy="226" r="8" stroke-width="1" class="f-tint s-edge"></circle><circle cx="484" cy="208" r="4" class="f-acc2"></circle><circle cx="524" cy="226" r="8" stroke-width="1" class="f-tint s-edge"></circle><circle cx="524" cy="208" r="4" class="f-acc2"></circle><circle cx="564" cy="226" r="8" stroke-width="1" class="f-tint s-edge"></circle><circle cx="564" cy="208" r="4" class="f-acc2"></circle><circle cx="604" cy="226" r="8" stroke-width="1" class="f-tint s-edge"></circle><circle cx="604" cy="208" r="5" fill="none" stroke-width="1.5" stroke-dasharray="2 2" class="s-acc2"></circle><circle cx="644" cy="226" r="8" stroke-width="1" class="f-tint s-edge"></circle><circle cx="644" cy="208" r="4" class="f-acc2"></circle><circle cx="684" cy="226" r="8" stroke-width="1" class="f-tint s-edge"></circle><circle cx="684" cy="208" r="4" class="f-acc2"></circle><path d="M640 202Q622 190 608 202" fill="none" stroke-width="1.5" marker-end="url(#u22n-ab)" class="s-acc2"></path><line x1="604" y1="246" x2="640" y2="246" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#u22n-ae)" class="s-edge"></line><text x="652" y="250" font-size="11.5" class="f-quiet">빈자리 이동</text><text x="472" y="272" font-size="11.5" class="f-quiet">이웃 전자가 한 칸씩 메워 이동 · 이동도 약 450</text><text x="24" y="334" font-size="13" font-weight="600" class="f-ink">③ 그래서 PMOS를 더 넓게 만듭니다(인버터의 오르내림 속도 맞추기)</text><text x="24" y="370" font-size="12" font-weight="600" class="f-ink">NMOS · 폭 W</text><rect x="150" y="358" width="300" height="18" fill-opacity="0.5" stroke-width="1" rx="3" class="f-acc s-acc"></rect><text x="458" y="371" font-size="11.5" class="f-quiet">전류 기준</text><text x="24" y="400" font-size="12" font-weight="600" class="f-ink">PMOS · 폭 W</text><rect x="150" y="388" width="120" height="18" fill-opacity="0.5" stroke-width="1" rx="3" class="f-acc2 s-acc2"></rect><text x="278" y="401" font-size="11.5" class="f-quiet">약 1/2~1/3</text><text x="24" y="430" font-size="12" font-weight="600" class="f-ink">PMOS · 폭 2~3W</text><rect x="150" y="418" width="300" height="18" fill-opacity="0.5" stroke-width="1" rx="3" class="f-acc2 s-acc2"></rect><text x="458" y="431" font-size="11.5" class="f-quiet">NMOS와 비슷</text><text x="560" y="362" font-size="11.5" class="f-quiet">출력이 올라갈 때는 PMOS가,</text><text x="560" y="380" font-size="11.5" class="f-quiet">내려갈 때는 NMOS가 전류를 흘림</text><text x="560" y="398" font-size="11.5" class="f-quiet">→ PMOS 폭을 키워 두 속도를</text><text x="560" y="416" font-size="11.5" class="f-quiet">같게 맞춤(2-4)</text><text x="24" y="452" font-size="11.5" class="f-quiet">이동도 단위는 cm²/V·s(실리콘 결정 속 대표값). 정공은 전자의 약 1/3이라 같은 크기면 PMOS 전류가 작습니다</text></svg>
