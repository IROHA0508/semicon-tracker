></rect><path d="M60 72V112M80 72V112M40 92H100" fill="none" stroke-width="1" stroke-dasharray="3 3" class="s-acc"></path><rect x="140" y="72" width="40" height="40" fill-opacity="0.18" stroke-width="1.5" class="f-acc2 s-acc2"></rect><path d="M160 72V112M140 92H180" fill="none" stroke-width="1" stroke-dasharray="3 3" class="s-acc2"></path><text x="70" y="132" text-anchor="middle" font-size="11.5" class="f-ink">6F² = 3F×2F</text><text x="160" y="132" text-anchor="middle" font-size="11.5" class="f-ink">4F² = 2F×2F</text><text x="24" y="160" font-size="11.5" class="f-quiet">F = 최소 선폭</text><text x="24" y="178" font-size="11.5" class="f-quiet">4F²면 같은 면적에</text><text x="24" y="196" font-size="11.5" class="f-quiet">셀을 약 1.5배</text></g><g><text x="250" y="52" font-weight="600" class="f-ink">② 셀 구조의 진화</text><rect x="254" y="150" width="140" height="40" stroke-width="1" class="f-tint s-edge"></rect><rect x="262" y="72" width="16" height="78" fill-opacity="0.35" stroke-width="1" class="f-acc s-acc"></rect><rect x="370" y="72" width="16" height="78" fill-opacity="0.35" stroke-width="1" class="f-acc s-acc"></rect><rect x="296" y="154" width="12" height="26" fill-opacity="0.6" class="f-edge"></rect><rect x="340" y="154" width="12" height="26" fill-opacity="0.6" class="f-edge"></rect><rect x="318" y="128" width="12" height="22" fill-opacity="0.5" class="f-ink"></rect><rect x="292" y="120" width="64" height="8" fill-opacity="0.5" class="f-ink"></rect><text x="324" y="66" text-anchor="middle" font-size="11.5" class="f-ink">높고 가느다란 커패시터</text><text x="324" y="206" text-anchor="middle" font-size="11.5" class="f-quiet">실리콘 속에 묻은 게이트</text><rect x="416" y="168" width="140" height="22" fill-opacity="0.2" stroke-width="1" class="f-acc2 s-acc2"></rect><rect x="416" y="156" width="140" height="10" fill-opacity="0.5" class="f-ink"></rect><rect x="446" y="112" width="14" height="44" fill-opacity="0.55" class="f-acc"></rect><rect x="510" y="112" width="14" height="44" fill-opacity="0.55" class="f-acc"></rect><rect x="440" y="118" width="5" height="32" fill-opacity="0.7" class="f-edge"></rect><rect x="461" y="118" width="5" height="32" fill-opacity="0.7" class="f-edge"></rect><rect x="504" y="118" width="5" height="32" fill-opacity="0.7" class="f-edge"></rect><rect x="525" y="118" width="5" height="32" fill-opacity="0.7" class="f-edge"></rect><rect x="446" y="72" width="14" height="40" fill-opacity="0.35" stroke-width="1" class="f-acc s-acc"></rect><rect x="510" y="72" width="14" height="40" fill-opacity="0.35" stroke-width="1" class="f-acc s-acc"></rect><text x="486" y="66" text-anchor="middle" font-size="11.5" class="f-ink">채널을 세로로</text><text x="486" y="206" text-anchor="middle" font-size="11.5" class="f-quiet">주변 회로는 셀 아래</text><rect x="578" y="172" width="146" height="18" stroke-width="1" class="f-tint s-edge"></rect><rect x="584" y="74" width="10" height="98" fill-opacity="0.5" class="f-ink"></rect><rect x="600" y="80" width="40" height="12" fill-opacity="0.55" class="f-acc"></rect><rect x="600" y="104" width="40" height="12" fill-opacity="0.55" class="f-acc"></rect><rect x="600" y="128" width="40" height="12" fill-opacity="0.55" class="f-acc"></rect><rect x="600" y="152" width="40" height="12" fill-opacity="0.55" class="f-acc"></rect><rect x="644" y="80" width="72" height="12" fill-opacity="0.22" stroke-width="1" class="f-acc s-acc"></rect><rect x="644" y="104" width="72" height="12" fill-opacity="0.22" stroke-width="1" class="f-acc s-acc"></rect><rect x="644" y="128" width="72" height="12" fill-opacity="0.22" stroke-width="1" class="f-acc s-acc"></rect><rect x="644" y="152" width="72" height="12" fill-opacity="0.22" stroke-width="1" class="f-acc s-acc"></rect><text x="649" y="66" text-anchor="middle" font-size="11.5" class="f-ink">눕힌 셀을 층층이</text><text x="649" y="206" text-anchor="middle" font-size="11.5" class="f-quiet">트랜지스터 + 눕힌 커패시터</text><text x="324" y="230" text-anchor="middle" font-size="12.5" font-weight="600" class="f-ink">현재: 6F² · B