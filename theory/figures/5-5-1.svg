<svg xmlns="http://www.w3.org/2000/svg" width="760" height="326" viewBox="0 0 760 326" role="img" aria-label="지역별 반도체 정책: 미국, 중국, 대만, 한국, 일본, 유럽과 기업에 주는 영향" font-size="13" class="fig"><title>지역별 반도체 정책: 미국, 중국, 대만, 한국, 일본, 유럽과 기업에 주는 영향</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><text x="24" y="26" font-size="15" font-weight="600" class="f-ink">반도체는 경제 안보 자산: 보조금으로 끌어오고, 통제·관세로 지킵니다</text><rect x="24" y="44" width="228" height="100" rx="10" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="266" y="44" width="228" height="100" rx="10" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="508" y="44" width="228" height="100" rx="10" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="24" y="156" width="228" height="100" rx="10" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="266" y="156" width="228" height="100" rx="10" fill-opacity="0.1" stroke-width="1.25" class="f-acc s-acc"></rect><rect x="508" y="156" width="228" height="100" rx="10" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><text x="38" y="68" font-size="12.5" font-weight="600" class="f-ink">미국</text><text x="38" y="90" font-size="11.5" class="f-ink">칩스법(2022) 보조금·세액공제</text><text x="38" y="109" font-size="11.5" class="f-ink">대중 첨단 장비·칩·HBM 수출 통제</text><text x="38" y="128" font-size="11.5" class="f-quiet">232조 반도체 관세 25%(2026.1, 예외 많음)</text><text x="280" y="68" font-size="12.5" font-weight="600" class="f-ink">중국</text><text x="280" y="90" font-size="11.5" class="f-ink">자급률 확대, 대규모 정책 펀드</text><text x="280" y="109" font-size="11.5" class="f-ink">CXMT·YMTC 메모리 육성</text><text x="280" y="128" font-size="11.5" class="f-quiet">성숙 공정 대규모 증설</text><text x="522" y="68" font-size="12.5" font-weight="600" class="f-ink">대만</text><text x="522" y="90" font-size="11.5" class="f-ink">TSMC 최선단 생산 집중</text><text x="522" y="109" font-size="11.5" class="f-ink">미국·일본·독일에 해외 팹</text><text x="522" y="128" font-size="11.5" class="f-quiet">공급망 지정학 리스크의 중심</text><text x="38" y="180" font-size="12.5" font-weight="600" class="f-ink">일본</text><text x="38" y="202" font-size="11.5" class="f-ink">라피더스 2nm(홋카이도)</text><text x="38" y="221" font-size="11.5" class="f-ink">TSMC 구마모토 공장 유치</text><text x="38" y="240" font-size="11.5" class="f-quiet">소재·장비 강국</text><text x="280" y="180" font-size="12.5" font-weight="600" class="f-ink">한국</text><text x="280" y="202" font-size="11.5" class="f-ink">반도체특별법 통과(2026.1)</text><text x="280" y="221" font-size="11.5" class="f-ink">국가전략기술 세액공제</text><text x="280" y="240" font-size="11.5" class="f-quiet">용인 반도체 클러스터</text><text x="522" y="180" font-size="12.5" font-weight="600" class="f-ink">유럽</text><text x="522" y="202" font-size="11.5" class="f-ink">EU 칩스법(2023)</text><text x="522" y="221" font-size="11.5" class="f-ink">ASML(네덜란드) 노광 장비</text><text x="522" y="240" font-size="11.5" class="f-quiet">차량·전력반도체 강점</text><rect x="24" y="270" width="712" height="48" rx="8" fill-opacity="0.1" stroke-width="1.25" class="f-acc2 s-acc2"></rect><text x="36" y="290" font-size="12" font-weight="600" class="f-ink">기업에 주는 영향</text><text x="36" y="309" font-size="11.5" class="f-ink">공장을 어디에 짓나 · 중국 공장·매출 운영 · 관세 비용 · 공급망 이중화 · 보조금 조건</text></svg>
