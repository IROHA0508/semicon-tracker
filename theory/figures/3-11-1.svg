<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-label="EDS 6단계, 욕조 곡선과 번인, 누적 수율" font-size="13" class="fig"><title>EDS 6단계, 욕조 곡선과 번인, 누적 수율</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="u311-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-edge"></path></marker></defs><text x="24" y="26" font-size="15" font-weight="600" class="f-ink">칩마다 전기로 검사하고 고칠 수 있는 것은 고치고 약한 것은 미리 걸러냅니다</text><g><rect x="24" y="44" width="112" height="80" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="144" y="44" width="112" height="80" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="264" y="44" width="112" height="80" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="384" y="44" width="112" height="80" rx="8" fill-opacity="0.12" stroke-width="2" class="f-acc s-acc"></rect><rect x="504" y="44" width="112" height="80" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="624" y="44" width="112" height="80" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><text x="34" y="68" font-size="12.5" font-weight="600" class="f-ink">① ET(EPM)</text><text x="34" y="90" font-size="11.5" class="f-quiet">스크라이브 TEG로</text><text x="34" y="108" font-size="11.5" class="f-quiet">전기 특성 측정</text><text x="154" y="68" font-size="12.5" font-weight="600" class="f-ink">② WBI</text><text x="154" y="90" font-size="11.5" class="f-quiet">고온·고전압으로</text><text x="154" y="108" font-size="11.5" class="f-quiet">초기 불량 걸러냄</text><text x="274" y="68" font-size="12.5" font-weight="600" class="f-ink">③ 프리 레이저</text><text x="274" y="90" font-size="11.5" class="f-quiet">전 셀 기능 검사</text><text x="274" y="108" font-size="11.5" class="f-quiet">불량 위치 파악</text><text x="394" y="68" font-size="12.5" font-weight="600" class="f-ink">④ 레이저 리페어</text><text x="394" y="90" font-size="11.5" class="f-quiet">예비 셀로 교체</text><text x="394" y="108" font-size="11.5" class="f-quiet">후 재검사</text><text x="514" y="68" font-size="12.5" font-weight="600" class="f-ink">⑤ 백그라인딩</text><text x="514" y="90" font-size="11.5" class="f-quiet">약 775 μm →</text><text x="514" y="108" font-size="11.5" class="f-quiet">수십 μm로 연삭</text><text x="634" y="68" font-size="12.5" font-weight="600" class="f-ink">⑥ 잉킹·맵</text><text x="634" y="90" font-size="11.5" class="f-quiet">불량 칩 표시</text><text x="634" y="108" font-size="11.5" class="f-quiet">→ 패키징에서 제외</text></g><g><text x="24" y="152" font-weight="600" class="f-ink">⑦ 왜 번인을 하나: 욕조 곡선</text><rect x="40" y="164" width="72" height="156" fill-opacity="0.08" class="f-acc"></rect><path d="M40 320H372" fill="none" stroke-width="1.25" marker-end="url(#u311-arrow)" class="s-edge"></path><path d="M40 320V160" fill="none" stroke-width="1.25" marker-end="url(#u311-arrow)" class="s-edge"></path><path d="M48 172C60 260 90 296 140 300H270C310 298 340 270 362 192" fill="none" stroke-width="2.25" class="s-acc2"></path><text x="118" y="186" font-size="11.5" class="f-ink">번인으로 초기 불량을 공장에서 소진</text><text x="205" y="290" text-anchor="middle" font-size="11.5" class="f-quiet">우발 고장(낮고 일정)</text><text x="330" y="226" text-anchor="end" font-size="11.5" class="f-quiet">마모 고장</text><text x="36" y="176" text-anchor="end" font-size="11.5" class="f-quiet">고장률</text><text x="372" y="336" text-anchor="end" font-size="11.5" class="f-quiet">사용 시간</text></g><g><text x="410" y="152" font-weight="600" class="f-ink">⑧ 누적 수율 = 단계별 수율의 곱</text><rect x="410" y="170" width="64" height="54" rx="8" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="490" y="170" width="64" height="54" rx="8" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="570" y="170" width="64" height="54" rx="8" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="650" y="170" width="64" height="54" rx="8" stroke-width="1.25" class="f-tint s-edge"></rect><text x="442" y="192" text-anchor="middle" font-size="12" class="f-ink">FAB</text><text x="442" y="212" text-anchor="middle" font-weight="600" class="f-ink">95%</text><text x="522" y="192" text-anchor="middle" font-size="12" class="f-ink">EDS</text><text x="522" y="212" text-anchor="middle" font-weight="600" class="f-ink">90%</text><text x="602" y="192" text-anchor="middle" font-size="12" class="f-ink">패키지</text><text x="602" y="212" text-anchor="middle" font-weight="600" class="f-ink">99%</text><text x="682" y="192" text-anchor="middle" font-size="12" class="f-ink">최종 테스트</text><text x="682" y="212" text-anchor="middle" font-weight="600" class="f-ink">98%</text><text x="482" y="202" text-anchor="middle" class="f-quiet">×</text><text x="562" y="202" text-anchor="middle" class="f-quiet">×</text><text x="642" y="202" text-anchor="middle" class="f-quiet">×</text><rect x="410" y="244" width="304" height="40" rx="8" fill-opacity="0.12" stroke-width="2" class="f-acc s-acc"></rect><text x="562" y="269" text-anchor="middle" font-size="12.5" font-weight="600" class="f-ink">누적 수율 ≈ 83%</text><text x="410" y="306" font-size="11.5" class="f-quiet">단계가 많을수록 작은 손실도 곱으로 쌓입니다(예시 숫자)</text></g></svg>
