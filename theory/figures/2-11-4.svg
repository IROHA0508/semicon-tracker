<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-label="낸드 스트링 읽기 방법과 TLC 여덟 상태를 일곱 기준 전압으로 구분하는 분포 그림" font-size="12" class="fig"><title>낸드 스트링 읽기 방법과 TLC 여덟 상태를 일곱 기준 전압으로 구분하는 분포 그림</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="u211c-aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-acc"></path></marker></defs><text x="24" y="26" font-size="15" font-weight="600" class="f-ink">낸드 읽기: 나머지 셀은 모두 켜 두고 한 셀에만 기준 전압을 걸어 묻습니다</text><text x="24" y="54" font-size="13" font-weight="600" class="f-ink">① 스트링 하나 읽기</text><text x="150" y="74" text-anchor="middle" font-size="11.5" font-weight="600" class="f-ink">비트라인(전류 감지)</text><line x1="150" y1="80" x2="150" y2="262" stroke-width="2" class="s-acc"></line><rect x="134" y="89" width="32" height="22" stroke-width="1" rx="3" class="f-tint s-ink"></rect><line x1="70" y1="100" x2="134" y2="100" stroke-width="1.5" class="s-edge"></line><rect x="134" y="121" width="32" height="22" stroke-width="1" rx="3" class="f-tint s-ink"></rect><line x1="70" y1="132" x2="134" y2="132" stroke-width="1.5" class="s-edge"></line><rect x="134" y="153" width="32" height="22" fill-opacity="0.3" stroke-width="2" rx="3" class="f-acc2 s-acc2"></rect><line x1="70" y1="164" x2="134" y2="164" stroke-width="2.5" class="s-acc2"></line><rect x="134" y="185" width="32" height="22" stroke-width="1" rx="3" class="f-tint s-ink"></rect><line x1="70" y1="196" x2="134" y2="196" stroke-width="1.5" class="s-edge"></line><rect x="134" y="217" width="32" height="22" stroke-width="1" rx="3" class="f-tint s-ink"></rect><line x1="70" y1="228" x2="134" y2="228" stroke-width="1.5" class="s-edge"></line><text x="64" y="104" text-anchor="end" font-size="11.5" class="f-quiet">Vpass</text><text x="64" y="136" text-anchor="end" font-size="11.5" class="f-quiet">Vpass</text><text x="64" y="168" text-anchor="end" font-size="11.5" font-weight="600" class="f-acc2">기준 전압</text><text x="64" y="200" text-anchor="end" font-size="11.5" class="f-quiet">Vpass</text><text x="64" y="232" text-anchor="end" font-size="11.5" class="f-quiet">Vpass</text><line x1="180" y1="90" x2="180" y2="250" stroke-width="2" marker-end="url(#u211c-aa)" class="s-acc"></line><text x="190" y="150" font-size="11.5" font-weight="600" class="f-acc">전류가 흐르면</text><text x="190" y="168" font-size="11.5" font-weight="600" class="f-acc">Vth &lt; 기준 전압</text><text x="190" y="186" font-size="11.5" class="f-quiet">안 흐르면 Vth &gt; 기준</text><text x="24" y="288" font-size="11.5" class="f-ink">1. 나머지 셀은 어떤 상태든 켜지는 Vpass로 모두 켬</text><text x="24" y="306" font-size="11.5" class="f-ink">2. 선택 셀에만 기준 전압을 걸고 전류를 봄</text><text x="24" y="324" font-size=