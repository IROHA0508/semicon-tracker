="middle" font-size="11.5" class="f-quiet">R3</text><line x1="561" y1="120" x2="561" y2="230" stroke-width="1" stroke-dasharray="3 3" class="s-ink"></line><text x="561" y="114" text-anchor="middle" font-size="11.5" class="f-quiet">R4</text><line x1="607" y1="120" x2="607" y2="230" stroke-width="1" stroke-dasharray="3 3" class="s-ink"></line><text x="607" y="114" text-anchor="middle" font-size="11.5" class="f-quiet">R5</text><line x1="653" y1="120" x2="653" y2="230" stroke-width="1" stroke-dasharray="3 3" class="s-ink"></line><text x="653" y="114" text-anchor="middle" font-size="11.5" class="f-quiet">R6</text><line x1="699" y1="120" x2="699" y2="230" stroke-width="1" stroke-dasharray="3 3" class="s-ink"></line><text x="699" y="114" text-anchor="middle" font-size="11.5" class="f-quiet">R7</text><text x="736" y="264" text-anchor="end" font-size="11.5" class="f-quiet">문턱전압(Vth) →</text><text x="380" y="288" font-size="11.5" class="f-quiet">E는 지운 상태, P1~P7은 써진 상태(전자가 많을수록 오른쪽).</text><text x="380" y="306" font-size="11.5" class="f-quiet">점선 R1~R7이 기준 전압이고 분포가 점선을 넘어가면</text><text x="380" y="324" font-size="11.5" class="f-quiet">잘못 읽혀 오류가 됩니다(④~⑦).</text></svg>
