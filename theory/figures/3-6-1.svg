<svg xmlns="http://www.w3.org/2000/svg" width="760" height="396" viewBox="0 0 760 396" role="img" aria-label="습식과 건식 식각 프로파일, 고종횡비, 로딩 효과, 종점 검출, 첨단 식각 기술" font-size="13" class="fig"><title>습식과 건식 식각 프로파일, 고종횡비, 로딩 효과, 종점 검출, 첨단 식각 기술</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="u36-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-edge"></path></marker><marker id="u36-ion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-acc2"></path></marker></defs><text x="24" y="26" font-size="15" font-weight="600" class="f-ink">식각은 원하는 곳만, 원하는 방향으로, 원하는 깊이까지 깎는 기술입니다</text><g><text x="24" y="56" font-weight="600" class="f-ink">① 습식: 등방성 → 언더컷</text><rect x="44" y="120" width="70" height="14" fill-opacity="0.25" stroke-width="1" class="f-acc s-acc"></rect><rect x="164" y="120" width="70" height="14" fill-opacity="0.25" stroke-width="1" class="f-acc s-acc"></rect><path d="M44 134H96Q96 174 139 174Q182 174 182 134H234V174H44Z" fill-opacity="0.28" stroke-width="1.25" class="f-acc2 s-acc2"></path><rect x="44" y="174" width="190" height="20" stroke-width="1" class="f-tint s-edge"></rect><path d="M198 112L180 136" fill="none" stroke-width="1.25" class="s-edge"></path><text x="200" y="108" font-size="11.5" class="f-ink">언더컷</text><text x="24" y="216" font-size="11.5" class="f-quiet">빠르고 선택비↑, 옆으로도 깎임</text></g><g><text x="267" y="56" font-weight="600" class="f-ink">② 건식(RIE): 이방성</text><rect x="287" y="120" width="70" height="14" fill-opacity="0.25" stroke-width="1" class="f-acc s-acc"></rect><rect x="407" y="120" width="70" height="14" fill-opacity="0.25" stroke-width="1" class="f-acc s-acc"></rect><rect x="287" y="134" width="70" height="40" fill-opacity="0.28" stroke-width="1.25" class="f-acc2 s-acc2"></rect><rect x="407" y="134" width="70" height="40" fill-opacity="0.28" stroke-width="1.25" class="f-acc2 s-acc2"></rect><rect x="357" y="134" width="4" height="40" fill-opacity="0.85" class="f-acc2"></rect><rect x="403" y="134" width="4" height="40" fill-opacity="0.85" class="f-acc2"></rect><rect x="287" y="174" width="190" height="20" stroke-width="1" class="f-tint s-edge"></rect><path d="M372 80V110" fill="none" stroke-width="1.75" marker-end="url(#u36-ion)" class="s-acc2"></path><path d="M392 80V110" fill="none" stroke-width="1.75" marker-end="url(#u36-ion)" class="s-acc2"></path><circle cx="364" cy="96" r="3" class="f-acc"></circle><circle cx="382" cy="88" r="3" class="f-acc"></circle><circle cx="400" cy="100" r="3" class="f-acc"></circle><text x="414" y="92" font-size="11.5" class="f-ink">이온: 수직</text><text x="414" y="108" font-size="11.5" class="f-quiet">● 라디칼: 반응</text><text x="267" y="216" font-size="11.5" class="f-quiet">이온은 수직, 측벽은 폴리머가 보호</text></g><g><text x="510" y="56" font-weight="600" class="f-ink">③ 고종횡비: AR = 높이 ÷ 폭</text><rect x="570" y="94" width="45" height="10" fill-opacity="0.25" stroke-width="1" class="f-acc s-acc"></rect><rect x="635" y="94" width="45" height="10" fill-opacity="0.25" stroke-width="1" class="f-acc s-acc"></rect><rect x="570" y="104" width="45" height="80" fill-opacity="0.28" stroke-width="1.25" class="f-acc2 s-acc2"></rect><rect x="635" y="104" width="45" height="80" fill-opacity="0.28" stroke-width="1.25" class="f-acc2 s-acc2"></rect><rect x="570" y="184" width="110" height="10" stroke-width="1" class="f-tint s-edge"></rect><path d="M690 104V184M686 104H694M686 184H694M615 86H635M615 82V90M635 82V90" fill="none" stroke-width="1.25" class="s-edge"></path><text x="698" y="148" font-size="12" class="f-ink">h</text><text x="625" y="78" text-anchor="middle" font-size="12" class="f-ink">w</text><text x="510" y="216" font-size="11.5" class="f-quiet">깊을수록 부산물이 빠져나오기 어려움</text></g><g><text x="24" y="252" font-weight="600" class="f-ink">④ 로딩 효과</text><rect x="40" y="270" width="10" height="50" fill-opacity="0.28" stroke-width="1.25" class="f-acc2 s-acc2"></rect><rect x="60" y="270" width="10" height="50" fill-opacity="0.28" stroke-width="1.25" class="f-acc2 s-acc2"></rect><rect x="80" y="270" width="10" height="50" fill-opacity="0.28" stroke-width="1.25" class="f-acc2 s-acc2"></rect><rect x="100" y="270" width="10" height="50" fill-opacity="0.28" stroke-width="1.25" class="f-acc2 s-acc2"></rect><rect x="120" y="270" width="10" height="50" fill-opacity="0.28" stroke-width="1.25" class="f-acc2 s-acc2"></rect><rect x="140" y="270" width="20" height="50" fill-opacity="0.28" stroke-width="1.25" class="f-acc2 s-acc2"></rect><rect x="40" y="320" width="120" height="30" fill-opacity="0.28" stroke-width="1.25" class="f-acc2 s-acc2"></rect><rect x="160" y="270" width="40" height="70" fill-opacity="0.28" stroke-width="1.25" class="f-acc2 s-acc2"></rect><rect x="300" y="270" width="60" height="70" fill-opacity="0.28" stroke-width="1.25" class="f-acc2 s-acc2"></rect><rect x="160" y="340" width="200" height="10" fill-opacity="0.28" stroke-width="1.25" class="f-acc2 s-acc2"></rect><text x="100" y="368" text-anchor="middle" font-size="11.5" class="f-ink">촘촘한 곳: 덜 깎임</text><text x="250" y="368" text-anchor="middle" font-size="11.5" class="f-ink">넓은 곳: 더 깎임</text><text x="24" y="388" font-size="11.5" class="f-quiet">마이크로 로딩: 좁은 홈에서 부산물이 빠지지 않아 느려짐</text></g><g><text x="400" y="252" font-weight="600" class="f-ink">⑤ 종점 검출(EPD)</text><path d="M410 350H556" fill="none" stroke-width="1.25" marker-end="url(#u36-arrow)" class="s-edge"></path><path d="M410 350V266" fill="none" stroke-width="1.25" marker-end="url(#u36-arrow)" class="s-edge"></path><path d="M502 350V282" fill="none" stroke-width="1" stroke-dasharray="4 3" class="s-edge"></path><path d="M414 296H496L508 332H552" fill="none" stroke-width="2" class="s-acc"></path><text x="416" y="276" font-size="11.5" class="f-quiet">OES 빛 세기</text><text x="502" y="366" text-anchor="middle" font-size="11.5" font-weight="600" class="f-ink">종점</text><text x="556" y="366" text-anchor="end" font-size="11.5" class="f-quiet">시간</text><text x="400" y="388" font-size="11.5" class="f-quiet">막이 다 깎이면 부산물의 빛이 줄어듦</text></g><g><text x="580" y="252" font-weight="600" class="f-ink">⑥ 첨단 식각 기술</text><rect x="580" y="264" width="156" height="24" rx="6" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="580" y="294" width="156" height="24" rx="6" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="580" y="324" width="156" height="24" rx="6" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="580" y="354" width="156" height="24" rx="6" stroke-width="1.25" class="f-tint s-edge"></rect><text x="590" y="280" font-size="11.5" class="f-ink">펄스 플라즈마</text><text x="590" y="310" font-size="11.5" class="f-ink">극저온(크라이오) 식각</text><text x="590" y="340" font-size="11.5" class="f-ink">원자층 식각(ALE)</text><text x="590" y="370" font-size="11.5" class="f-ink">보쉬 공정(DRIE)</text></g></svg>
