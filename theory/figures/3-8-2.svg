<svg xmlns="http://www.w3.org/2000/svg" width="760" height="302" viewBox="0 0 760 302" role="img" aria-label="이온주입 후 격자 손상과 열처리에 의한 회복, 활성화, 과도한 확산을 보여 주는 네 단계" font-size="12" class="fig"><title>이온주입 후 격자 손상과 열처리에 의한 회복, 활성화, 과도한 확산을 보여 주는 네 단계</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="u38i-ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-edge"></path></marker><marker id="u38i-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-acc2"></path></marker></defs><text x="24" y="26" font-size="15" font-weight="600" class="f-ink">이온주입에서 열처리까지: 넣고 → 망가지고 → 고치며 자리 잡기</text><rect x="24" y="44" width="172" height="212" fill="none" stroke-width="1" rx="10" class="s-edge"></rect><text x="34" y="64" font-size="12" font-weight="600" class="f-ink">① 주입</text><text x="34" y="230" font-size="11.5" class="f-quiet">이온을 가속해 원하는</text><text x="34" y="246" font-size="11.5" class="f-quiet">깊이에 박아 넣음</text><line x1="197" y1="140" x2="203" y2="140" stroke-width="1.5" marker-end="url(#u38i-ae)" class="s-edge"></line><rect x="204" y="44" width="172" height="212" fill="none" stroke-width="1" rx="10" class="s-edge"></rect><text x="214" y="64" font-size="12" font-weight="600" class="f-ink">② 결정 손상</text><text x="214" y="230" font-size="11.5" class="f-quiet">부딪힌 격자가 흐트러짐</text><text x="214" y="246" font-size="11.5" class="f-quiet">(도펀트는 아직 비활성)</text><line x1="377" y1="140" x2="383" y2="140" stroke-width="1.5" marker-end="url(#u38i-ae)" class="s-edge"></line><rect x="384" y="44" width="172" height="212" fill="none" stroke-width="1" rx="10" class="s-edge"></rect><text x="394" y="64" font-size="12" font-weight="600" class="f-ink">③ 열처리: 회복·활성화</text><text x="394" y="230" font-size="11.5" class="f-quiet">가열하면 결정이 회복되고</text><text x="394" y="246" font-size="11.5" class="f-quiet">도펀트가 격자 자리로(활성화)</text><line x1="557" y1="140" x2="563" y2="140" stroke-width="1.5" marker-end="url(#u38i-ae)" class="s-edge"></line><rect x="564" y="44" width="172" height="212" fill="none" stroke-width="1" rx="10" class="s-edge"></rect><text x="574" y="64" font-size="12" font-weight="600" class="f-ink">④ 너무 오래 가열하면</text><text x="574" y="230" font-size="11.5" class="f-quiet">오래 가열하면 퍼져 버림</text><text x="574" y="246" font-size="11.5" class="f-quiet">→ 짧고 빠른 열처리(RTA)</text><circle cx="54" cy="96" r="5.5" stroke-width="1" class="f-tint s-edge"></circle><circle cx="76" cy="96" r="5.5" stroke-width="1" class="f-tint s-edge"></circle><circle cx="98" cy="96" r="5.5" stroke-width="1" class="f-tint s-edge"></circle><circle cx="120" cy="96" r="5.5" stroke-width="1" class="f-tint s-edge"></circle><circle cx="142