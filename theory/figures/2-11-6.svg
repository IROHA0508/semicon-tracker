-weight="600" class="f-ink">3. A·B를 통째로 지움 → 빈 블록 2개</text><rect x="392" y="252" width="20" height="20" fill="none" stroke-width="1" rx="3" class="s-grid"></rect><rect x="416" y="252" width="20" height="20" fill="none" stroke-width="1" rx="3" class="s-grid"></rect><rect x="440" y="252" width="20" height="20" fill="none" stroke-width="1" rx="3" class="s-grid"></rect><rect x="464" y="252" width="20" height="20" fill="none" stroke-width="1" rx="3" class="s-grid"></rect><rect x="392" y="276" width="20" height="20" fill="none" stroke-width="1" rx="3" class="s-grid"></rect><rect x="416" y="276" width="20" height="20" fill="none" stroke-width="1" rx="3" class="s-grid"></rect><rect x="440" y="276" width="20" height="20" fill="none" stroke-width="1" rx="3" class="s-grid"></rect><rect x="464" y="276" width="20" height="20" fill="none" stroke-width="1" rx="3" class="s-grid"></rect><rect x="500" y="252" width="20" height="20" fill="none" stroke-width="1" rx="3" class="s-grid"></rect><rect x="524" y="252" width="20" height="20" fill="none" stroke-width="1" rx="3" class="s-grid"></rect><rect x="548" y="252" width="20" height="20" fill="none" stroke-width="1" rx="3" class="s-grid"></rect><rect x="572" y="252" width="20" height="20" fill="none" stroke-width="1" rx="3" class="s-grid"></rect><rect x="500" y="276" width="20" height="20" fill="none" stroke-width="1" rx="3" class="s-grid"></rect><rect x="524" y="276" width="20" height="20" fill="none" stroke-width="1" rx="3" class="s-grid"></rect><rect x="548" y="276" width="20" height="20" fill="none" stroke-width="1" rx="3" class="s-grid"></rect><rect x="572" y="276" width="20" height="20" fill="none" stroke-width="1" rx="3" class="s-grid"></rect><rect x="620" y="252" width="20" height="20" fill-opacity="0.6" stroke-width="1" rx="3" class="f-acc s-acc"></rect><rect x="644" y="252" width="20" height="20" fill-opacity="0.6" stroke-width="1" rx="3" class="f-acc s-acc"></rect><rect x="668" y="252" width="20" height="20" fill-opacity="0.6" stroke-width="1" rx="3" class="f-acc s-acc"></rect><rect x="692" y="252" width="20" height="20" fill-opacity="0.6" stroke-width="1" rx="3" class="f-acc s-acc"></rect><rect x="620" y="276" width="20" height="20" fill-opacity="0.6" stroke-width="1" rx="3" class="f-acc s-acc"></rect><rect x="644" y="276" width="20" height="20" fill-opacity="0.6" stroke-width="1" rx="3" class="f-acc s-acc"></rect><rect x="668" y="276" width="20" height="20" fill-opacity="0.6" stroke-width="1" rx="3" class="f-acc s-acc"></rect><rect x="692" y="276" width="20" height="20" fill="none" stroke-width="1" rx="3" class="s-grid"></rect><text x="438" y="320" text-anchor="middle" font-size="11.5" class="f-quiet">블록 A</text><text x="546" y="320" text-anchor="middle" font-size="11.5" class="f-quiet">블록 B</text><text x="666" y="320" text-anchor="middle" font-size="11.5" class="f-quiet">블록 C</text><rect x="24" y="334" width="14" height="12" fill-opacity="0.6" class="f-acc"></rect><text x="44" y="344" font-size="11.5" class="f-quiet">유효 페이지</text><rect x="128" y="334" width="14" height="12" fill-opacity="0.2" class="f-acc2"></rect><text x="148" y="344" font-size="11.5" class="f-quiet">무효(옛 데이터)</text><rect x="262" y="334" width="14" height="12" fill="none" stroke-width="1" class="s-grid"></rect><text x="282" y="344" font-size="11.5" class="f-quiet">빈 페이지</text><text x="24" y="370" font-size="11.5" class="f-quiet">낸드는 덮어쓰기가 안 돼 새 데이터는 빈 페이지에 쓰고 옛 페이지는 무효로 둡니다. FTL은 이 밖에 논리 주소를 실제 위치에</text><text x="24" y="388" font-size="11.5" class="f-quiet">대응시키고(주소 변환), 블록을 골고루 쓰게 하고(웨어 레벨링), 여유 공간(OP)을 확보합니다.</text></svg>
