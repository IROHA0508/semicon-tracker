<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-label="낸드 컨트롤러가 읽기 오류를 단계적으로 처리하는 순서와 가비지 컬렉션 세 단계" font-size="12" class="fig"><title>낸드 컨트롤러가 읽기 오류를 단계적으로 처리하는 순서와 가비지 컬렉션 세 단계</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="u211e-ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-edge"></path></marker><marker id="u211e-aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-acc"></path></marker></defs><text x="24" y="26" font-size="15" font-weight="600" class="f-ink">컨트롤러의 대응: 오류는 단계적으로 고치고 빈 블록은 가비지 컬렉션으로 만듭니다</text><text x="24" y="54" font-size="13" font-weight="600" class="f-ink">① 읽을 때 오류를 다루는 순서</text><rect x="36" y="66" width="250" height="34" stroke-width="1" rx="8" class="f-tint s-edge"></rect><text x="161" y="88" text-anchor="middle" font-size="12" font-weight="600" class="f-ink">읽기</text><line x1="161" y1="102" x2="161" y2="114" stroke-width="1.5" marker-end="url(#u211e-ae)" class="s-edge"></line><rect x="36" y="116" width="250" height="34" fill-opacity="0.1" stroke-width="1.5" rx="8" class="f-acc s-acc"></rect><text x="161" y="138" text-anchor="middle" font-size="12" font-weight="600" class="f-ink">ECC(LDPC)로 틀린 비트 고치기</text><line x1="161" y1="152" x2="161" y2="164" stroke-width="1.5" marker-end="url(#u211e-ae)" class="s-edge"></line><text x="172" y="162" font-size="11.5" class="f-quiet">실패하면</text><rect x="36" y="166" width="250" height="34" stroke-width="1" rx="8" class="f-tint s-edge"></rect><text x="161" y="188" text-anchor="middle" font-size="12" font-weight="600" class="f-ink">기준 전압을 옮겨 다시 읽기</text><line x1="161" y1="202" x2="161" y2="214" stroke-width="1.5" marker-end="url(#u211e-ae)" class="s-edge"></line><text x="172" y="212" font-size="11.5" class="f-quiet">실패하면</text><rect x="36" y="216" width="250" height="34" stroke-width="1" rx="8" class="f-tint s-edge"></rect><text x="161" y="238" text-anchor="middle" font-size="12" font-weight="600" class="f-ink">소프트 디코딩·상위 복구</text><line x1="161" y1="252" x2="161" y2="264" stroke-width="1.5" marker-end="url(#u211e-ae)" class="s-edge"></line><text x="172" y="262" font-size="11.5" class="f-quiet">실패하면</text><rect x="36" y="266" width="250" height="34" stroke-width="1" rx="8" class="f-tint s-edge"></rect><text x="161" y="288" text-anchor="middle" font-size="12" font-weight="600" class="f-ink">자주 실패하는 블록은 배드 블록 처리</text><line x1="288" y1="133" x2="330" y2="133" stroke-width="2" marker-end="url(#u211e-aa)" class="s-acc"></line><text x="300" y="120" font-size="11.5" font-weight="600" class="f-acc">성공</text><text x="300" y="154" font-size="11.5" font-weight="600" class="f-acc">→ 전달</text><text x="384" y="54" font-size="13" font-weight="600" class="f-ink">② 가비지 컬렉션 3단계</text><text x="384" y="78" font-size="12" font-weight="600" class="f-ink">1. 블록 A·B에 유효·무효 페이지가 섞임</text><rect x="392" y="88" width="20" height="20" fill-opacity="0.6" stroke-width="1" rx="3" class="f-acc s-acc"></rect><rect x="416" y="88" width="20" height="20" fill-opacity="0.2" stroke-width="1" rx="3" class="f-acc2 s-acc2"></rect><rect x="440" y="88" width="20" height="20" fill-opacity="0.6" stroke-width="1" rx="3" class="f-acc s-acc"></rect><rect x="464" y="88" width="20" height="20" fill-opacity="0.2" stroke-width="1" rx="3" class="f-acc2 s-acc2"></rect><rect x="392" y="112" width="20" height="20" fill-opacity="0.2" stroke-width="1" rx="3" class="f-acc2 s-acc2"></rect><rect x="416" y="112" width="20" height="20" fill-opacity="0.6" stroke-width="1" rx="3" class="f-acc s-acc"></rect><rect x="440" y="112" width="20" height="20" fill-opacity="0.2" stroke-width="1" rx="3" class="f-acc2 s-acc2"></rect><rect x="464" y="112" width="20" height="20" fill-opacity="0.6" stroke-width="1" rx="3" class="f-acc s-acc"></rect><rect x="500" y="88" width="20" height="20" fill-opacity="0.2" stroke-width="1" rx="3" class="f-acc2 s-acc2"></rect><rect x="524" y="88" width="20" height="20" fill-opacity="0.6" stroke-width="1" rx="3" class="f-acc s-acc"></rect><rect x="548" y="88" width="20" height="20" fill-opacity="0.2" stroke-width="1" rx="3" class="f-acc2 s-acc2"></rect><rect x="572" y="88" width="20" height="20" fill-opacity="0.2" stroke-width="1" rx="3" class="f-acc2 s-acc2"></rect><rect x="500" y="112" width="20" height="20" fill-opacity="0.6" stroke-width="1" rx="3" class="f-acc s-acc"></rect><rect x="524" y="112" width="20" height="20" fill-opacity="0.2" stroke-width="1" rx="3" class="f-acc2 s-acc2"></rect><rect x="548" y="112" width="20" height="20" fill-opacity="0.2" stroke-width="1" rx="3" class="f-acc2 s-acc2"></rect><rect x="572" y="112" width="20"