idth="38" height="26" fill-opacity="0.2" stroke-width="1.5" class="f-acc s-acc"></rect><rect x="70" y="66" width="120" height="30" fill="none" stroke-width="1.5" class="s-ink"></rect><rect x="70" y="96" width="120" height="18" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="70" y="114" width="120" height="22" fill-opacity="0.2" stroke-width="1.5" class="f-acc2 s-acc2"></rect><rect x="70" y="136" width="120" height="14" stroke-width="1.25" class="f-tint s-edge"></rect><circle cx="90" cy="125" r="4" class="f-acc"></circle><circle cx="110" cy="125" r="4" class="f-acc"></circle><circle cx="130" cy="125" r="4" class="f-acc"></circle><circle cx="150" cy="125" r="4" class="f-acc"></circle><circle cx="170" cy="125" r="4" class="f-acc"></circle><path d="M130 192V140" fill="none" stroke-width="1.75" marker-end="url(#u28-flow)" class="s-acc"></path><text x="240" y="87" class="f-ink">제어 게이트</text><text x="240" y="109" font-size="11.5" class="f-quiet">블로킹 산화막</text><text x="240" y="129" font-size="11.5" font-weight="600" class="f-ink">전하 트랩층(SiN)</text><text x="240" y="148" font-size="11.5" class="f-quiet">터널 산화막</text><text x="240" y="184" font-size="11.5" class="f-quiet">채널(기판)</text><text x="30" y="232" font-size="12" font-weight="600" class="f-ink">쓰기: 게이트에 약 20 V</text><text x="30" y="249" font-size="11.5" class="f-quiet">→ 전자가 터널 산화막을 뚫고 갇힘</text><text x="30" y="274" font-size="12" font-weight="600" class="f-ink">지우기: 기판 쪽에 고전압</text><text x="30" y="291" font-size="11.5" class="f-quiet">→ 전자를 빼냄(블록 단위로 한꺼번에)</text><text x="30" y="318" font-size="12" class="f-ink">갇힌 전자가 많을수록 문턱전압이 올라감</text></g><g><text x="340" y="70" font-weight="600" class="f-ink">SLC · 1비트 · 상태 2개</text><path d="M340 150H736M340 270H736" fill="none" stroke-width="1.25" class="s-edge"></path><path d="M386 150C408 150 408 92 430 92C452 92 452 150 474 150" fill-opacity="0.18" stroke-width="1.75" class="f-acc s-acc"></path><path d="M596 150C618 150 618 92 640 92C662 92 662 150 684 150" fill-opacit