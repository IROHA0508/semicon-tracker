t">가열만 해도 SiO₂가 자라고 계면 결함이 적음</text></g><g><rect x="330" y="268" width="406" height="56" rx="8" fill="none" stroke-width="1.25" class="s-edge"></rect><text x="346" y="290" font-weight="600" class="f-ink">④ 크고 순수한 단결정을 만들 수 있다</text><text x="346" y="310" font-size="11.5" class="f-quiet">지름 300mm, 순도 100%(11N)</text></g></svg>
