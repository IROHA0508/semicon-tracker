<svg xmlns="http://www.w3.org/2000/svg" width="760" height="356" viewBox="0 0 760 356" role="img" aria-label="CMOS 인버터 회로와 진리표, 트랜지스터에서 프로세서까지의 단계" font-size="13" class="fig"><title>CMOS 인버터 회로와 진리표, 트랜지스터에서 프로세서까지의 단계</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="u16-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-edge"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" class="f-ink">트랜지스터 두 개로 0과 1을 뒤집는 CMOS 인버터</text><g fill="none" stroke-width="1.5" class="s-edge"><path d="M200 78H300"></path><path d="M250 78V100"></path><path d="M250 150V190"></path><path d="M250 170H336" marker-end="url(#u16-arrow)"></path><path d="M250 240V262"></path><path d="M220 262H280"></path><path d="M100 170H160"></path><path d="M160 125V215"></path><path d="M160 125H200"></path><path d="M160 215H200"></path></g><g><rect x="200" y="100" width="100" height="50" rx="6" fill-opacity="0.12" stroke-width="2" class="f-acc2 s-acc2"></rect><text x="250" y="122" text-anchor="middle" font-weight="600" class="f-ink">PMOS</text><text x="250" y="140" text-anchor="middle" font-size="11.5" class="f-quiet">입력 0이면 켜짐</text></g><g><rect x="200" y="190" width="100" height="50" rx="6" fill-opacity="0.12" stroke-width="2" class="f-acc s-acc"></rect><text x="250" y="212" text-anchor="middle" font-weight="600" class="f-ink">NMOS</text><text x="250" y="230" text-anchor="middle" font-size="11.5" class="f-quiet">입력 1이면 켜짐</text></g><circle cx="250" cy="170" r="4" class="f-ink"></circle><text x="250" y="68" text-anchor="middle" class="f-ink">VDD = 1</text><text x="250" y="284" text-anchor="middle" class="f-ink">GND = 0</text><text x="92" y="174" text-anchor="end" font-weight="600" class="f-ink">입력</text><text x="344" y="174" font-weight="600" class="f-ink">출력</text><g><rect x="400" y="84" width="84" height="36" fill="none" fill-opacity="1" stroke-width="1" class="s-edge"></rect><rect x="400" y="120" width="84" height="42" fill="none" fill-opacity="1" stroke-width="1" class="s-edge"></rect><rect x="400" y="162" width="84" height="42" fill="none" fill-opacity="1" stroke-width="1" class="s-edge"></rect><rect x="484" y="84" width="84" height="36" fill="none" fill-opacity="1" stroke-width="1" class="s-edge"></rect><rect x="484" y="120" width="84" height="42" fill="none" fill-opacity="1" stroke-width="1" class="s-edge"></rect><rect x="484" y="162" width="84" height="42" fill="none" fill-opacity="1" stroke-width="1" class="s-edge"></rect><rect x="568" y="84" width="84" height="36" fill="none" fill-opacity="1" stroke-width="1" class="s-edge"></rect><rect x="568" y="120" width="84" height="42" fill="none" fill-opacity="1" stroke-width="1" class="s-edge"></rect><rect x="568" y="162" width="84" height="42" fill="none" fill-opacity="1" stroke-width="1" class="s-edge"></rect><rect x="652" y="84" width="84" height="36" fill-opacity="0.12" stroke-width="1" class="f-acc s-edge"></rect><rect x="652" y="120" width="84" height="42" fill-opacity="0.12" stroke-width="1" class="f-acc s-edge"></rect><rect x="652" y="162" width="84" height="42" fill-opacity="0.12" stroke-width="1" class="f-acc s-edge"></rect><text x="442" y="107" text-anchor="middle" font-weight="600" class="f-ink">입력</text><text x="526" y="107" text-anchor="middle" font-weight="600" class="f-ink">PMOS</text><text x="610" y="107" text-anchor="middle" font-weight="600" class="f-ink">NMOS</text><text x="694" y="107" text-anchor="middle" font-weight="600" class="f-ink">출력</text><text x="442" y="146" text-anchor="middle" class="f-ink">0</text><text x="526" y="146" text-anchor="middle" class="f-ink">켜짐</text><text x="610" y="146" text-anchor="middle" class="f-quiet">꺼짐</text><text x="694" y="146" text-anchor="middle" font-weight="600" class="f-ink">1</text><text x="442" y="188" text-anchor="middle" class="f-ink">1</text><text x="526" y="188" text-anchor="middle" class="f-quiet">꺼짐</text><text x="610" y="188" text-anchor="middle" class="f-ink">켜짐</text><text x="694" y="188" text-anchor="middle" font-weight="600" class="f-ink">0</text><text x="400" y="234" font-size="12" class="f-quiet">입력과 반대가 나오므로 NOT 게이트(인버터)</text><text x="400" y="256" font-size="12" class="f-quiet">한쪽은 늘 꺼져 있어 대기 중 전류가 거의 없음</text></g><g fill="none" stroke-width="1.25" class="s-edge"><path d="M184 322H210" marker-end="url(#u16-arrow)"></path><path d="M372 322H398" marker-end="url(#u16-arrow)"></path><path d="M560 322H586" marker-end="url(#u16-arrow)"></path></g><g><rect x="24" y="302" width="160" height="40" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" class="s-edge"></rect><rect x="212" y="302" width="160" height="40" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" class="s-edge"></rect><rect x="400" y="302" width="160" height="40" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" class="s-edge"></rect><rect x="588" y="302" width="160" height="40" rx="8" fill-opacity="0.12" stroke-width="2" class="f-acc s-acc"></rect><text x="104" y="327" text-anchor="middle" class="f-ink">트랜지스터(스위치)</text><text x="292" y="327" text-anchor="middle" class="f-ink">논리 게이트</text><text x="480" y="327" text-anchor="middle" class="f-ink">덧셈기·연산 회로</text><text x="668" y="327" text-anchor="middle" font-weight="600" class="f-ink">CPU·GPU·메모리</text></g></svg>
