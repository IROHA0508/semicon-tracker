e="11.5" class="f-quiet">입력</text><text x="510" y="164" text-anchor="middle" font-weight="600" class="f-ink">P⁺</text><text x="690" y="164" text-anchor="middle" font-weight="600" class="f-ink">P⁺</text></g><text x="400" y="164" text-anchor="middle" font-weight="600" class="f-ink">STI</text><text x="400" y="182" text-anchor="middle" font-size="11.5" class="f-quiet">산화막 벽</text><text x="640" y="252" text-anchor="middle" class="f-ink">N-웰</text><text x="170" y="252" text-anchor="middle" class="f-ink">P형 기판</text><path d="M510 178C506 236 300 252 116 180" fill="none" stroke-width="1.75" stroke-dasharray="6 4" class="s-acc2"></path><text x="400" y="300" text-anchor="middle" font-size="12" class="f-ink">점선: P⁺ → N-웰 → P기판 → N⁺ 기생 경로(켜지면 래치업)</text></svg>
