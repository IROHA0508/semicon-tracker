<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-label="커패시터는 전하를 담는 물컵이고 용량은 면적 간격 유전율로 정해진다" font-size="13" class="fig"><title>커패시터는 전하를 담는 물컵이고 용량은 면적 간격 유전율로 정해진다</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="u12-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-edge"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" class="f-ink">커패시터는 전하를 담는 물컵이고 용량은 면적·간격·유전율이 정합니다</text><g stroke-width="1.25" class="s-edge"><line x1="180" y1="60" x2="180" y2="96"></line><line x1="180" y1="186" x2="180" y2="214"></line></g><text x="192" y="68" font-size="11.5" class="f-quiet">+V</text><text x="192" y="212" font-size="11.5" class="f-quiet">0 V</text><g><rect x="80" y="106" width="200" height="70" fill-opacity="0.12" class="f-acc"></rect><rect x="80" y="96" width="200" height="10" rx="2" class="f-edge"></rect><rect x="80" y="176" width="200" height="10" rx="2" class="f-edge"></rect><g stroke-width="2" class="s-acc2"><line x1="95" y1="116" x2="105" y2="116"></line><line x1="100" y1="111" x2="100" y2="121"></line><line x1="95" y1="166" x2="105" y2="166"></line></g><g stroke-width="2" class="s-acc2"><line x1="125" y1="116" x2="135" y2="116"></line><line x1="130" y1="111" x2="130" y2="121"></line><line x1="125" y1="166" x2="135" y2="166"></line></g><g stroke-width="2" class="s-acc2"><line x1="155" y1="116" x2="165" y2="116"></line><line x1="160" y1="111" x2="160" y2="121"></line><line x1="155" y1="166" x2="165" y2="166"></line></g><g stroke-width="2" class="s-acc2"><line x1="185" y1="116" x2="195" y2="116"></line><line x1="190" y1="111" x2="190" y2="121"></line><line x1="185" y1="166" x2="195" y2="166"></line></g><g stroke-width="2" class="s-acc2"><line x1="215" y1="116" x2="225" y2="116"></line><line x1="220" y1="111" x2="220" y2="121"></line><line x1="215" y1="166" x2="225" y2="166"></line></g><g stroke-width="2" class="s-acc2"><line x1="245" y1="116" x2="255" y2="116"></line><line x1="250" y1="111" x2="250" y2="121"></line><line x1="245" y1="166" x2="255" y2="166"></line></g><text x="180" y="146" text-anchor="middle" font-size="11.5" class="f-ink">절연체(유전율 ε)</text><text x="72" y="104" text-anchor="end" font-size="11.5" class="f-quiet">면적 A</text></g><g><line x1="296" y1="108" x2="296" y2="174" stroke-width="1.25" marker-start="url(#u12-arrow)" marker-end="url(#u12-arrow)" class="s-edge"></line><text x="306" y="146" font-size="11.5" class="f-quiet">간격 d</text></g><text x="80" y="246" font-size="14" font-weight="600" class="f-ink">C = ε × A / d</text><text x="80" y="266" font-size="11.5" class="f-quiet">담기는 전하량 Q = C × V</text><g><rect x="400" y="76" width="336" height="52" rx="8" fill="none" stroke-width="1.25" class="s-edge"></rect><text x="414" y="98" font-weight="600" class="f-ink">면적 A를 키운다</text><text x="414" y="116" font-size="11.5" class="f-quiet">커패시터를 높게 세움 → D램의 원통형 구조</text></g><g><rect x="400" y="140" width="336" height="52" rx="8" fill="none" stroke-width="1.25" class="s-edge"></rect><text x="414" y="162" font-weight="600" class="f-ink">간격 d를 줄인다</text><text x="414" y="180" font-size="11.5" class="f-quiet">절연막을 얇게 → 터널링 누설전류 주의</text></g><g><rect x="400" y="204" width="336" height="52" rx="8" fill="none" stroke-width="1.25" class="s-edge"></rect><text x="414" y="226" font-weight="600" class="f-ink">유전율 ε를 키운다</text><text x="414" y="244" font-size="11.5" class="f-quiet">High-k 소재(ZrO₂, HfO₂)로 교체</text></g><g><rect x="24" y="290" width="712" height="52" rx="8" stroke-width="1.25" class="f-tint s-edge"></rect><text x="40" y="312" font-weight="600" class="f-ink">D램 셀: 전하가 차 있으면 1, 비어 있으면 0</text><text x="40" y="330" font-size="11.5" class="f-quiet">전하가 조금씩 새서 수십 ms마다(표준 64 ms) 다시 채웁니다 = 리프레시</text></g></svg>
