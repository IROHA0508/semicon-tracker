<svg xmlns="http://www.w3.org/2000/svg" width="760" height="302" viewBox="0 0 760 302" role="img" aria-label="플라즈마가 켜지는 네 단계: 전압 인가, 충돌과 이온화, 전자 눈사태와 2차 전자, 평형과 글로우" font-size="12" class="fig"><title>플라즈마가 켜지는 네 단계: 전압 인가, 충돌과 이온화, 전자 눈사태와 2차 전자, 평형과 글로우</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="u35p-ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-edge"></path></marker><marker id="u35p-aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-acc"></path></marker><marker id="u35p-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-acc2"></path></marker></defs><text x="24" y="26" font-size="15" font-weight="600" class="f-ink">플라즈마가 켜지는 순서: 전자 가속 → 충돌 → 눈사태 → 유지</text><rect x="24" y="44" width="172" height="212" fill="none" stroke-width="1" rx="10" class="s-edge"></rect><text x="34" y="64" font-size="12" font-weight="600" class="f-ink">① 전압 걸기</text><text x="34" y="230" font-size="11.5" class="f-quiet">몇 안 되는 자유전자가</text><text x="34" y="246" font-size="11.5" class="f-quiet">전기장으로 가속됨</text><line x1="197" y1="140" x2="203" y2="140" stroke-width="1.5" marker-end="url(#u35p-ae)" class="s-edge"></line><rect x="204" y="44" width="172" height="212" fill="none" stroke-width="1" rx="10" class="s-edge"></rect><text x="214" y="64" font-size="12" font-weight="600" class="f-ink">② 충돌</text><text x="214" y="230" font-size="11.5" class="f-quiet">중성 원자와 부딪혀 전자를</text><text x="214" y="246" font-size="11.5" class="f-quiet">떼어 냄(이온화)</text><line x1="377" y1="140" x2="383" y2="140" stroke-width="1.5" marker-end="url(#u35p-ae)" class="s-edge"></line><rect x="384" y="44" width="172" height="212" fill="none" stroke-width="1" rx="10" class="s-edge"></rect><text x="394" y="64" font-size="12" font-weight="600" class="f-ink">③ 눈사태</text><text x="394" y="230" font-size="11.5" class="f-quiet">전자가 불어나고, 양이온이</text><text x="394" y="246" font-size="11.5" class="f-quiet">음극을 때려 2차 전자 방출</text><line x1="557" y1="140" x2="563" y2="140" stroke-width="1.5" marker-end="url(#u35p-ae)" class="s-edge"></line><rect x="564" y="44" width="172" height="212" fill="none" stroke-width="1" rx="10" class="s-edge"></rect><text x="574" y="64" font-size="12" font-weight="600" class="f-ink">④ 유지(글로우)</text><text x="574" y="230" font-size="11.5" class="f-quiet">생기는 만큼 사라져 평형,</text><text x="574" y="246" font-size="11.5" class="f-quiet">들뜬 원자가 빛(글로우)을 냄</text><rect x="38" y="80" width="144" height="7" fill-opacity="0.7" class="f-ink"></rect><rect x="38" y="192" width="144" height="7" fill-opacity="0.7" class="f-ink"><