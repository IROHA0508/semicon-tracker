<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-label="칩 하나는 설계에서 출하까지 8단계를 거친다" font-size="13" class="fig"><title>칩 하나는 설계에서 출하까지 8단계를 거친다</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="u02-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-edge"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" class="f-ink">칩 하나는 설계에서 출하까지 8단계를 거치고, 가장 긴 구간은 전공정입니다</text><text x="24" y="54" font-size="11.5" class="f-quiet">윗줄은 회로를 새기는 앞단, 아랫줄은 칩을 골라 포장하는 뒷단</text><g fill="none" stroke-width="1.25" class="s-edge"><path d="M182 110H212" marker-end="url(#u02-arrow)"></path><path d="M364 110H394" marker-end="url(#u02-arrow)"></path><path d="M546 110H576" marker-end="url(#u02-arrow)"></path><path d="M653 140V184H107V218" marker-end="url(#u02-arrow)"></path><path d="M182 250H212" marker-end="url(#u02-arrow)"></path><path d="M364 250H394" marker-end="url(#u02-arrow)"></path><path d="M546 250H576" marker-end="url(#u02-arrow)"></path></g><g><rect x="32" y="80" width="150" height="60" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" class="s-edge"></rect><text x="107" y="106" text-anchor="middle" font-weight="600" class="f-ink">설계</text><text x="107" y="126" text-anchor="middle" font-size="11.5" class="f-quiet">회로를 짜고 배치도로</text></g><g><rect x="214" y="80" width="150" height="60" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" class="s-edge"></rect><text x="289" y="106" text-anchor="middle" font-weight="600" class="f-ink">포토마스크</text><text x="289" y="126" text-anchor="middle" font-size="11.5" class="f-quiet">층별 회로를 유리판에</text></g><g><rect x="396" y="80" width="150" height="60" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" class="s-edge"></rect><text x="471" y="106" text-anchor="middle" font-weight="600" class="f-ink">웨이퍼 제조</text><text x="471" y="126" text-anchor="middle" font-size="11.5" class="f-quiet">모래 → 잉곳 → 원판</text></g><g><rect x="578" y="80" width="150" height="60" rx="8" fill-opacity="0.12" stroke-width="2" class="f-acc s-acc"></rect><text x="653" y="106" text-anchor="middle" font-weight="600" class="f-ink">전공정(팹)</text><text x="653" y="126" text-anchor="middle" font-size="11.5" class="f-ink">층마다 수백 단계 반복</text></g><g><rect x="32" y="220" width="150" height="60" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" class="s-edge"></rect><text x="107" y="246" text-anchor="middle" font-weight="600" class="f-ink">EDS 테스트</text><text x="107" y="266" text-anchor="middle" font-size="11.5" class="f-quiet">웨이퍼 상태로 칩 선별</text></g><g><rect x="214" y="220" width="150" height="60" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" class="s-edge"></rect><text x="289" y="246" text-anchor="middle" font-weight="600" class="f-ink">패키징</text><text x="289" y="266" text-anchor="middle" font-size="11.5" class="f-quiet">자르고 잇고 감싸기</text></g><g><rect x="396" y="220" width="150" height="60" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" class="s-edge"></rect><text x="471" y="246" text-anchor="middle" font-weight="600" class="f-ink">최종 테스트</text><text x="471" y="266" text-anchor="middle" font-size="11.5" class="f-quiet">온도·속도별 등급 분류</text></g><g><rect x="578" y="220" width="150" height="60" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" class="s-edge"></rect><text x="653" y="246" text-anchor="middle" font-weight="600" class="f-ink">출하</text><text x="653" y="266" text-anchor="middle" font-size="11.5" class="f-quiet">고객사 납품</text></g><text x="24" y="314" font-size="11.5" class="f-quiet">팹 투입부터 팹 아웃까지 2~3개월, 공정 단계 800개 이상(그중 약 1/3이 세정)</text></svg>
