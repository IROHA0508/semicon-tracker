<svg xmlns="http://www.w3.org/2000/svg" width="760" height="336" viewBox="0 0 760 336" role="img" aria-label="NMOS 단면과 게이트 전압에 따른 채널 형성 3단계" font-size="13" class="fig"><title>NMOS 단면과 게이트 전압에 따른 채널 형성 3단계</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="u22-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-edge"></path></marker><marker id="u22-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-acc"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" class="f-ink">게이트 전압이 문턱을 넘으면 산화막 아래에 전자 통로가 생깁니다</text><g><rect x="40" y="150" width="384" height="170" stroke-width="1.25" class="f-tint s-edge"></rect><path d="M60 150V184Q60 200 76 200H134Q150 200 150 184V150Z" fill-opacity="0.18" stroke-width="2" class="f-acc s-acc"></path><path d="M314 150V184Q314 200 330 200H388Q404 200 404 184V150Z" fill-opacity="0.18" stroke-width="2" class="f-acc s-acc"></path><rect x="150" y="140" width="164" height="10" fill-opacity="0.3" stroke-width="1.25" class="f-acc2 s-acc2"></rect><rect x="150" y="90" width="164" height="50" fill="none" stroke-width="1.5" class="s-ink"></rect><rect x="150" y="151" width="164" height="7" fill-opacity="0.6" class="f-acc"></rect><path d="M105 150V76M232 90V76M359 150V76" fill="none" stroke-width="1.5" class="s-edge"></path><path d="M158 196H304" fill="none" stroke-width="1.75" marker-end="url(#u22-flow)" class="s-acc"></path><text x="105" y="68" text-anchor="middle" font-weight="600" class="f-ink">소스(S)</text><text x="232" y="68" text-anchor="middle" font-weight="600" class="f-ink">게이트(G)</text><text x="359" y="68" text-anchor="middle" font-weight="600" class="f-ink">드레인(D)</text><text x="232" y="112" text-anchor="middle" font-weight="600" class="f-ink">게이트 전극</text><text x="232" y="130" text-anchor="middle" font-size="11.5" class="f-quiet">바로 아래 얇은 층 = 산화막</text><text x="105" y="180" text-anchor="middle" font-weight="600" class="f-ink">N⁺</text><text x="359" y="180" text-anchor="middle" font-weight="600" class="f-ink">N⁺</text><text x="232" y="178" text-anchor="middle" font-size="11.5" class="f-quiet">채널(반전층)</text><text x="232" y="218" text-anchor="middle" font-size="11.5" class="f-quiet">전자 흐름: 소스 → 드레인</text><text x="232" y="284" text-anchor="middle" class="f-quiet">P형 기판(바디)</text></g><g><path d="M603 128V148" fill="none" stroke-width="1.25" marker-end="url(#u22-arrow)" class="s-edge"></path><path d="M603 214V234" fill="none" stroke-width="1.25" marker-end="url(#u22-arrow)" class="s-edge"></path><rect x="470" y="64" width="266" height="64" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" class="s-edge"></rect><rect x="470" y="150" width="266" height="64" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" class="s-edge"></rect><rect x="470" y="236" width="266" height="64" rx="8" fill-opacity="0.12" stroke-width="2" class="f-acc s-acc"></rect><text x="486" y="90" font-weight="600" class="f-ink">① Vg = 0 · 꺼짐</text><text x="486" y="110" font-size="11.5" class="f-quiet">S–기판–D의 PN 접합 두 개가 막음</text><text x="486" y="176" font-weight="600" class="f-ink">② 0 &lt; Vg &lt; Vth · 공핍</text><text x="486" y="196" font-size="11.5" class="f-quiet">+ 전압이 정공을 밀어내 빈 층이 생김</text><text x="486" y="262" font-weight="600" class="f-ink">③ Vg ≥ Vth · 켜짐</text><text x="486" y="282" font-size="11.5" class="f-quiet">전자가 모여 N형 통로(채널)가 생김</text></g></svg>
