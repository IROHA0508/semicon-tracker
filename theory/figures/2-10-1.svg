<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-label="D램 읽기 명령 순서와 타이밍, 감지 증폭기의 전하 공유와 증폭, 셀 리텐션 분포와 리프레시 주기" font-size="13" class="fig"><title>D램 읽기 명령 순서와 타이밍, 감지 증폭기의 전하 공유와 증폭, 셀 리텐션 분포와 리프레시 주기</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="u210-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-edge"></path></marker></defs><text x="24" y="26" font-size="15" font-weight="600" class="f-ink">D램 읽기 한 번: 행을 열고(ACT), 감지 증폭기로 키우고, 읽고, 닫습니다(PRE)</text><g><text x="24" y="50" font-weight="600" class="f-ink">① 명령 순서와 타이밍(같은 뱅크)</text><rect x="40" y="60" width="84" height="26" rx="5" fill-opacity="0.14" stroke-width="1.5" class="f-acc s-acc"></rect><rect x="250" y="60" width="84" height="26" rx="5" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="380" y="60" width="120" height="26" rx="5" fill-opacity="0.16" stroke-width="1.5" class="f-acc2 s-acc2"></rect><rect x="540" y="60" width="84" height="26" rx="5" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="680" y="60" width="56" height="26" rx="5" fill="none" stroke-width="1.25" stroke-dasharray="4 3" class="s-edge"></rect><text x="82" y="78" text-anchor="middle" font-size="12" font-weight="600" class="f-ink">ACT · 행 열기</text><text x="292" y="78" text-anchor="middle" font-size="12" font-weight="600" class="f-ink">RD · 읽기</text><text x="440" y="78" text-anchor="middle" font-size="12" font-weight="600" class="f-ink">데이터 버스트 출력</text><text x="582" y="78" text-anchor="middle" font-size="12" font-weight="600" class="f-ink">PRE · 행 닫기</text><text x="708" y="78" text-anchor="middle" font-size="11.5" class="f-quiet">다음 ACT</text><path d="M42 108H248" fill="none" stroke-width="1.25" marker-start="url(#u210-arrow)" marker-end="url(#u210-arrow)" class="s-edge"></path><path d="M252 108H378" fill="none" stroke-width="1.25" marker-start="url(#u210-arrow)" marker-end="url(#u210-arrow)" class="s-edge"></path><path d="M42 130H538" fill="none" stroke-width="1.25" marker-start="url(#u210-arrow)" marker-end="url(#u210-arrow)" class="s-edge"></path><path d="M542 130H678" fill="none" stroke-width="1.25" marker-start="url(#u210-arrow)" marker-end="url(#u210-arrow)" class="s-edge"></path><path d="M42 152H678" fill="none" stroke-width="1.25" marker-start="url(#u210-arrow)" marker-end="url(#u210-arrow)" class="s-edge"></path><text x="145" y="103" text-anchor="middle" font-size="11.5" class="f-ink">tRCD</text><text x="315" y="103" text-anchor="middle" font-size="11.5" class="f-ink">CL</text><text x="290" y="125" text-anchor="middle" font-size="11.5" class="f-ink">tRAS(행을 열어 두는 최소 시간)</text><text x="610" y="125" text-anchor="middle" font-size="11.5" class="f-ink">tRP</text><text x="360" y="147" text-anchor="middle" font-size="11.5" class="f-ink">tRC = tRAS + tRP</text><text x="24" y="176" font-size="11.5" class="f-quiet">tRCD·CL·tRP는 각각 십수 ns, tRC는 50 ns 안팎(DDR4·DDR5 대표값). 이 숫자들이 속도 등급을 가릅니다</text></g><g><text x="24" y="208" font-weight="600" class="f-ink">② 전하 공유와 감지 증폭</text><path d="M70 330H360" fill="none" stroke-width="1.25" marker-end="url(#u210-arrow)" class="s-edge"></path><path d="M70 330V226" fill="none" stroke-width="1.25" class="s-edge"></path><path d="M70 232H352M70 326H352" fill="none" stroke-width="1" stroke-dasharray="3 3" class="s-grid"></path><path d="M140 226V330M200 226V330" fill="none" stroke-width="1" stroke-dasharray="2 3" class="s-grid"></path><path d="M70 279H140L150 268H200C215 268 222 236 240 233H350" fill="none" stroke-width="2.25" class="s-acc"></path><path d="M70 281H200C215 281 222 322 240 325H350" fill="none" stroke-width="2.25" stroke-dasharray="6 3" class="s-acc2"></path><text x="64" y="236" text-anchor="end" font-size="11.5" class="f-quiet">VDD</text><text x="64" y="284" text-anchor="end" font-size="11.5" class="f-quiet">VDD/2</text><text x="64" y="330" text-anchor="end" font-size="11.5" class="f-quiet">0</text><text x="140" y="222" text-anchor="middle" font-size="11.5" class="f-ink">WL 켜짐</text><text x="206" y="222" text-anchor="middle" font-size="11.5" class="f-ink">SA 켜짐</text><text x="160" y="262" font-size="11.5" class="f-ink">ΔV</text><text x="262" y="226" font-size="11.5" class="f-ink">셀 쪽 BL → VDD(1)</text><text x="262" y="318" font-size="11.5" class="f-ink">기준 BL → 0</text><text x="24" y="354" font-size="12" class="f-ink">ΔV ≈ (V셀 − VDD/2) × Cs ÷ (Cs + Cb)</text><text x="24" y="372" font-size="11.5" class="f-quiet">ΔV는 보통 100 mV 안팎(Cs 셀 용량, Cb 비트라인 용량)</text><text x="24" y="390" font-size="11.5" class="f-quiet">Cs가 줄거나 Cb가 늘면 ΔV가 줄어 감지 실패</text></g><g><text x="400" y="208" font-weight="600" class="f-ink">③ 리텐션 분포와 리프레시 주기</text><path d="M410 326H732" fill="none" stroke-width="1.25" marker-end="url(#u210-arrow)" class="s-edge"></path><path d="M428 326C460 325 490 320 520 312C560 300 585 236 620 232C650 236 668 300 690 318C705 324 716 326 728 326" fill-opacity="0.12" stroke-width="2" class="f-acc s-acc"></path><path d="M428 326C460 325 490 320 520 312V326Z" fill-opacity="0.6" class="f-acc2"></path><path d="M520 222V330" fill="none" stroke-width="1.75" stroke-dasharray="5 3" class="s-acc2"></path><text x="514" y="236" text-anchor="end" font-size="11.5" class="f-ink">리프레시 주기</text><text x="514" y="252" text-anchor="end" font-size="11.5" class="f-quiet">(DDR5 32 ms)</text><text x="470" y="300" text-anchor="middle" font-size="11.5" class="f-ink">약한 셀(꼬리)</text><text x="732" y="344" text-anchor="end" font-size="11.5" class="f-quiet">데이터 보존 시간(로그 눈금) →</text><text x="400" y="362" font-size="11.5" class="f-ink">봉우리: 대부분의 셀은 주기보다 훨씬 오래 버팀</text><text x="400" y="378" font-size="11.5" class="f-ink">꼬리: 주기 안에 데이터를 잃는 약한 셀 → 리페어</text><text x="400" y="394" font-size="11.5" class="f-quiet">고온일수록 분포가 왼쪽으로 → 리프레시를 더 자주</text></g></svg>
