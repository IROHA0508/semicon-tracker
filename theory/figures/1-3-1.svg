<svg xmlns="http://www.w3.org/2000/svg" width="760" height="372" viewBox="0 0 760 372" role="img" aria-label="밴드갭의 크기가 도체 반도체 절연체를 가른다" font-size="13" class="fig"><title>밴드갭의 크기가 도체 반도체 절연체를 가른다</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="u13-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-edge"></path></marker><marker id="u13-up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-acc2"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" class="f-ink">밴드갭(두 띠 사이 틈)의 크기가 도체·반도체·절연체를 가릅니다</text><g><line x1="44" y1="290" x2="44" y2="70" stroke-width="1.25" marker-end="url(#u13-arrow)" class="s-edge"></line><text x="54" y="66" font-size="11.5" class="f-quiet">전자 에너지</text></g><g><rect x="70" y="80" width="160" height="46" rx="4" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="70" y="232" width="160" height="50" rx="4" fill-opacity="0.22" stroke-width="1.25" class="f-acc s-edge"></rect><text x="150" y="108" text-anchor="middle" font-size="11.5" class="f-quiet">전도대(비어 있음)</text><text x="150" y="261" text-anchor="middle" font-size="11.5" class="f-ink">가전자대(꽉 참)</text><line x1="150" y1="130" x2="150" y2="228" stroke-width="1.25" stroke-dasharray="4 4" marker-start="url(#u13-arrow)" marker-end="url(#u13-arrow)" class="s-edge"></line><text x="160" y="184" font-size="11.5" class="f-quiet">큰 틈</text></g><g><rect x="300" y="150" width="160" height="46" rx="4" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="300" y="232" width="160" height="50" rx="4" fill-opacity="0.22" stroke-width="1.25" class="f-acc s-edge"></rect><circle cx="326" cy="164" r="5" class="f-acc2"></circle><circle cx="366" cy="164" r="5" class="f-acc2"></circle><circle cx="420" cy="164" r="5" class="f-acc2"></circle><circle cx="346" cy="244" r="5" fill="none" stroke-width="1.5" class="s-acc2"></circle><circle cx="404" cy="244" r="5" fill="none" stroke-width="1.5" class="s-acc2"></circle><line x1="310" y1="228" x2="310" y2="200" stroke-width="1.5" marker-end="url(#u13-up)" class="s-acc2"></line><text x="380" y="186" text-anchor="middle" font-size="11.5" class="f-quiet">전도대</text><text x="380" y="268" text-anchor="middle" font-size="11.5" class="f-ink">가전자대</text><text x="468" y="168" font-size="11.5" class="f-ink">전자</text><text x="468" y="248" font-size="11.5" class="f-ink">정공</text></g><g><rect x="560" y="150" width="160" height="70" rx="4" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="560" y="196" width="160" height="86" rx="4" fill-opacity="0.22" stroke-width="1.25" class="f-acc s-edge"></rect><text x="640" y="172" text-anchor="middle" font-size="11.5" class="f-quiet">전도대</text><text x="640" y="256" text-anchor="middle" font-size="11.5" class="f-ink">가전자대</text><text x="640" y="212" text-anchor="middle" font-size="11.5" class="f-ink">겹쳐 있음</text></g><text x="150" y="310" text-anchor="middle" font-size="14" font-weight="600" class="f-ink">절연체</text><text x="380" y="310" text-anchor="middle" font-size="14" font-weight="600" class="f-ink">반도체</text><text x="640" y="310" text-anchor="middle" font-size="14" font-weight="600" class="f-ink">도체</text><text x="150" y="330" text-anchor="middle" font-size="11.5" class="f-quiet">SiO₂ 약 9 eV</text><text x="380" y="330" text-anchor="middle" font-size="11.5" class="f-quiet">Si 약 1.12 eV, 열·빛으로 넘음</text><text x="640" y="330" text-anchor="middle" font-size="11.5" class="f-quiet">틈 없음, 늘 전류가 흐름</text><text x="24" y="360" font-size="11.5" class="f-quiet">채운 띠 = 전자가 꽉 찬 가전자대 · 채운 점 = 올라간 전자 · 빈 점 = 전자가 떠난 자리(정공) · 그림은 눈금에 비례하지 않음</text></svg>
