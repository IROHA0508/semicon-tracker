<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-label="메모리, 파운드리, 팹리스의 매출 식과 핵심 지표, 강점, 위험, 설비 투자 부담 비교" font-size="13" class="fig"><title>메모리, 파운드리, 팹리스의 매출 식과 핵심 지표, 강점, 위험, 설비 투자 부담 비교</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><text x="24" y="26" font-size="15" font-weight="600" class="f-ink">무엇을 팔고 무엇이 매출을 움직이는지가 다릅니다</text><rect x="24" y="44" width="228" height="236" rx="10" fill="none" stroke-width="1.25" class="s-edge"></rect><rect x="266" y="44" width="228" height="236" rx="10" fill="none" stroke-width="1.25" class="s-edge"></rect><rect x="508" y="44" width="228" height="236" rx="10" fill="none" stroke-width="1.25" class="s-edge"></rect><rect x="36" y="84" width="204" height="44" rx="8" fill-opacity="0.14" class="f-acc"></rect><rect x="278" y="84" width="204" height="44" rx="8" fill-opacity="0.14" class="f-acc2"></rect><rect x="520" y="84" width="204" height="44" rx="8" fill-opacity="1" class="f-tint"></rect><text x="138" y="70" text-anchor="middle" font-weight="600" class="f-ink">메모리</text><text x="380" y="70" text-anchor="middle" font-weight="600" class="f-ink">파운드리</text><text x="622" y="70" text-anchor="middle" font-weight="600" class="f-ink">팹리스</text><text x="138" y="111" text-anchor="middle" font-size="12.5" font-weight="600" class="f-ink">매출 = 비트 × 가격(ASP)</text><text x="380" y="111" text-anchor="middle" font-size="12.5" font-weight="600" class="f-ink">매출 = 웨이퍼 × 공정별 가격</text><text x="622" y="111" text-anchor="middle" font-size="12.5" font-weight="600" class="f-ink">매출 = 판매량 × 가격</text><text x="36" y="156" font-size="11.5" class="f-ink">볼 것: 고정거래가, 재고, 비트 성장</text><text x="36" y="180" font-size="11.5" class="f-ink">강점: 원가·기술 선점(HBM)</text><text x="36" y="204" font-size="11.5" class="f-ink">위험: 가격 사이클</text><text x="278" y="156" font-size="11.5" class="f-ink">볼 것: 가동률, 최선단 비중, 수주</text><text x="278" y="180" font-size="11.5" class="f-ink">강점: 최선단 수율·고객 신뢰</text><text x="278" y="204" font-size="11.5" class="f-ink">위험: 수율, 고객 이탈, 가동률</text><text x="520" y="156" font-size="11.5" class="f-ink">볼 것: 신제품, 데이터센터 매출</text><text x="520" y="180" font-size="11.5" class="f-ink">강점: 설계·소프트웨어 생태계</text><text x="520" y="204" font-size="11.5" class="f-ink">위험: 생산 능력(파운드리) 의존</text><text x="36" y="250" font-size="11.5" class="f-quiet">설비 투자</text><text x="278" y="250" font-size="11.5" class="f-quiet">설비 투자</text><text x="520" y="250" font-size="11.5" class="f-quiet">설비 투자(대신 R&amp;D 큼)</text><rect x="100" y="239" width="14" height="14" rx="2" fill-opacity="0.75" class="f-acc"></rect><rect x="118" y="239" width="14" height="14" rx="2" fill-opacity="0.75" class="f-acc"></rect><rect x="136" y="239" width="14" height="14" rx="2" fill-opacity="0.75" class="f-acc"></rect><rect x="342" y="239" width="14" height="14" rx="2" fill-opacity="0.75" class="f-acc2"></rect><rect x="360" y="239" width="14" height="14" rx="2" fill-opacity="0.75" class="f-acc2"></rect><rect x="378" y="239" width="14" height="14" rx="2" fill-opacity="0.75" class="f-acc2"></rect><rect x="668" y="239" width="14" height="14" rx="2" fill-opacity="0.75" class="f-edge"></rect><rect x="686" y="239" width="14" height="14" rx="2" fill="none" stroke-width="1" class="s-edge"></rect><rect x="704" y="239" width="14" height="14" rx="2" fill="none" stroke-width="1" class="s-edge"></rect></svg>
