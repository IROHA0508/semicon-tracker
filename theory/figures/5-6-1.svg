rect x="70" y="304" width="12" height="12" fill-opacity="0.55" class="f-acc"></rect><text x="88" y="314" font-size="11.5" class="f-ink">매출</text><rect x="130" y="304" width="12" height="12" fill-opacity="0.8" class="f-acc2"></rect><text x="148" y="314" font-size="11.5" class="f-ink">영업이익</text><text x="24" y="340" font-size="11.5" class="f-quiet">2026년 2Q 매출: 전분기 대비 +51%, 전년 동기 대비 +257%</text></g><g><text x="440" y="52" font-weight="600" class="f-ink">② 뉴스 숫자 읽기 5단계</text><rect x="440" y="64" width="296" height="40" rx="8" stroke-width="1" class="f-tint s-edge"></rect><rect x="440" y="112" width="296" height="40" rx="8" stroke-width="1" class="f-tint s-edge"></rect><rect x="440" y="160" width="296" height="40" rx="8" stroke-width="1" class="f-tint s-edge"></rect><rect x="440" y="208" width="296" height="40" rx="8" stroke-width="1" class="f-tint s-edge"></rect><rect x="440" y="256" width="296" height="40" rx="8" stroke-width="1" class="f-tint s-edge"></rect><text x="452" y="81" font-size="12" font-weight="600" class="f-ink">① 무엇의 숫자? </text><text x="452" y="97" font-size="11.5" class="f-quiet">매출·영업이익·순이익, 연결·별도</text><text x="452" y="129" font-size="12" font-weight="600" class="f-ink">② 언제·어느 기간?</text><text x="452" y="145" font-size="11.5" class="f-quiet">분기·누적, 잠정·확정</text><text x="452" y="177" font-size="12" font-weight="600" class="f-ink">③ 무엇과 비교?</text><text x="452" y="193" font-size="11.5" class="f-quiet">전분기(QoQ)·전년 동기(YoY)·시장 기대치</text><text x="452" y="225" font-size="12" font-weight="600" class="f-ink">④ 단위는?</text><text x="452" y="241" font-size="11.5" class="f-quiet">조 원·달러·%와 %p, 환율</text><text x="452" y="273" font-size="12" font-weight="600" class="f-ink">⑤ 왜 변했나?</text><text x="452" y="289" font-size="11.5" class="f-quiet">가격 × 물량 × 제품 구성 × 환율로 나눠 보기</text><text x="440" y="322" font-size="11.5" class="f-quiet">예: 역대 최대 실적이어도 기대치를 밑돌면</text><text x="440" y="340" font-size="11.5" class="f-quiet">주가는 내릴 수 있습니다(2026년 2분기 보도)</text></g></svg>
