<svg xmlns="http://www.w3.org/2000/svg" width="760" height="512" viewBox="0 0 760 512" role="img" aria-label="TSV를 만드는 여섯 단계: 구멍 식각, 절연막과 씨드, 구리 도금, 평탄화와 배선, 뒷면 연마, 범프와 적층" font-size="12" class="fig"><title>TSV를 만드는 여섯 단계: 구멍 식각, 절연막과 씨드, 구리 도금, 평탄화와 배선, 뒷면 연마, 범프와 적층</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="u45t-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ink"></path></marker></defs><text x="24" y="26" font-size="15" font-weight="600" class="f-ink">TSV 만드는 순서(비아 미들): 뚫고 막고 채우고 갈아서 드러냅니다</text><rect x="24" y="44" width="224" height="210" fill="none" stroke-width="1" rx="10" class="s-edge"></rect><text x="36" y="64" font-size="12.5" font-weight="600" class="f-ink">① 깊은 구멍 식각</text><text x="36" y="230" font-size="11.5" class="f-quiet">트랜지스터를 만든 뒤</text><text x="36" y="246" font-size="11.5" class="f-quiet">깊고 좁은 구멍(보쉬 식각)</text><rect x="268" y="44" width="224" height="210" fill="none" stroke-width="1" rx="10" class="s-edge"></rect><text x="280" y="64" font-size="12.5" font-weight="600" class="f-ink">② 절연막·배리어·씨드</text><text x="280" y="230" font-size="11.5" class="f-quiet">구멍 벽에 절연막·배리어·</text><text x="280" y="246" font-size="11.5" class="f-quiet">씨드층을 얇게 입힘</text><rect x="512" y="44" width="224" height="210" fill="none" stroke-width="1" rx="10" class="s-edge"></rect><text x="524" y="64" font-size="12.5" font-weight="600" class="f-ink">③ 구리 도금</text><text x="524" y="230" font-size="11.5" class="f-quiet">전해 도금으로</text><text x="524" y="246" font-size="11.5" class="f-quiet">구멍을 구리로 채움</text><rect x="24" y="266" width="224" height="210" fill="none" stroke-width="1" rx="10" class="s-edge"></rect><text x="36" y="286" font-size="12.5" font-weight="600" class="f-ink">④ 평탄화·배선</text><text x="36" y="452" font-size="11.5" class="f-quiet">윗면 구리를 CMP로 갈아내고</text><text x="36" y="468" font-size="11.5" class="f-quiet">그 위에 배선층을 쌓음</text><rect x="268" y="266" width="224" height="210" fill="none" stroke-width="1" rx="10" class="s-edge"></rect><text x="280" y="286" font-size="12.5" font-weight="600" class="f-ink">⑤ 뒷면 갈기</text><text x="280" y="452" font-size="11.5" class="f-quiet">뒷면을 갈아 얇게 하고</text><text x="280" y="468" font-size="11.5" class="f-quiet">TSV 끝을 드러냄</text><rect x="512" y="266" width="224" height="210" fill="none" stroke-width="1" rx="10" class="s-edge"></rect><text x="524" y="286" font-size="12.5" font-weight="600" class="f-ink">⑥ 범프 달고 쌓기</text><text x="524" y="452" font-size="11.5" class="f-quiet">앞뒤에 범프를 달아</text><text x="524" y="468" font-size="11.5" class="f-quiet">칩을 쌓고 위아래 연결</text><path d="M54 104 H128 V172 H144 V104 H218 V190 H54 Z" stroke-width="1" class="f-tint s-edge"></path><rect x="54" y="104" width="74" height="8" fill-opacity="0.3" class="f-acc"></rect><rect x="144" y="104" width="74" height="8" fill-opacity="0.3" class="f-acc"></rect><text x="64" y="158" font-size="11.5" class="f-quiet">실리콘</text><text x="64" y="98" font-size="11.5" class="f-quiet">트랜지스터층</text><rect x="298" y="104" width="164" height="86" stroke-width="1" class="f-tint s-edge"></rect><rect x="298" y="104" width="74" height="8" fill-opacity="0.3" class="f-acc"></rect><rect x="388" y="104" width="74" height="8" fill-opacity="0.3" class="f-acc"></rect><rect x="372" y="104" width="16" height="68" fill="none"></rect><path d="M373 104 V170 H386 V104" fill="none" stroke-width="2.5" class="s-acc2"></path><rect x="542" y="104" width="164" height="86" stroke-width="1" class="f-tint s-edge"></rect><rect x="542" y="104" width="74" height="8" fill-opacity="0.3" class="f-acc"></rect><rect x="632" y="104" width="74" height="8" fill-opacity="0.3" class="f-acc"></rect><rect x="616" y="104" width="16" height="68" fill-opacity="0.7" stroke-width="1" class="f-acc2 s-acc2"></rect><rect x="542" y="98" width="164" height="6" fill-opacity="0.7" class="f-acc2"></rect><rect x="54" y="326" width="164" height="86" stroke-width="1" class="f-tint s-edge"></rect><rect x="54" y="326" width="74" height="8" fill-opacity="0.3" class="f-acc"></rect><rect x="144" y="326" width="74" height="8" fill-opacity="0.3" class="f-acc"></rect><rect x="128" y="326" width="16" height="68" fill-opacity="0.7" stroke-width="1" class="f-acc2 s-acc2"></rect><rect x="54" y="312" width="164" height="14" fill-opacity="0.2" stroke-width="1" class="f-edge s-edge"></rect><rect x="298" y="326" width="164" height="76" stroke-width="1" class="f-tint s-edge"></rect><rect x="298" y="326" width="74" height="8" fill-opacity="0.3" class="f-acc"></rect><rect x="388" y="326" width="74" height="8" fill-opacity="0.3" class="f-acc"></rect><rect x="372" y="326" width="16" height="80" fill-opacity="0.7" stroke-width="1" class="f-acc2 s-acc2"></rect><rect x="298" y="312" width="164" height="14" fill-opacity="0.2" stroke-width="1" class="f-edge s-edge"></rect><line x1="328" y1="428" x2="328" y2="408" stroke-width="1.5" marker-end="url(#u45t-ai)" class="s-ink"></line><text x="338" y="426" font-size="11.5" font-weight="600" class="f-ink">갈기</text><rect x="542" y="326" width="164" height="76" stroke-width="1" class="f-tint s-edge"></rect><rect x="542" y="326" width="74" height="8" fill-opacity="0.3" class="f-acc"></rect><rect x="632" y="326" width="74" height="8" fill-opacity="0.3" class="f-acc"></rect><rect x="616" y="326" width="16" height="80" fill-opacity="0.7" stroke-width="1" class="f-acc2 s-acc2"></rect><rect x="542" y="312" width="164" height="14" fill-opacity="0.2" stroke-width="1" class="f-edge s-edge"></rect><circle cx="624" cy="306" r="6" fill-opacity="0.6" class="f-ink"></circle><circle cx="624" cy="412" r="6" fill-opacity="0.6" class="f-ink"></circle><rect x="542" y="408" width="164" height="0.1" fill="none"></rect><text x="24" y="500" font-size="11.5" class="f-quiet">TSV 지름은 수 μm, 깊이는 수십 μm이고 HBM은 D램 칩 하나에 TSV를 수천 개 뚫어 위아래 칩을 바로 잇습니다.</text></svg>
