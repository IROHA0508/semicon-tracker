<svg xmlns="http://www.w3.org/2000/svg" width="760" height="356" viewBox="0 0 760 356" role="img" aria-label="트랜지스터 구조 진화(평면, FinFET, GAA, CFET)와 앞면 전력 대비 후면 전력 공급 단면" font-size="13" class="fig"><title>트랜지스터 구조 진화(평면, FinFET, GAA, CFET)와 앞면 전력 대비 후면 전력 공급 단면</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="u41-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-edge"></path></marker></defs><text x="24" y="26" font-size="15" font-weight="600" class="f-ink">구조를 바꿔 미세화합니다: 트랜지스터는 입체로, 전원은 뒷면으로</text><g><text x="24" y="52" font-weight="600" class="f-ink">① 트랜지스터 구조의 진화</text><rect x="28" y="160" width="84" height="36" stroke-width="1" class="f-tint s-edge"></rect><rect x="50" y="160" width="40" height="4" fill-opacity="0.7" class="f-acc"></rect><rect x="52" y="130" width="36" height="26" fill-opacity="0.35" stroke-width="1" class="f-edge s-edge"></rect><rect x="52" y="156" width="36" height="4" class="f-edge"></rect><rect x="128" y="170" width="84" height="26" stroke-width="1" class="f-tint s-edge"></rect><rect x="162" y="120" width="16" height="50" fill-opacity="0.5" class="f-acc"></rect><path d="M148 170V108H192V170H184V116H156V170Z" fill-opacity="0.35" stroke-width="1" class="f-edge s-edge"></path><rect x="228" y="170" width="84" height="26" stroke-width="1" class="f-tint s-edge"></rect><rect x="240" y="106" width="60" height="64" fill-opacity="0.35" stroke-width="1" class="f-edge s-edge"></rect><rect x="250" y="118" width="40" height="9" fill-opacity="0.65" class="f-acc"></rect><rect x="250" y="134" width="40" height="9" fill-opacity="0.65" class="f-acc"></rect><rect x="250" y="150" width="40" height="9" fill-opacity="0.65" class="f-acc"></rect><rect x="328" y="170" width="84" height="26" stroke-width="1" class="f-tint s-edge"></rect><rect x="340" y="96" width="60" height="74" fill-opacity="0.35" stroke-width="1" class="f-edge s-edge"></rect><rect x="350" y="106" width="40" height="7" fill-opacity="0.75" class="f-acc2"></rect><rect x="350" y="119" width="40" height="7" fill-opacity="0.75" class="f-acc2"></rect><rect x="350" y="142" width="40" height="7" fill-opacity="0.7" class="f-acc"></rect><rect x="350" y="155" width="40" height="7" fill-opacity="0.7" class="f-acc"></rect><text x="404" y="120" font-size="11.5" class="f-ink">P</text><text x="404" y="157" font-size="11.5" class="f-ink">N</text><text x="70" y="216" text-anchor="middle" font-size="12" font-weight="600" class="f-ink">평면</text><text x="170" y="216" text-anchor="middle" font-size="12" font-weight="600" class="f-ink">FinFET</text><text x="270" y="216" text-anchor="middle" font-size="12" font-weight="600" class="f-ink">GAA(나노시트)</text><text x="370" y="216" text-anchor="middle" font-size="12" font-weight="600" class="f-ink">CFET</text><text x="70" y="234" text-anchor="middle" font-size="11.5" class="f-quiet">~20nm대</text><text x="170" y="234" text-anchor="middle" font-size="11.5" class="f-quiet">22nm~3nm대</text><text x="270" y="234" text-anchor="middle" font-size="11.5" class="f-quiet">3·2nm대~</text><text x="370" y="234" text-anchor="middle" font-size="11.5" class="f-quiet">연구 단계</text><text x="24" y="272" font-size="12" class="f-ink">게이트가 채널을 감싸는 면: 1면 → 3면 → 4면 → 4면+위아래 적층</text><text x="24" y="292" font-size="12" class="f-ink">많이 감쌀수록 누설↓ → 짧은 게이트에서도 스위치가 확실히 꺼짐</text><text x="24" y="320" font-size="11.5" class="f-quiet">공정 이름의 nm는 실제 치수가 아니라 세대 이름입니다</text><text x="24" y="338" font-size="11.5" class="f-quiet">TSMC A16·Intel 18A의 A는 옹스트롬(0.1 nm) 단위</text></g><g><text x="446" y="52" font-weight="600" class="f-ink">② 전원을 뒷면으로(BSPDN)</text><text x="515" y="76" text-anchor="middle" font-size="12" class="f-ink">기존: 앞면 전력</text><text x="671" y="76" text-anchor="middle" font-size="12" class="f-ink">후면 전력 공급</text><path d="M515 82V100" fill="none" stroke-width="2" marker-end="url(#u41-arrow)" class="s-acc2"></path><text x="523" y="96" font-size="11.5" class="f-quiet">전원</text><rect x="452" y="106" width="126" height="5" fill-opacity="0.75" class="f-acc2"></rect><rect x="452" y="134" width="126" height="5" fill-opacity="0.75" class="f-acc2"></rect><rect x="452" y="162" width="126" height="5" fill-opacity="0.75" class="f-acc2"></rect><rect x="452" y="190" width="126" height="5" fill-opacity="0.75" class="f-acc2"></rect><rect x="452" y="120" width="126" height="2.5" fill-opacity="0.55" class="f-ink"></rect><rect x="452" y="148" width="126" height="2.5" fill-opacity="0.55" class="f-ink"></rect><rect x="452" y="176" width="126" height="2.5" fill-opacity="0.55" class="f-ink"></rect><rect x="452" y="198" width="126" height="14" fill-opacity="0.45" class="f-acc"></rect><rect x="452" y="212" width="126" height="76" stroke-width="1" class="f-tint s-edge"></rect><text x="515" y="209" text-anchor="middle" font-size="11.5" class="f-ink">트랜지스터</text><text x="515" y="256" text-anchor="middle" font-size="11.5" class="f-quiet">실리콘 기판</text><rect x="608" y="134" width="126" height="2.5" fill-opacity="0.55" class="f-ink"></rect><rect x="608" y="154" width="126" height="2.5" fill-opacity="0.55" class="f-ink"></rect><rect x="608" y="174" width="126" height="2.5" fill-opacity="0.55" class="f-ink"></rect><rect x="608" y="192" width="126" height="2.5" fill-opacity="0.55" class="f-ink"></rect><rect x="608" y="198" width="126" height="14" fill-opacity="0.45" class="f-acc"></rect><rect x="608" y="212" width="126" height="10" stroke-width="1" class="f-tint s-edge"></rect><rect x="608" y="234" width="126" height="6" fill-opacity="0.75" class="f-acc2"></rect><rect x="608" y="252" width="126" height="6" fill-opacity="0.75" class="f-acc2"></rect><rect x="608" y="270" width="126" height="6" fill-opacity="0.75" class="f-acc2"></rect><text x="671" y="209" text-anchor="middle" font-size="11.5" class="f-ink">트랜지스터</text><text x="671" y="122" text-anchor="middle" font-size="11.5" class="f-quiet">앞면: 신호 배선만</text><path d="M671 306V288" fill="none" stroke-width="2" marker-end="url(#u41-arrow)" class="s-acc2"></path><text x="679" y="304" font-size="11.5" class="f-quiet">전원</text><text x="515" y="324" text-anchor="middle" font-size="11.5" class="f-ink">전원·신호가 한데 섞임</text><text x="515" y="342" text-anchor="middle" font-size="11.5" class="f-quiet">전압 강하·배선 혼잡</text><text x="671" y="324" text-anchor="middle" font-size="11.5" class="f-ink">뒷면에서 바로 전원</text><text x="671" y="342" text-anchor="middle" font-size="11.5" class="f-quiet">전압 강하↓·면적↓</text></g></svg>
