<svg xmlns="http://www.w3.org/2000/svg" width="760" height="384" viewBox="0 0 760 384" role="img" aria-label="오염원 5가지와 대응 세정액, RCA 세정 순서, 친수성과 소수성 표면" font-size="13" class="fig"><title>오염원 5가지와 대응 세정액, RCA 세정 순서, 친수성과 소수성 표면</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="u32-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-edge"></path></marker></defs><text x="24" y="26" font-size="15" font-weight="600" class="f-ink">오염원마다 맞는 약액이 따로 있어, 여러 약액을 순서대로 씁니다</text><text x="24" y="48" font-size="12" font-weight="600" class="f-quiet">오염원</text><text x="290" y="48" font-size="12" font-weight="600" class="f-quiet">주로 쓰는 세정</text><text x="510" y="48" font-size="12" font-weight="600" class="f-quiet">RCA 세정 순서(예)</text><g><g><rect x="24" y="56" width="176" height="38" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="290" y="56" width="190" height="38" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><path d="M202 75H286" fill="none" stroke-width="1.25" marker-end="url(#u32-arrow)" class="s-edge"></path></g><g><rect x="24" y="102" width="176" height="38" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="290" y="102" width="190" height="38" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><path d="M202 121H286" fill="none" stroke-width="1.25" marker-end="url(#u32-arrow)" class="s-edge"></path></g><g><rect x="24" y="148" width="176" height="38" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="290" y="148" width="190" height="38" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><path d="M202 167H286" fill="none" stroke-width="1.25" marker-end="url(#u32-arrow)" class="s-edge"></path></g><g><rect x="24" y="194" width="176" height="38" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="290" y="194" width="190" height="38" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><path d="M202 213H286" fill="none" stroke-width="1.25" marker-end="url(#u32-arrow)" class="s-edge"></path></g><g><rect x="24" y="240" width="176" height="38" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="290" y="240" width="190" height="38" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><path d="M202 259H286" fill="none" stroke-width="1.25" marker-end="url(#u32-arrow)" class="s-edge"></path></g><text x="36" y="72" font-weight="600" class="f-ink">파티클</text><text x="36" y="88" font-size="11.5" class="f-quiet">단락·누설 유발</text><text x="36" y="118" font-weight="600" class="f-ink">자연산화막</text><text x="36" y="134" font-size="11.5" class="f-quiet">컨택·비아 미개통</text><text x="36" y="164" font-weight="600" class="f-ink">금속 오염</text><text x="36" y="180" font-size="11.5" class="f-quiet">극소량에도 특성 변화</text><text x="36" y="210" font-weight="600" class="f-ink">유기물</text><text x="36" y="226" font-size="11.5" class="f-quiet">PR 잔류·두께 불균일</text><text x="36" y="256" font-weight="600" class="f-ink">마이크로 러프니스</text><text x="36" y="272" font-size="11.5" class="f-quiet">표면 저항 증가</text><text x="302" y="72" font-weight="600" class="f-ink">SC1(APM)</text><text x="302" y="88" font-size="11.5" class="f-quiet">NH₄OH + H₂O₂ + 물</text><text x="302" y="118" font-weight="600" class="f-ink">DHF</text><text x="302" y="134" font-size="11.5" class="f-quiet">물에 희석한 불산</text><text x="302" y="164" font-weight="600" class="f-ink">SC2(HPM)</text><text x="302" y="180" font-size="11.5" class="f-quiet">HCl + H₂O₂ + 물</text><text x="302" y="210" font-weight="600" class="f-ink">SPM · 오존수</text><text x="302" y="226" font-size="11.5" class="f-quiet">H₂SO₄ + H₂O₂, 약 120 °C</text><text x="302" y="256" font-weight="600" class="f-ink">조건 최적화</text><text x="302" y="272" font-size="11.5" class="f-quiet">약액 농도·온도·시간 관리</text></g><g><g><rect x="510" y="56" width="226" height="38" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect></g><g><rect x="510" y="102" width="226" height="38" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect></g><g><rect x="510" y="148" width="226" height="38" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect></g><g><rect x="510" y="194" width="226" height="38" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect></g><g><rect x="510" y="240" width="226" height="38" rx="8" fill-opacity="0.12" stroke-width="2" class="f-acc s-acc"></rect></g><text x="524" y="80" class="f-ink">① SPM: 유기물·PR 잔여물</text><text x="524" y="126" class="f-ink">② DHF: 자연산화막</text><text x="524" y="172" class="f-ink">③ SC1: 파티클</text><text x="524" y="218" class="f-ink">④ SC2: 금속 오염</text><text x="524" y="264" font-weight="600" class="f-ink">⑤ 건조: 스핀·IPA</text><text x="510" y="298" font-size="11.5" class="f-quiet">단계 사이마다 초순수(DIW) 린스</text></g><g><text x="24" y="314" font-size="12" font-weight="600" class="f-ink">표면 성질 · 물방울 모양으로 판단</text><path d="M40 360H160M400 360H520" fill="none" stroke-width="1.5" class="s-ink"></path><path d="M60 360Q100 340 140 360Z" fill-opacity="0.2" stroke-width="1.5" class="f-acc s-acc"></path><path d="M436 360C418 322 502 322 484 360Z" fill-opacity="0.2" stroke-width="1.5" class="f-acc s-acc"></path><text x="172" y="344" font-size="12" font-weight="600" class="f-ink">친수성(SiO₂)</text><text x="172" y="360" font-size="11.5" class="f-quiet">물이 퍼짐 · 접촉각 30° 이하</text><text x="530" y="344" font-size="12" font-weight="600" class="f-ink">소수성(HF 처리한 Si)</text><text x="530" y="360" font-size="11.5" class="f-quiet">물방울이 맺힘 · 60° 이상</text></g></svg>
