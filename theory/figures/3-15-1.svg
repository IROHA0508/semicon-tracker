<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-label="D램 셀 단면(활성영역과 STI, 매립 워드라인, 비트라인, 스토리지 노드 콘택과 랜딩 패드, 실린더 커패시터와 서포터)과 공정 순서 6단계" font-size="13" class="fig"><title>D램 셀 단면(활성영역과 STI, 매립 워드라인, 비트라인, 스토리지 노드 콘택과 랜딩 패드, 실린더 커패시터와 서포터)과 공정 순서 6단계</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><text x="24" y="26" font-size="15" font-weight="600" class="f-ink">D램 셀: 실리콘 속에 워드라인을 묻고, 위로 비트라인과 높은 커패시터를 쌓습니다</text><g><rect x="50" y="300" width="300" height="62" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="50" y="300" width="22" height="50" fill-opacity="0.25" class="f-edge"></rect><rect x="328" y="300" width="22" height="50" fill-opacity="0.25" class="f-edge"></rect><rect x="72" y="300" width="48" height="12" fill-opacity="0.3" class="f-acc"></rect><rect x="142" y="300" width="116" height="12" fill-opacity="0.3" class="f-acc"></rect><rect x="280" y="300" width="48" height="12" fill-opacity="0.3" class="f-acc"></rect><rect x="120" y="300" width="22" height="16" fill-opacity="0.35" class="f-edge"></rect><rect x="120" y="316" width="22" height="26" fill-opacity="0.6" class="f-acc2"></rect><rect x="258" y="300" width="22" height="16" fill-opacity="0.35" class="f-edge"></rect><rect x="258" y="316" width="22" height="26" fill-opacity="0.6" class="f-acc2"></rect><path d="M117 312V345Q131 352 145 345V312" fill="none" stroke-width="1.5" stroke-dasharray="3 2" class="s-acc"></path><rect x="188" y="250" width="24" height="50" fill-opacity="0.6" class="f-edge"></rect><rect x="160" y="232" width="80" height="18" rx="2" fill-opacity="0.55" class="f-ink"></rect><rect x="88" y="220" width="20" height="80" fill-opacity="0.5" class="f-edge"></rect><rect x="292" y="220" width="20" height="80" fill-opacity="0.5" class="f-edge"></rect><rect x="78" y="210" width="40" height="10" fill-opacity="0.45" class="f-ink"></rect><rect x="282" y="210" width="40" height="10" fill-opacity="0.45" class="f-ink"></rect><rect x="72" y="108" width="256" height="6" fill-opacity="0.35" class="f-edge"></rect><rect x="72" y="156" width="256" height="6" fill-opacity="0.35" class="f-edge"></rect><g><rect x="82" y="74" width="32" height="136" rx="3" fill-opacity="0.12" stroke-width="2" class="f-acc s-acc"></rect><rect x="90" y="74" width="16" height="128" fill-opacity="0.28" class="f-acc2"></rect></g><g><rect x="286" y="74" width="32" height="136" rx="3" fill-opacity="0.12" stroke-width="2" class="f-acc s-acc"></rect><rect x="294" y="74" width="16" height="128" fill-opacity="0.28" class="f-acc2"></rect></g><rect x="70" y="60" width="260" height="14" fill-opacity="0.3" stroke-width="1" class="f-acc2 s-acc2"></rect><path d="M330 67H350M318 140H350M328 111H350M320 215H350M312 260H350M61 350V368M131 352V368M269 342V368" fill="none" stroke-width="1" class="s-edge"></path><text x="354" y="71" font-size="12" class="f-ink">상부 전극(플레이트)</text><text x="354" y="115" font-size="12" class="f-ink">서포터(받침대)</text><text x="354" y="144" font-size="12" font-weight="600" class="f-ink">⑤ 커패시터(실린더)</text><text x="354" y="219" font-size="12" class="f-ink">④ 랜딩 패드</text><text x="354" y="264" font-size="12" class="f-ink">④ 스토리지 노드 콘택</text><text x="200" y="226" text-anchor="middle" font-size="12" class="f-ink">③ 비트라인·콘택</text><text x="61" y="382" text-anchor="middle" font-size="12" class="f-ink">① STI</text><text x="200" y="382" text-anchor="middle" font-size="12" class="f-ink">② 매립 워드라인(BCAT)</text><text x="200" y="400" text-anchor="middle" font-size="11.5" class="f-quiet">점선: 홈을 따라 U자로 길어진 채널</text></g><g><rect x="490" y="44" width="246" height="54" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="490" y="104" width="246" height="54" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="490" y="164" width="246" height="54" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="490" y="224" width="246" height="54" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="490" y="284" width="246" height="54" rx="8" fill-opacity="0.12" stroke-width="2" class="f-acc s-acc"></rect><rect x="490" y="344" width="246" height="54" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><text x="502" y="64" font-size="12.5" font-weight="600" class="f-ink">① 활성영역·STI</text><text x="502" y="80" font-size="11.5" class="f-quiet">사선 섬 패턴(SAQP·EUV)</text><text x="502" y="94" font-size="11.5" class="f-quiet">홈 식각 → 산화막 매립</text><text x="502" y="124" font-size="12.5" font-weight="600" class="f-ink">② 매립 워드라인</text><text x="502" y="140" font-size="11.5" class="f-quiet">실리콘 홈 → 게이트 산화막</text><text x="502" y="154" font-size="11.5" class="f-quiet">TiN·W 매립 → 질화막 덮개</text><text x="502" y="184" font-size="12.5" font-weight="600" class="f-ink">③ 비트라인</text><text x="502" y="200" font-size="11.5" class="f-quiet">가운데 콘택 → 금속 비트라인</text><text x="502" y="214" font-size="11.5" class="f-quiet">스페이서(에어갭)로 Cb↓</text><text x="502" y="244" font-size="12.5" font-weight="600" class="f-ink">④ 콘택·랜딩 패드</text><text x="502" y="260" font-size="11.5" class="f-quiet">트랜지스터와 커패시터를</text><text x="502" y="274" font-size="11.5" class="f-quiet">잇는 기둥과 착지판</text><text x="502" y="304" font-size="12.5" font-weight="600" class="f-ink">⑤ 커패시터</text><text x="502" y="320" font-size="11.5" class="f-quiet">몰드+서포터 → 깊은 홀 → TiN</text><text x="502" y="334" font-size="11.5" class="f-quiet">→ 몰드 제거 → High-k → 상부 전극</text><text x="502" y="364" font-size="12.5" font-weight="600" class="f-ink">⑥ 주변회로·배선</text><text x="502" y="380" font-size="11.5" class="f-quiet">감지 증폭기·디코더용 CMOS</text><text x="502" y="394" font-size="11.5" class="f-quiet">→ 금속배선 → 보호막 → EDS</text></g></svg>
