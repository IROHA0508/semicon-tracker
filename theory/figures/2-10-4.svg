<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-label="셀 커패시터와 비트라인 용량 비에 따른 전압 변화 비교와 셀 미세화가 센싱 마진을 줄이는 과정" font-size="12" class="fig"><title>셀 커패시터와 비트라인 용량 비에 따른 전압 변화 비교와 셀 미세화가 센싱 마진을 줄이는 과정</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="u210c-ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-edge"></path></marker></defs><text x="24" y="26" font-size="15" font-weight="600" class="f-ink">전하 공유는 작은 컵(셀)의 물을 큰 수조(비트라인)에 붓는 일입니다</text><rect x="24" y="44" width="344" height="200" fill="none" stroke-width="1" rx="10" class="s-edge"></rect><text x="36" y="66" font-size="12.5" font-weight="600" class="f-ink">지금: Cs : Cb = 1 : 5</text><text x="74" y="104" text-anchor="end" font-size="11.5" class="f-quiet">VDD</text><text x="74" y="164" text-anchor="end" font-size="11.5" class="f-quiet">VDD/2</text><text x="74" y="224" text-anchor="end" font-size="11.5" class="f-quiet">0</text><rect x="80" y="150" width="24" height="70" fill-opacity="0.3" class="f-acc"></rect><path d="M80 96 V220 H104 V96" fill="none" stroke-width="1.5" class="s-ink"></path><line x1="80" y1="100" x2="104" y2="100" stroke-width="2" stroke-dasharray="4 3" class="s-acc2"></line><line x1="104" y1="212" x2="116" y2="212" stroke-width="2" class="s-ink"></line><rect x="116" y="150" width="120" height="70" fill-opacity="0.3" class="f-acc"></rect><path d="M116 96 V220 H236 V96" fill="none" stroke-width="1.5" class="s-ink"></path><line x1="116" y1="160" x2="236" y2="160" stroke-width="1" stroke-dasharray="4 3" class="s-ink"></line><line x1="176" y1="160" x2="176" y2="149" stroke-width="2" class="s-acc"></line><text x="176" y="142" text-anchor="middle" font-size="12" font-weight="600" class="f-acc">ΔV ≈ 92 mV</text><text x="92" y="236" text-anchor="middle" font-size="11.5" class="f-quiet">셀(Cs)</text><text x="176" y="236" text-anchor="middle" font-size="11.5" class="f-quiet">비트라인(Cb)</text><rect x="392" y="44" width="344" height="200" fill="none" stroke-width="1" rx="10" class="s-edge"></rect><text x="404" y="66" font-size="12.5" font-weight="600" class="f-ink">셀이 작아지면: Cs : Cb = 1 : 10</text><text x="442" y="104" text-anchor="end" font-size="11.5" class="f-quiet">VDD</text><text x="442" y="164" text-anchor="end" font-size="11.5" class="f-quiet">VDD/2</text><text x="442" y="224" text-anchor="end" font-size="11.5" class="f-quiet">0</text><rect x="448" y="154.5" width="24" height="65.5" fill-opacity="0.3" class="f-acc"></rect><path d="M448 96 V220 H472 V96" fill="none" stroke-width="1.5" class="s-ink"></path><line x1="448" y1="100" x2="472" y2="100" stroke-width="2" stroke-dasharray="4 3" class="s-acc2"></line><line x1="472" y1="212" x2="484" y2="212" stroke-width="2" class="s-ink"></line><rect x="484" y="154.5" width="240" height="65.5" fill-opacity="0.3" class="f-acc"></rect><path d="M484 96 V220 H724 V96" fill="none" stroke-width="1.5" class="s-ink"></path><line x1="484" y1="160" x2="724" y2="160" stroke-width="1" stroke-dasharray="4 3" class="s-ink"></line><line x1="604" y1="160" x2="604" y2="153.5" stroke-width="2" class="s-acc"></line><text x="604" y="146.5" text-anchor="middle" font-size="12" font-weight="600" class="f-acc">ΔV ≈ 50 mV</text><text x="460" y="236" text-anchor="middle" font-size="11.5" class="f-quiet">셀(Cs)</text><text x="604" y="236" text-anchor="middle" font-size="11.5" class="f-quiet">비트라인(Cb)</text><text x="24" y="266" font-size="11.5" class="f-quiet">점선: 붓기 전 높이(셀은 VDD, 비트라인은 VDD/2) · 채운 부분: 부은 뒤 둘이 같아진 높이</text><text x="24" y="296" font-size="13" font-weight="600" class="f-ink">셀이 작아지면 생기는 일</text><rect x="24" y="308" width="126" height="34" stroke-width="1.2" rx="8" class="f-tint s-edge"></rect><text x="87" y="330" text-anchor="middle" font-size="12" font-weight="600" class="f-ink">셀 미세화</text><line x1="152" y1="325" x2="166" y2="325" stroke-width="1.5" marker-end="url(#u210c-ae)" class="s-edge"></line><rect x="168" y="308" width="126" height="34" stroke-width="1.2" rx="8" class="f-tint s-edge"></rect><text x="231" y="330" text-anchor="middle" font-size="12" font-weight="600" class="f-ink">Cs 줄어듦</text><line x1="296" y1="325" x2="310" y2="325" stroke-width="1.5" marker-end="url(#u210c-ae)" class="s-edge"></line><rect x="312" y="308" width="126" height="34" stroke-width="1.2" rx="8" class="f-tint s-edge"></rect><text x="375" y="330" text-anchor="middle" font-size="12" font-weight="600" class="f-ink">ΔV 줄어듦</text><line x1="440" y1="325" x2="454" y2="325" stroke-width="1.5" marker-end="url(#u210c-ae)" class="s-edge"></line><rect x="456" y="308" width="126" height="34" stroke-width="1.2" rx="8" class="f-tint s-edge"></rect><text x="519" y="330" text-anchor="middle" font-size="12" font-weight="600" class="f-ink">센싱 마진 감소</text><line x1="584" y1="325" x2="598" y2="325" stroke-width="1.5" marker-end="url(#u210c-ae)" class="s-edge"></line><rect x="600" y="308" width="126" height="34" fill-opacity="0.1" stroke-width="1.2" rx="8" class="f-acc2 s-acc2"></rect><text x="663" y="330" text-anchor="middle" font-size="12" font-weight="600" class="f-ink">0·1 잘못 판별</text><text x="24" y="370" font-size="11.5" class="f-quiet">대책: Cs 키우기(High-k 유전막, 더 높은 실린더) · Cb 줄이기(짧은 비트라인, 에어갭 스페이서)</text><text x="24" y="388" font-size="11.5" class="f-quiet">예시 숫자는 VDD 1.1 V, 셀에 1이 저장된 경우입니다. 붓고 나면 셀도 낮아지므로 다시 채워야 합니다(재기록).</text></svg>
