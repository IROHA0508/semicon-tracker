<svg xmlns="http://www.w3.org/2000/svg" width="760" height="344" viewBox="0 0 760 344" role="img" aria-label="산화막이 실리콘을 소모하며 자라는 모습, 건식과 습식 산화의 두께 곡선, 산화막의 쓰임" font-size="13" class="fig"><title>산화막이 실리콘을 소모하며 자라는 모습, 건식과 습식 산화의 두께 곡선, 산화막의 쓰임</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="u33-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-edge"></path></marker></defs><text x="24" y="26" font-size="15" font-weight="600" class="f-ink">산화막은 실리콘을 먹으며 자라고 습식은 빠르고 건식은 치밀합니다</text><g><text x="24" y="54" font-weight="600" class="f-ink">① 실리콘을 먹으며 자람</text><path d="M100 84V114" fill="none" stroke-width="1.5" marker-end="url(#u33-arrow)" class="s-edge"></path><path d="M150 84V114" fill="none" stroke-width="1.5" marker-end="url(#u33-arrow)" class="s-edge"></path><path d="M200 84V114" fill="none" stroke-width="1.5" marker-end="url(#u33-arrow)" class="s-edge"></path><text x="150" y="78" text-anchor="middle" font-size="11.5" class="f-quiet">O₂ 또는 H₂O, 약 800~1,200 °C</text><rect x="60" y="120" width="180" height="70" fill-opacity="0.15" stroke-width="1.5" class="f-acc2 s-acc2"></rect><rect x="60" y="190" width="180" height="110" stroke-width="1.25" class="f-tint s-edge"></rect><path d="M60 159H240" fill="none" stroke-width="1.25" stroke-dasharray="5 4" class="s-ink"></path><path d="M248 120H254V159H248M248 163H254V190H248" fill="none" stroke-width="1.25" class="s-edge"></path><text x="150" y="150" text-anchor="middle" font-size="11.5" class="f-quiet">점선 = 원래 표면</text><text x="150" y="180" text-anchor="middle" font-weight="600" class="f-ink">SiO₂</text><text x="150" y="250" text-anchor="middle" class="f-ink">실리콘 기판</text><text x="262" y="144" font-size="11.5" class="f-quiet">약 56% 위로</text><text x="262" y="180" font-size="11.5" class="f-quiet">약 44% 아래로</text><text x="60" y="322" font-size="11.5" class="f-quiet">막 두께의 약 44%만큼 실리콘이 소모됨</text></g><g><text x="340" y="54" font-weight="600" class="f-ink">② 시간에 따른 두께</text><path d="M346 290H524" fill="none" stroke-width="1.25" marker-end="url(#u33-arrow)" class="s-edge"></path><path d="M346 290V84" fill="none" stroke-width="1.25" marker-end="url(#u33-arrow)" class="s-edge"></path><path d="M346 290C376 210 426 150 520 118" fill="none" stroke-width="2.25" class="s-acc2"></path><path d="M346 290C386 262 446 240 520 222" fill="none" stroke-width="2.25" class="s-acc"></path><text x="526" y="122" font-size="12" font-weight="600" class="f-ink">습식</text><text x="526" y="226" font-size="12" font-weight="600" class="f-ink">건식</text><text x="354" y="96" font-size="11.5" class="f-quiet">산화막 두께</text><text x="520" y="282" text-anchor="end" font-size="11.5" class="f-quiet">시간</text><text x="340" y="312" font-size="11.5" class="f-quiet">습식: 빠름 → 두꺼운 필드·희생 산화막</text><text x="340" y="330" font-size="11.5" class="f-quiet">건식: 느리지만 치밀 → 게이트 산화막</text></g><g><text x="580" y="54" font-weight="600" class="f-ink">③ 산화막의 쓰임</text><rect x="580" y="66" width="156" height="44" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="580" y="118" width="156" height="44" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="580" y="170" width="156" height="44" rx="8" fill-opacity="1" stroke-width="1.25" class="f-tint s-edge"></rect><rect x="580" y="222" width="156" height="44" rx="8" fill-opacity="0.12" stroke-width="2" class="f-acc s-acc"></rect><text x="592" y="85" font-size="12.5" font-weight="600" class="f-ink">표면 보호</text><text x="592" y="101" font-size="11.5" class="f-quiet">긁힘·오염 차단</text><text x="592" y="137" font-size="12.5" font-weight="600" class="f-ink">소자 분리</text><text x="592" y="153" font-size="11.5" class="f-quiet">이웃 소자 절연</text><text x="592" y="189" font-size="12.5" font-weight="600" class="f-ink">주입 마스크·버퍼</text><text x="592" y="205" font-size="11.5" class="f-quiet">이온주입 막기·완충</text><text x="592" y="241" font-size="12.5" font-weight="600" class="f-ink">게이트 절연막</text><text x="592" y="257" font-size="11.5" class="f-quiet">소자 특성을 직접 결정</text></g></svg>
