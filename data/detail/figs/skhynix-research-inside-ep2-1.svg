<svg xmlns="http://www.w3.org/2000/svg" width="760" height="404" viewBox="0 0 760 404" role="img" aria-label="셀·논셀·페이지 공동 최적화의 효과" font-size="13" class="fig"><title>셀·논셀·페이지 공동 최적화의 효과</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="dsk1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-edge"/></marker></defs><text x="20" y="30" class="f-ink" text-anchor="start" font-size="16" font-weight="700">셀·논셀·페이지를 한 시스템으로 함께 최적화</text><rect x="20" y="50" width="230" height="190" rx="8" class="f-tint s-edge" stroke-width="1.2"/><text x="34" y="76" class="f-acc" text-anchor="start" font-size="15" font-weight="700">① 셀</text><text x="34" y="96" class="f-quiet" text-anchor="start" font-size="12.5">여러 전류 단계를 정밀하게</text><text x="34" y="126" class="f-ink" text-anchor="start" font-size="12.5">전압 고정 + 펄스 횟수로 쓰기</text><text x="34" y="150" class="f-ink" text-anchor="start" font-size="12.5">HZO 강유전체 도메인 스위칭</text><text x="34" y="174" class="f-ink" text-anchor="start" font-size="12.5">300mm 웨이퍼, 셀당 4단계</text><line x1="34" y1="196" x2="236" y2="196" class="s-grid" stroke-width="1"/><text x="34" y="220" class="f-acc2" text-anchor="start" font-size="12.5" font-weight="600">정밀한 아날로그 상태</text><line x1="135" y1="244" x2="380" y2="284" class="s-edge" stroke-width="1.5" marker-end="url(#dsk1)"/><rect x="265" y="50" width="230" height="190" rx="8" class="f-tint s-edge" stroke-width="1.2"/><text x="279" y="76" class="f-acc" text-anchor="start" font-size="15" font-weight="700">② 논셀(워드라인)</text><text x="279" y="96" class="f-quiet" text-anchor="start" font-size="12.5">전환 부담 줄이기</text><text x="279" y="126" class="f-ink" text-anchor="start" font-size="12.5">저저항 금속: 처리량 +16%·효율 +3%</text><text x="279" y="150" class="f-ink" text-anchor="start" font-size="12.5">에어갭: 기생 용량 −60%</text><text x="279" y="174" class="f-ink" text-anchor="start" font-size="12.5">→ 처리량 1.2배·효율 2배</text><line x1="279" y1="196" x2="481" y2="196" class="s-grid" stroke-width="1"/><text x="279" y="220" class="f-acc2" text-anchor="start" font-size="12.5" font-weight="600">함께: 처리량 1.4배·효율 2.2배</text><line x1="380" y1="244" x2="380" y2="284" class="s-edge" stroke-width="1.5" marker-end="url(#dsk1)"/><rect x="510" y="50" width="230" height="190" rx="8" class="f-tint s-edge" stroke-width="1.2"/><text x="524" y="76" class="f-acc" text-anchor="start" font-size="15" font-weight="700">③ 페이지</text><text x="524" y="96" class="f-quiet" text-anchor="start" font-size="12.5">연산 순서와 데이터 배치</text><text x="524" y="126" class="f-ink" text-anchor="start" font-size="12.5">IPP: 처리량 9배·효율 약 2배</text><text x="524" y="150" class="f-ink" text-anchor="start" font-size="12.5">분할 16KB → 4KB×4</text><text x="524" y="174" class="f-ink" text-anchor="start" font-size="12.5">→ 처리량 1.7배·효율 1.2배</text><line x1="524" y1="196" x2="726" y2="196" class="s-grid" stroke-width="1"/><text x="524" y="220" class="f-acc2" text-anchor="start" font-size="12.5" font-weight="600">최적 크기는 모델마다 다름</text><line x1="625" y1="244" x2="380" y2="284" class="s-edge" stroke-width="1.5" marker-end="url(#dsk1)"/><rect x="150" y="290" width="460" height="76" rx="10" class="f-tint s-acc" stroke-width="1.2"/><text x="380" y="318" class="f-quiet" text-anchor="middle" font-size="12.5">같은 칩 면적의 기존 3D 어레이 대비</text><text x="380" y="346" class="f-acc" text-anchor="middle" font-size="17" font-weight="700">처리량 약 10~20배 · 에너지 효율 약 4,000~5,000배</text><text x="20" y="392" class="f-quiet" text-anchor="start" font-size="11.5">수치는 원문이 밝힌 값. ①~③의 배수는 항목마다 비교 기준이 달라 서로 곱하지 않습니다.</text></svg>
