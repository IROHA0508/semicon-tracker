<svg xmlns="http://www.w3.org/2000/svg" width="760" height="354" viewBox="0 0 760 354" role="img" aria-label="iHBM은 열이 몰리는 곳에 직접 방열 경로를 만든다" font-size="13" class="fig"><title>iHBM은 열이 몰리는 곳에 직접 방열 경로를 만든다</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="f-ihbmsolution" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-edge"/></marker></defs><text x="20" y="30" class="f-ink" font-size="16" text-anchor="start" font-weight="700">iHBM은 열이 몰리는 곳에 직접 방열 경로를 만든다</text><rect x="30" y="60" width="184" height="92" rx="8" class="f-tint s-edge" stroke-width="1.2"/><text x="122" y="92" class="f-ink" font-size="16" text-anchor="middle" font-weight="700">D2D PHY</text><text x="122" y="114" class="f-quiet" font-size="12.5" text-anchor="middle">열이 가장 집중</text><text x="122" y="136" class="f-ink" font-size="12.5" text-anchor="middle">HBM-GPU 인터페이스</text><line x1="218" y1="106" x2="284" y2="106" class="s-acc" stroke-width="1.5" marker-end="url(#f-ihbmsolution)"/><text x="251" y="96" class="f-acc" font-size="12" text-anchor="middle" font-weight="700">직접 배치</text><rect x="288" y="60" width="184" height="92" rx="8" class="f-tint s-acc" stroke-width="1.2"/><text x="380" y="92" class="f-acc" font-size="16" text-anchor="middle" font-weight="700">ICE</text><text x="380" y="114" class="f-quiet" font-size="12.5" text-anchor="middle">통합 냉각 소자</text><text x="380" y="136" class="f-ink" font-size="12.5" text-anchor="middle">추가 방열 경로</text><line x1="476" y1="106" x2="542" y2="106" class="s-acc" stroke-width="1.5" marker-end="url(#f-ihbmsolution)"/><text x="509" y="96" class="f-acc" font-size="12" text-anchor="middle" font-weight="700">방열</text><rect x="546" y="60" width="184" height="92" rx="8" class="f-tint s-edge" stroke-width="1.2"/><text x="638" y="92" class="f-ink" font-size="16" text-anchor="middle" font-weight="700">열 배출</text><text x="638" y="114" class="f-quiet" font-size="12.5" text-anchor="middle">열저항 30% 감소</text><text x="638" y="136" class="f-ink" font-size="12.5" text-anchor="middle">안정적 동작</text><text x="30" y="196" class="f-acc" font-size="13.5" text-anchor="start" font-weight="700">기존</text><text x="170" y="196" class="f-ink" font-size="13" text-anchor="start">코어 다이 통한 간접 냉각</text><text x="410" y="196" class="f-quiet" font-size="12.5" text-anchor="start">원문: 코어 다이로 열을 빼냄</text><text x="30" y="230" class="f-acc" font-size="13.5" text-anchor="start" font-weight="700">iHBM</text><text x="170" y="230" class="f-ink" font-size="13" text-anchor="start">D2D PHY에 ICE 직접 배치</text><text x="410" y="230" class="f-quiet" font-size="12.5" text-anchor="start">추가 방열 경로 생성</text><text x="30" y="264" class="f-acc" font-size="13.5" text-anchor="start" font-weight="700">효과</