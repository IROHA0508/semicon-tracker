<svg xmlns="http://www.w3.org/2000/svg" width="760" height="392" viewBox="0 0 760 392" role="img" aria-label="엣지 AI에서 메모리의 세 과제 개념도" font-size="13" class="fig"><title>엣지 AI에서 메모리의 세 과제 개념도</title><style>.fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}@media (prefers-color-scheme:dark){.fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}}:root[data-theme="dark"] .fig{--fig-ink:#e5e8ec;--fig-quiet:#9ba5b2;--fig-edge:#6f7a87;--fig-grid:#3a414a;--fig-tint:#20252c;--fig-acc:#ef8a4c;--fig-acc2:#7ea8d6}:root[data-theme="light"] .fig{--fig-ink:#1a1f26;--fig-quiet:#5a6472;--fig-edge:#8a94a0;--fig-grid:#c9d0d8;--fig-tint:#eef1f4;--fig-acc:#b5541a;--fig-acc2:#376797}.fig .f-ink{fill:var(--fig-ink)}.fig .s-ink{stroke:var(--fig-ink)}.fig .f-quiet{fill:var(--fig-quiet)}.fig .s-quiet{stroke:var(--fig-quiet)}.fig .f-edge{fill:var(--fig-edge)}.fig .s-edge{stroke:var(--fig-edge)}.fig .f-grid{fill:var(--fig-grid)}.fig .s-grid{stroke:var(--fig-grid)}.fig .f-tint{fill:var(--fig-tint)}.fig .s-tint{stroke:var(--fig-tint)}.fig .f-acc{fill:var(--fig-acc)}.fig .s-acc{stroke:var(--fig-acc)}.fig .f-acc2{fill:var(--fig-acc2)}.fig .s-acc2{stroke:var(--fig-acc2)}</style><defs><marker id="dss1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-edge"/></marker></defs><text x="20" y="30" class="f-ink" text-anchor="start" font-size="16" font-weight="700">엣지 기기 안의 데이터 길: 메모리가 늦으면 xPU가 기다립니다</text><rect x="30" y="60" width="180" height="96" rx="8" class="f-tint s-edge" stroke-width="1.2"/><text x="120" y="92" class="f-ink" text-anchor="middle" font-size="16" font-weight="700">스토리지</text><text x="120" y="114" class="f-quiet" text-anchor="middle" font-size="12.5">NAND·SSD</text><text x="120" y="136" class="f-ink" text-anchor="middle" font-size="12.5">모델·데이터 보관</text><rect x="290" y="60" width="180" height="96" rx="8" class="f-tint s-acc" stroke-width="1.2"/><text x="380" y="92" class="f-acc" text-anchor="middle" font-size="16" font-weight="700">메모리</text><text x="380" y="114" class="f-quiet" text-anchor="middle" font-size="12.5">DRAM(LPDDR 등)</text><text x="380" y="136" class="f-ink" text-anchor="middle" font-size="12.5">가중치·컨텍스트를 담음</text><rect x="550" y="60" width="180" height="96" rx="8" class="f-tint s-edge" stroke-width="1.2"/><text x="640" y="92" class="f-ink" text-anchor="middle" font-size="16" font-weight="700">xPU</text><text x="640" y="114" class="f-quiet" text-anchor="middle" font-size="12.5">CPU·GPU·NPU</text><text x="640" y="136" class="f-ink" text-anchor="middle" font-size="12.5">연산</text><line x1="212" y1="108" x2="286" y2="108" class="s-edge" stroke-width="1.5" marker-end="url(#dss1)"/><line x1="472" y1="108" x2="546" y2="108" class="s-acc" stroke-width="1.5" marker-end="url(#dss1)"/><text x="509" y="98" class="f-acc" text-anchor="middle" font-size="12.5" font-weight="700">대역폭</text><text x="640" y="178" class="f-quiet" text-anchor="middle" font-size="12">데이터가 늦으면 '대기'</text><text x="30" y="206" class="f-acc" text-anchor="start" font-size="13.5" font-weight="700">① 용량</text><text x="140" y="206" class="f-ink" text-anchor="start" font-size="13">더 큰 모델·컨텍스트를 담을 공간</text><text x="400" y="206" class="f-quiet" text-anchor="start" font-size="12.5">부족하면 스토리지↔메모리 반복 이동 → 지연·전력 증가</text><text x="30" y="246" class="f-acc" text-anchor="start" font-size="13.5" font-weight="700">② 대역폭</text><text x="140" y="246" class="f-ink" text-anchor="start" font-size="13">메모리 → xPU 공급 속도</text><text x="400" y="246" class="f-quiet" text-anchor="start" font-size="12.5">모자라면 xPU 연산 자원을 다 못 씀</text><text x="30" y="286" class="f-acc" text-anchor="start" font-size="13.5" font-weight="700">③ 에너지 효율</text><text x="140" y="286" class="f-ink" text-anchor="start" font-size="13">배터리·전력 예산·발열 안에서</text><text x="400" y="286" class="f-quiet" text-anchor="start" font-size="12.5">데이터 이동 거리·횟수가 전력을 많이 씀</text><rect x="30" y="330" width="700" height="46" rx="8" class="f-tint s-edge" stroke-width="1.2"/><text x="380" y="359" class="f-ink" text-anchor="middle" font-size="13">해법 방향: 연산 장치와 메모리를 가깝게 · 데이터 이동 줄이기 · DRAM·NAND·로직·패키징을 시스템으로 묶기</text></svg>
